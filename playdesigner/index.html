<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach's Play Designer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:#0f0f0f;color:#eee;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;gap:8px}
h1{font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#555}
#wrap{width:100%;max-width:820px;border:1px solid #222;border-radius:6px;overflow:hidden}
#tb{display:flex;flex-wrap:wrap;gap:5px;padding:7px 8px;background:#181818;align-items:center;border-bottom:1px solid #222}
#tb select,#tb button{font-size:11px;padding:4px 9px;border-radius:4px;border:1px solid #333;background:#222;color:#ccc;cursor:pointer}
#tb button:hover{background:#2a2a2a}
#tb button.act{background:#185FA5;color:#fff;border-color:#185FA5}
#tb .sep{width:1px;height:20px;background:#333;margin:0 2px;flex-shrink:0}
#tb label{font-size:11px;color:#555;white-space:nowrap}
canvas{display:block;width:100%;touch-action:none;cursor:crosshair}
#leg{display:flex;gap:10px;padding:5px 10px;font-size:10px;color:#444;background:#141414;flex-wrap:wrap;border-top:1px solid #1e1e1e}
.li{display:flex;align-items:center;gap:3px}
#notes-wrap{width:100%;max-width:820px;display:flex;flex-direction:column;gap:4px}
#notes-wrap label{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#555}
#notes{width:100%;min-height:72px;resize:vertical;background:#141414;color:#ccc;border:1px solid #222;border-radius:6px;padding:8px 10px;font-size:13px;font-family:inherit;line-height:1.45}
#notes:focus{outline:none;border-color:#185FA5}
#notes::placeholder{color:#444}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;align-items:center;justify-content:center;padding:12px}
#modal.open{display:flex}
#modal .box{background:#181818;border:1px solid #222;border-radius:6px;width:100%;max-width:360px;max-height:75vh;display:flex;flex-direction:column;overflow:hidden}
#modal .hd{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:#181818;border-bottom:1px solid #222;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#888}
#modal .hd button{font-size:11px;padding:4px 9px;border-radius:4px;border:1px solid #333;background:#222;color:#ccc;cursor:pointer}
#modal .hd button:hover{background:#2a2a2a}
#modal-list{overflow:auto}
#modal .pl{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid #1e1e1e;font-size:12px;color:#ccc}
#modal .pl:last-child{border-bottom:none}
#modal .pl .nm{flex:1;min-width:0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#modal .pl .nm:hover{color:#fff}
#modal .pl .nm .dt{font-size:10px;color:#555;margin-left:6px}
#modal .pl button{font-size:11px;padding:3px 8px;border-radius:4px;border:1px solid #633;background:#222;color:#c66;cursor:pointer;flex-shrink:0}
#modal .pl button:hover{background:#2a2a2a}
#modal .empty{padding:18px 12px;font-size:12px;color:#555;text-align:center}
#ctxmenu{display:none;position:fixed;z-index:200;background:#181818;border:1px solid #333;border-radius:6px;padding:4px;min-width:148px;max-height:260px;overflow:auto;box-shadow:0 6px 22px rgba(0,0,0,0.55)}
#ctxmenu.open{display:block}
#ctxmenu .ttl{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#777;padding:5px 8px 6px;border-bottom:1px solid #2a2a2a;margin-bottom:3px}
#ctxmenu button{display:block;width:100%;text-align:left;font-size:12px;padding:6px 9px;border:none;background:none;color:#ccc;cursor:pointer;border-radius:4px}
#ctxmenu button:hover{background:#244}
</style>
</head>
<body>
<h1>Coach's Play Designer</h1>
<div id="wrap">
  <div id="tb">
    <label>Formation:</label>
    <select id="sel-form">
      <option value="">-- select --</option>
      <optgroup label="Shotgun">
        <option value="gun_2x2">Gun 2x2</option>
        <option value="gun_2x2_te">Gun 2x2 TE on line</option>
        <option value="gun_2x2_yoff">Gun 2x2 Y-off / sniffer</option>
        <option value="gun_3x1">Gun 3x1</option>
        <option value="gun_3x1_te">Gun 3x1 TE on line</option>
        <option value="gun_3x1_yoff">Gun 3x1 Y-off / sniffer</option>
        <option value="gun_3x1_back">Gun 3x1 backs both sides</option>
        <option value="gun_2x2_back">Gun 2x2 backs both sides</option>
        <option value="gun_empty">Gun Empty</option>
      </optgroup>
      <optgroup label="Ace / Singleback">
        <option value="ace_2x2">Ace 2x2</option>
        <option value="ace_2x2_te">Ace 2x2 TE on line</option>
        <option value="ace_trips">Ace Trips</option>
      </optgroup>
      <optgroup label="Under Center">
        <option value="i_form">I-Formation</option>
        <option value="i_form_trips">I-Form Trips</option>
        <option value="pro_form">Pro Formation</option>
        <option value="pistol_2x2">Pistol 2x2</option>
      </optgroup>
    </select>
    <div class="sep"></div>
    <label>Ball:</label>
    <select id="sel-hash">
      <option value="mof">MOF</option>
      <option value="lh">Left Hash</option>
      <option value="rh">Right Hash</option>
      <option value="lm">Left Mid</option>
      <option value="rm">Right Mid</option>
    </select>
    <div class="sep"></div>
    <button id="t-route" class="act">Route</button>
    <button id="t-arrow">Arrow</button>
    <button id="t-block">Block</button>
    <button id="t-erase">Erase</button>
    <div class="sep"></div>
    <button id="t-runfit">Run Fit</button>
    <button id="t-passrush">Pass Rush</button>
    <button id="t-coverage">Coverage</button>
    <label>Cov:</label>
    <select id="sel-cov">
      <option value="">-- preset --</option>
      <option value="0">Cover 0</option>
      <option value="1">Cover 1</option>
      <option value="2">Cover 2</option>
      <option value="3">Cover 3</option>
      <option value="4">Cover 4</option>
    </select>
    <div class="sep"></div>
    <button id="btn-undo">Undo</button>
    <button id="btn-clear" style="color:#c66;border-color:#633">Clear routes</button>
    <button id="btn-save">Save PNG</button>
    <div class="sep"></div>
    <button id="btn-saveplay">Save Play</button>
    <button id="btn-loadplay">Load Play</button>
  </div>
  <canvas id="c"></canvas>
  <div id="leg">
    <div class="li"><svg width="13" height="13"><rect x="1" y="1" width="11" height="11" fill="#185FA5" rx="1"/></svg> C locked</div>
    <div class="li"><svg width="13" height="13"><circle cx="6" cy="6" r="5" fill="#185FA5"/></svg> OL locked</div>
    <div class="li"><svg width="13" height="13"><circle cx="6" cy="6" r="5" fill="#378ADD"/></svg> Offense drag</div>
    <div class="li"><svg width="13" height="13"><circle cx="6" cy="6" r="5" fill="#1D9E75"/></svg> QB</div>
    <div class="li"><svg width="13" height="13"><circle cx="6" cy="6" r="5" fill="#A32D2D"/></svg> Defense drag</div>
    <div class="li" style="margin-left:auto;color:#333">drag players · draw routes · save PNG</div>
  </div>
</div>

<div id="notes-wrap">
  <label for="notes">Notes</label>
  <textarea id="notes" placeholder="Play notes, coaching points, reads…"></textarea>
</div>

<div id="modal"><div class="box">
  <div class="hd"><span>Saved Plays</span><button id="modal-close">Close</button></div>
  <div id="modal-list"></div>
</div></div>

<div id="ctxmenu"></div>

<script>
var C=document.getElementById('c'),ctx=C.getContext('2d');
var W,H,YD,YD_V,LOS,LH_X,RH_X,hashPos,SL_WR,SLOT_IN,QB_Y,RB_Y;
var OL_G=22,OL_T=22;
var ballX=0;
var players=[],routes=[],hist=[],assigns=[],zones=[];
var uid=0;function nextId(){return ++uid;}
var tool='route',drawing=false,curPts=[],dragIdx=-1,dragOff={x:0,y:0},arcStart=null,dragAssign=-1,zoneDrag=null,lastClient={x:0,y:0};

function saveH(){hist.push({p:JSON.stringify(players),r:JSON.stringify(routes),a:JSON.stringify(assigns),z:JSON.stringify(zones)});if(hist.length>50)hist.shift();}

function setSize(){
  var pw=document.getElementById('wrap').clientWidth;
  C.width=pw; C.height=Math.round(pw*(540/820));
  W=C.width; H=C.height;
  YD=W/53.33;
  YD_V=H/35;
  LOS=Math.round(H*0.60);
  LH_X=Math.round(W*(53.33/160));
  RH_X=W-LH_X;
  hashPos={mof:W/2,lh:LH_X,rh:RH_X,lm:Math.round((LH_X+W/2)/2),rm:Math.round((RH_X+W/2)/2)};
  SL_WR=Math.round(3*YD);
  SLOT_IN=Math.round(6*YD);
  OL_G=Math.round(R()*2.6);OL_T=Math.round(R()*2.6);
  QB_Y=LOS+42; RB_Y=LOS+65;
  if(!ballX)ballX=W/2;
}

function drawField(){
  var yc=H*0.5; // 50-yard line at the vertical center of the view
  // alternating 5-yard turf bands (run across the field, perpendicular to the sidelines)
  for(var d=-120;d<120;d+=5){
    var ya=yc-d*YD_V, yb=yc-(d+5)*YD_V;
    var top=Math.min(ya,yb), bh=Math.abs(yb-ya);
    if(top>H||top+bh<0)continue;
    var idx=Math.round(d/5);
    ctx.fillStyle=(((idx%2)+2)%2===0)?'#2d4a1d':'#273f1a';
    ctx.fillRect(0,top,W,bh);
  }
  // yard lines every 5 yards
  ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=1;
  for(var d=-120;d<=120;d+=5){
    var py=yc-d*YD_V;
    if(py<0||py>H)continue;
    ctx.beginPath();ctx.moveTo(0,py);ctx.lineTo(W,py);ctx.stroke();
  }
  // yard numbers every 10 yards, near both sidelines (…40,50,40… counting from midfield)
  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.font='bold '+Math.max(10,Math.round(W/68))+'px sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(var d=-120;d<=120;d+=10){
    var py=yc-d*YD_V;
    if(py<16||py>H-16)continue;
    var dist=Math.abs(d)%100, n=dist<=50?50-dist:dist-50;
    if(n<=0)continue;
    ctx.fillText(''+n,24,py);
    ctx.fillText(''+n,W-24,py);
  }
  // line of scrimmage (ball spot)
  ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(0,LOS);ctx.lineTo(W,LOS);ctx.stroke();
  // hash marks
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1.5;ctx.setLineDash([3,5]);
  ctx.beginPath();ctx.moveTo(LH_X,0);ctx.lineTo(LH_X,H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(RH_X,0);ctx.lineTo(RH_X,H);ctx.stroke();
  ctx.setLineDash([]);
  // sidelines
  ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(2,0);ctx.lineTo(2,H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W-2,0);ctx.lineTo(W-2,H);ctx.stroke();
}
function drawBall(){
  var rx=Math.max(7,Math.round(W/95)),ry=Math.max(4,Math.round(W/150));
  ctx.save();
  ctx.translate(ballX,LOS);
  ctx.fillStyle='#7a4a24';ctx.strokeStyle='#321f0e';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.strokeStyle='#fff';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(-rx*0.45,0);ctx.lineTo(rx*0.45,0);ctx.stroke();
  for(var i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*rx*0.18,-ry*0.45);ctx.lineTo(i*rx*0.18,ry*0.45);ctx.stroke();}
  ctx.restore();
}

function R(){return Math.max(7,Math.round(W/78));}

function drawPlayer(pl){
  var r=R();
  ctx.save();
  ctx.fillStyle=pl.color;
  ctx.strokeStyle=pl.locked?'rgba(255,255,255,0.3)':'rgba(255,255,255,0.85)';
  ctx.lineWidth=pl.locked?1:1.5;
  if(pl.shape==='sq'){ctx.fillRect(pl.x-r,pl.y-r,r*2,r*2);ctx.strokeRect(pl.x-r,pl.y-r,r*2,r*2);}
  else{ctx.beginPath();ctx.arc(pl.x,pl.y,r,0,Math.PI*2);ctx.fill();ctx.stroke();}
  ctx.fillStyle='#fff';
  ctx.font='bold '+Math.max(7,Math.round(r*0.85))+'px sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(pl.label,pl.x,pl.y+0.5);
  if(pl.dl){
    ctx.fillStyle='rgba(255,215,80,0.75)';
    ctx.font=Math.max(7,Math.round(r*0.75))+'px sans-serif';
    ctx.textBaseline='top';
    ctx.fillText(pl.dl,pl.x,pl.y+r+2);
  }
  ctx.restore();
}

function drawArrow(x1,y1,x2,y2,col){
  var dx=x2-x1,dy=y2-y1,ang=Math.atan2(dy,dx);
  ctx.save();ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=2.5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-12*Math.cos(ang-0.4),y2-12*Math.sin(ang-0.4));
  ctx.lineTo(x2-12*Math.cos(ang+0.4),y2-12*Math.sin(ang+0.4));
  ctx.closePath();ctx.fill();ctx.restore();
}
function drawArc(x1,y1,x2,y2,col){
  var mx=(x1+x2)/2,my=Math.min(y1,y2)-30;
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(mx,my,x2,y2);ctx.stroke();ctx.restore();
}

function render(){
  drawField();
  zones.forEach(drawZone);
  routes.forEach(function(r){
    ctx.save();ctx.strokeStyle=r.col;ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';
    if(r.type==='route'){ctx.setLineDash([6,3]);ctx.beginPath();r.pts.forEach(function(p,i){i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);});ctx.stroke();ctx.setLineDash([]);}
    else if(r.type==='arrow'){drawArrow(r.x1,r.y1,r.x2,r.y2,r.col);}
    else{drawArc(r.x1,r.y1,r.x2,r.y2,r.col);}
    ctx.restore();
  });
  if(drawing&&tool==='route'&&curPts.length>1){
    ctx.save();ctx.strokeStyle='#5af';ctx.lineWidth=2;ctx.setLineDash([5,3]);ctx.lineCap='round';
    ctx.beginPath();curPts.forEach(function(p,i){i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);});
    ctx.stroke();ctx.setLineDash([]);ctx.restore();
  }
  assigns.forEach(drawAssign);
  players.forEach(drawPlayer);
  drawBall();
}

function mk(x,y,lb,sh,col,lk,dl){return{id:nextId(),x:x,y:y,label:lb,shape:sh||'circle',color:col,locked:!!lk,dl:dl||null};}

function OL(){
  return[
    mk(ballX,LOS,'C','sq','#185FA5',true),
    mk(ballX-OL_G,LOS,'LG','circle','#185FA5',true),
    mk(ballX+OL_G,LOS,'RG','circle','#185FA5',true),
    mk(ballX-OL_G-OL_T,LOS,'LT','circle','#185FA5',true),
    mk(ballX+OL_G+OL_T,LOS,'RT','circle','#185FA5',true),
  ];
}

var O='#378ADD',Q='#1D9E75',D='#A32D2D';
var SLOT=function(){return Math.round(6*YD);};

var F={
  gun_2x2:function(){return OL().concat([
    mk(SL_WR,LOS,'X','circle',O),mk(W-SL_WR,LOS,'Z','circle',O),
    mk(ballX-OL_G-OL_T-SLOT(),LOS+8,'H','circle',O),
    mk(ballX+OL_G+OL_T+SLOT(),LOS+8,'Y','circle',O),
    mk(ballX,QB_Y,'QB','circle',Q),mk(ballX-18,RB_Y,'RB','circle',O),
  ]);},
  gun_2x2_te:function(){return OL().concat([
    mk(SL_WR,LOS,'X','circle',O),mk(W-SL_WR,LOS,'Z','circle',O),
    mk(ballX+OL_G+OL_T+OL_T,LOS,'Y','circle',O),
    mk(ballX-OL_G-OL_T-SLOT(),LOS+8,'H','circle',O),
    mk(ballX,QB_Y,'QB','circle',Q),mk(ballX-18,RB_Y,'RB','circle',O),
  ]);},
  gun_2x2_yoff:function(){return OL().concat([
    mk(SL_WR,LOS,'X','circle',O),mk(W-SL_WR,LOS,'Z','circle',O),
    mk(ballX-OL_G-OL_T-SLOT(),LOS+8,'H','circle',O),
    mk(ballX+OL_G+OL_T+Math.round(3*YD),LOS+30,'Y','circle',O),
    mk(ballX,QB_Y,'QB','circle',Q),mk(ballX-18,RB_Y,'RB','circle',O),
  ]);},
  gun_3x1:function(){return OL().concat([
    mk(SL_WR,LOS,'X','circle',O),
    mk(W-SL_WR,LOS,'Z','circle',O),
    mk(W-SL_WR-Math.round(4*YD),LOS,'Y','circle',O),
    mk(W-SL_WR-Math.round(8*YD),LOS+8,'H','circle',O),
    mk(ballX,QB_Y,'QB','circle',Q),mk(ballX-18,RB_Y,'RB','circle',O),
  ]);},
  gun_3x1_te:function(){return OL().concat([
    mk(SL_WR,LOS,'X','circle',O),
    mk(ballX+OL_G+OL_T+OL_T,LOS,'Y','circle',O),
    mk(W-SL_WR,LOS,'Z','circle',O),
    mk(W-SL_WR-Math.round(4*YD),LOS+8,'H','circle',O),
    mk(ballX,QB_Y,'QB','circle',Q),mk(ballX-18,RB_Y,'RB','circle',O),
  ]);},
  gun_3x1_yoff:function(){return OL().concat([
    mk(SL_WR,LOS,'X','circle',O),
    mk(W-SL_WR,LOS,'Z','circle',O),
    mk(W-SL_WR-Math.round(4*YD),LOS,'H','circle',O),
    mk(ballX+OL_G+OL_T+Math.round(3*YD),LOS+30,'Y','circle',O),
    mk(ballX,QB_Y,'QB','circle',Q),mk(ballX-18,RB_Y,'RB','circle',O),
  ]);},
  gun_3x1_back:function(){return OL().concat([
    mk(SL_WR,LOS,'X','circle',O),
    mk(W-SL_WR,LOS,'Z','circle',O),
    mk(W-SL_WR-Math.round(4*YD),LOS,'Y','circle',O),
    mk(W-SL_WR-Math.round(8*YD),LOS+8,'H','circle',O),
    mk(ballX,QB_Y,'QB','circle',Q),
    mk(ballX-28,RB_Y,'RB','circle',O),mk(ballX+28,RB_Y,'FB','circle',O),
  ]);},
  gun_2x2_back:function(){return OL().concat([
    mk(SL_WR,LOS,'X','circle',O),mk(W-SL_WR,LOS,'Z','circle',O),
    mk(ballX-OL_G-OL_T-SLOT(),LOS+8,'H','circle',O),
    mk(ballX+OL_G+OL_T+SLOT(),LOS+8,'Y','circle',O),
    mk(ballX,QB_Y,'QB','circle',Q),
    mk(ballX-28,RB_Y,'RB','circle',O),mk(ballX+28,RB_Y,'FB','circle',O),
  ]);},
  gun_empty:function(){return OL().concat([
    mk(SL_WR,LOS,'X','circle',O),
    mk(ballX-OL_G-OL_T-Math.round(3*YD),LOS,'H','circle',O),
    mk(ballX+OL_G+OL_T+Math.round(3*YD),LOS,'Y','circle',O),
    mk(W-SL_WR-Math.round(4*YD),LOS,'A','circle',O),
    mk(W-SL_WR,LOS,'Z','circle',O),
    mk(ballX,QB_Y,'QB','circle',Q),
  ]);},
  ace_2x2:function(){return OL().concat([
    mk(SL_WR,LOS,'X','circle',O),mk(W-SL_WR,LOS,'Z','circle',O),
    mk(ballX-OL_G-OL_T-SLOT(),LOS+8,'H','circle',O),
    mk(ballX+OL_G+OL_T+SLOT(),LOS+8,'Y','circle',O),
    mk(ballX,LOS+18,'QB','circle',Q),mk(ballX,LOS+55,'RB','circle',O),
  ]);},
  ace_2x2_te:function(){return OL().concat([
    mk(SL_WR,LOS,'X','circle',O),mk(W-SL_WR,LOS,'Z','circle',O),
    mk(ballX+OL_G+OL_T+OL_T,LOS,'Y','circle',O),
    mk(ballX-OL_G-OL_T-SLOT(),LOS+8,'H','circle',O),
    mk(ballX,LOS+18,'QB','circle',Q),mk(ballX,LOS+55,'RB','circle',O),
  ]);},
  ace_trips:function(){return OL().concat([
    mk(SL_WR,LOS,'X','circle',O),
    mk(W-SL_WR,LOS,'Z','circle',O),
    mk(W-SL_WR-Math.round(4*YD),LOS,'Y','circle',O),
    mk(W-SL_WR-Math.round(8*YD),LOS+8,'H','circle',O),
    mk(ballX,LOS+18,'QB','circle',Q),mk(ballX,LOS+55,'RB','circle',O),
  ]);},
  i_form:function(){return OL().concat([
    mk(SL_WR,LOS,'X','circle',O),mk(W-SL_WR,LOS,'Z','circle',O),
    mk(ballX+OL_G+OL_T+OL_T,LOS,'Y','circle',O),
    mk(ballX,LOS+18,'QB','circle',Q),
    mk(ballX,LOS+46,'FB','circle',O),mk(ballX,LOS+78,'RB','circle',O),
  ]);},
  i_form_trips:function(){return OL().concat([
    mk(SL_WR,LOS,'X','circle',O),
    mk(ballX+OL_G+OL_T+OL_T,LOS,'Y','circle',O),
    mk(W-SL_WR,LOS,'Z','circle',O),
    mk(W-SL_WR-Math.round(4*YD),LOS,'H','circle',O),
    mk(ballX,LOS+18,'QB','circle',Q),
    mk(ballX,LOS+46,'FB','circle',O),mk(ballX,LOS+78,'RB','circle',O),
  ]);},
  pro_form:function(){return OL().concat([
    mk(SL_WR,LOS,'X','circle',O),mk(W-SL_WR,LOS,'Z','circle',O),
    mk(ballX-OL_G-OL_T-OL_T,LOS,'Y','circle',O),
    mk(ballX+OL_G+OL_T+OL_T,LOS,'TE','circle',O),
    mk(ballX,LOS+18,'QB','circle',Q),mk(ballX,LOS+55,'RB','circle',O),
  ]);},
  pistol_2x2:function(){return OL().concat([
    mk(SL_WR,LOS,'X','circle',O),mk(W-SL_WR,LOS,'Z','circle',O),
    mk(ballX-OL_G-OL_T-SLOT(),LOS+8,'H','circle',O),
    mk(ballX+OL_G+OL_T+SLOT(),LOS+8,'Y','circle',O),
    mk(ballX,LOS+25,'QB','circle',Q),mk(ballX,LOS+65,'RB','circle',O),
  ]);},
};

function autoDef(key){
  var trips=(key.indexOf('3x1')>=0||key.indexOf('trips')>=0||key.indexOf('empty')>=0);
  var DLY=LOS-Math.round(1.2*YD_V);
  var MIKEY=LOS-Math.round(4.5*YD_V);
  var WILLY=LOS-Math.round(5*YD_V);
  var NICKY=LOS-Math.round(4.5*YD_V);
  var CBY=LOS-Math.round(1.2*YD_V);
  var SY=LOS-Math.round(12*YD_V);
  var nickX=trips?W-SL_WR-Math.round(2*YD):ballX+Math.round(4*YD);
  var willX=ballX-Math.round(3.5*YD);
  var mikeX=ballX+Math.round(1.5*YD);
  return[
    mk(ballX-Math.round(2*YD),DLY,'3T','circle',D),
    mk(ballX+Math.round(2*YD),DLY,'1T','circle',D),
    mk(ballX-Math.round(4.5*YD),DLY,'DE','circle',D),
    mk(ballX+Math.round(4.5*YD),DLY,'DE','circle',D),
    mk(willX,WILLY,'WILL','circle',D,false,'5 yds'),
    mk(mikeX,MIKEY,'MIKE','circle',D,false,'4-5 yds'),
    mk(nickX,NICKY,'NICK','circle',D),
    mk(SL_WR+Math.round(YD),CBY,'CB','circle',D),
    mk(W-SL_WR-Math.round(YD),CBY,'CB','circle',D),
    mk(ballX-Math.round(3*YD),SY,'FS','circle',D),
    mk(ballX+Math.round(3*YD),SY,'SS','circle',D),
  ];
}

function loadForm(key){
  if(!key||!F[key])return;

  players=F[key]().concat(autoDef(key));

function gp(e){
  var r=C.getBoundingClientRect(),s=e.touches?e.touches[0]:e;
  return{x:(s.clientX-r.left)*(C.width/r.width),y:(s.clientY-r.top)*(C.height/r.height)};
}
function hitP(x,y){
  var r=R()+2;
  for(var i=players.length-1;i>=0;i--){
    if(players[i].locked)continue;
    if(Math.hypot(x-players[i].x,y-players[i].y)<r)return i;
  }return -1;
}
function hitR(x,y){
  for(var i=routes.length-1;i>=0;i--){
    var r=routes[i];
    if(r.type==='route'){
      for(var j=0;j<r.pts.length-1;j++){
        var dx=r.pts[j+1].x-r.pts[j].x,dy=r.pts[j+1].y-r.pts[j].y,len=Math.sqrt(dx*dx+dy*dy);
        if(len<1)continue;
        var t=Math.max(0,Math.min(1,((x-r.pts[j].x)*dx+(y-r.pts[j].y)*dy)/(len*len)));
        if(Math.hypot(x-r.pts[j].x-t*dx,y-r.pts[j].y-t*dy)<10)return i;
      }
    } else if(Math.hypot(x-r.x1,y-r.y1)<14||Math.hypot(x-r.x2,y-r.y2)<14)return i;
  }return -1;
}
function onDown(pos){
  if(tool==='erase'){
    saveH();
    var pe=hitP(pos.x,pos.y);if(pe>=0){var rid=players[pe].id;players.splice(pe,1);assigns=assigns.filter(function(a){return a.pid!==rid;});render();return;}
    var ae=hitAssign(pos.x,pos.y);if(ae>=0){assigns.splice(ae,1);render();return;}
    var ze=hitZone(pos.x,pos.y);if(ze>=0){zones.splice(ze,1);render();return;}
    var re=hitR(pos.x,pos.y);if(re>=0){routes.splice(re,1);render();return;}
    return;
  }
  if(tool==='runfit'||tool==='passrush'){
    var hh=hitAssignHead(pos.x,pos.y);if(hh>=0){dragAssign=hh;return;}
    var pm=hitP(pos.x,pos.y);if(pm>=0){openMenu(pm,pos);return;}
    return;
  }
  if(tool==='coverage'){
    var zh=hitZone(pos.x,pos.y);
    if(zh>=0){zoneDrag={i:zh,mode:zoneVal(zones[zh],pos.x,pos.y)>0.6?'resize':'move',ox:pos.x-zones[zh].x,oy:pos.y-zones[zh].y};return;}
    var pc=hitP(pos.x,pos.y);if(pc>=0){dragIdx=pc;dragOff={x:pos.x-players[pc].x,y:pos.y-players[pc].y};return;}
    return;
  }
  var pi=hitP(pos.x,pos.y);
  if(pi>=0){dragIdx=pi;dragOff={x:pos.x-players[pi].x,y:pos.y-players[pi].y};return;}
  drawing=true;
  if(tool==='route')curPts=[pos];
  else arcStart=pos;
}
function onMove(pos){
  if(dragIdx>=0){players[dragIdx].x=pos.x-dragOff.x;players[dragIdx].y=pos.y-dragOff.y;render();return;}
  if(dragAssign>=0){assigns[dragAssign].tx=pos.x;assigns[dragAssign].ty=pos.y;render();return;}
  if(zoneDrag){var z=zones[zoneDrag.i];if(zoneDrag.mode==='move'){z.x=pos.x-zoneDrag.ox;z.y=pos.y-zoneDrag.oy;}else{z.rx=Math.max(16,Math.abs(pos.x-z.x));z.ry=Math.max(12,Math.abs(pos.y-z.y));}render();return;}
  if(!drawing)return;
  if(tool==='route'){curPts.push(pos);render();}
  else if(arcStart){
    render();
    if(tool==='arrow')drawArrow(arcStart.x,arcStart.y,pos.x,pos.y,'#5af');
    else drawArc(arcStart.x,arcStart.y,pos.x,pos.y,'#5af');
  }
}
function onUp(pos){
  if(dragIdx>=0){saveH();dragIdx=-1;render();return;}
  if(dragAssign>=0){saveH();dragAssign=-1;render();return;}
  if(zoneDrag){saveH();zoneDrag=null;render();return;}
  if(!drawing)return;drawing=false;
  if(tool==='route'&&curPts.length>1){saveH();routes.push({type:'route',pts:curPts.slice(),col:'#5af'});curPts=[];}
  else if(arcStart){saveH();routes.push({type:tool,x1:arcStart.x,y1:arcStart.y,x2:pos.x,y2:pos.y,col:'#5af'});arcStart=null;}
  render();
}

C.addEventListener('mousedown',function(e){lastClient={x:e.clientX,y:e.clientY};onDown(gp(e));});
C.addEventListener('mousemove',function(e){onMove(gp(e));});
C.addEventListener('mouseup',function(e){onUp(gp(e));});
C.addEventListener('touchstart',function(e){e.preventDefault();var tt=e.touches[0];if(tt)lastClient={x:tt.clientX,y:tt.clientY};onDown(gp(e));},{passive:false});

/* ---- Save / Load plays (localStorage) ---- */
var PKEY='cpd_plays',MAXPLAYS=50;
function getPlays(){try{var v=JSON.parse(localStorage.getItem(PKEY));return Array.isArray(v)?v:[];}catch(e){return [];}}
function setPlays(a){try{localStorage.setItem(PKEY,JSON.stringify(a));return true;}catch(e){alert('Could not save — browser storage is full or unavailable.');return false;}}

function savePlay(){
  var name=prompt('Play name:');
  if(name===null)return;
  name=name.trim();
  if(!name){alert('Please enter a name for the play.');return;}
  var plays=getPlays(),idx=-1;
  for(var i=0;i<plays.length;i++){if(plays[i].name===name){idx=i;break;}}
  if(idx<0&&plays.length>=MAXPLAYS){alert('Maximum of '+MAXPLAYS+' saved plays reached. Delete one first.');return;}
  if(idx>=0&&!confirm('A play named "'+name+'" already exists. Overwrite it?'))return;
  var play={name:name,ts:Date.now(),ballX:ballX,players:players,routes:routes,notes:notesEl.value,assigns:assigns,zones:zones};
  if(idx>=0)plays[idx]=play;else plays.push(play);
  setPlays(plays);
}

function loadPlay(p){
  saveH();
  if(typeof p.ballX==='number')ballX=p.ballX;
  players=JSON.parse(JSON.stringify(p.players||[]));
  routes=JSON.parse(JSON.stringify(p.routes||[]));
  assigns=JSON.parse(JSON.stringify(p.assigns||[]));
  zones=JSON.parse(JSON.stringify(p.zones||[]));
  ensureIds();
  notesEl.value=p.notes||'';
  try{localStorage.setItem(NKEY,notesEl.value);}catch(e){}
  render();
  closeModal();
}

function deletePlay(name){
  if(!confirm('Delete "'+name+'"?'))return;
  setPlays(getPlays().filter(function(p){return p.name!==name;}));
  renderList();
}

function fmtDate(ts){try{return new Date(ts).toLocaleDateString();}catch(e){return '';}}

function renderList(){
  var box=document.getElementById('modal-list');
  box.innerHTML='';
  var plays=getPlays().sort(function(a,b){return b.ts-a.ts;});
  if(!plays.length){var e=document.createElement('div');e.className='empty';e.textContent='No saved plays yet.';box.appendChild(e);return;}
  plays.forEach(function(p){
    var row=document.createElement('div');row.className='pl';
    var nm=document.createElement('div');nm.className='nm';nm.title='Load this play';
    nm.appendChild(document.createTextNode(p.name));
    var dt=document.createElement('span');dt.className='dt';dt.textContent=fmtDate(p.ts);nm.appendChild(dt);
    nm.addEventListener('click',function(){loadPlay(p);});
    var del=document.createElement('button');del.textContent='Delete';
    del.addEventListener('click',function(){deletePlay(p.name);});
    row.appendChild(nm);row.appendChild(del);box.appendChild(row);
  });
}

/* ---- Notes: persist locally + bake into the saved PNG ---- */
var NKEY='cpd_notes',notesEl=document.getElementById('notes');
notesEl.value=localStorage.getItem(NKEY)||'';

function exportPNG(){
  var notes=notesEl.value.replace(/\s+$/,'');
  var pad=16;
  var bodySize=Math.max(12,Math.round(C.width/58));
  var hdrSize=Math.max(10,Math.round(C.width/75));
  var lineH=Math.round(bodySize*1.45);
  var off=document.createElement('canvas'),octx=off.getContext('2d');
  var maxW=C.width-pad*2,lines=[];
  if(notes){
    octx.font=bodySize+'px sans-serif';
    notes.split('\n').forEach(function(para){
      if(!para){lines.push('');return;}
      var words=para.split(' '),cur='';
      words.forEach(function(w){
        var test=cur?cur+' '+w:w;
        if(octx.measureText(test).width>maxW&&cur){lines.push(cur);cur=w;}else cur=test;
      });
      lines.push(cur);
    });
  }
  var notesH=notes?(pad+lineH+lines.length*lineH+pad):0;
  off.width=C.width;off.height=C.height+notesH;
  octx.fillStyle='#0f0f0f';octx.fillRect(0,0,off.width,off.height);
  octx.drawImage(C,0,0);
  if(notes){
    var y=C.height+pad;
    octx.textAlign='left';octx.textBaseline='top';
    octx.fillStyle='#888';octx.font='bold '+hdrSize+'px sans-serif';
    octx.fillText('NOTES',pad,y);y+=lineH;
    octx.fillStyle='#eee';octx.font=bodySize+'px sans-serif';
    lines.forEach(function(ln){octx.fillText(ln,pad,y);y+=lineH;});
  }
  var a=document.createElement('a');a.download='play.png';a.href=off.toDataURL();a.click();
}

/* ---- Run fit / Pass rush / Coverage ---- */
var RFCOL='#f0883e',PRCOL='#ffd24a';
var RUNFIT=['A gap','B gap','C gap','D gap','Force','Contain','Spill','Fill','Cutback','Box/Alley'];
var PASSRUSH=['Contain','A rush','B rush','C rush','Slant ←','Slant →','TEX','ET','Twist','Loop ←','Loop →'];

function playerById(id){for(var i=0;i<players.length;i++){if(players[i].id===id)return players[i];}return null;}
function defByLabel(lb){return players.filter(function(p){return p.color===D&&p.label===lb;});}
function ensureIds(){var mx=0;players.forEach(function(p){if(typeof p.id!=='number')p.id=nextId();if(p.id>mx)mx=p.id;});if(mx>uid)uid=mx;}

function targetForRole(p,role){
  var s=p.x<ballX?-1:1,L=LOS,r=R();
  var Ag=OL_G*0.5,Bg=OL_G+OL_T*0.5,Cg=OL_G+OL_T+r*1.3,Dg=OL_G+OL_T+r*3.2;
  var m={
    'A gap':{x:ballX+s*Ag,y:L},'B gap':{x:ballX+s*Bg,y:L},
    'C gap':{x:ballX+s*Cg,y:L},'D gap':{x:ballX+s*Dg,y:L},
    'Force':{x:ballX+s*(Dg+r*2),y:L-Math.round(1.5*YD_V)},
    'Contain':{x:ballX+s*(Dg+r*2.5),y:L-Math.round(2*YD_V)},
    'Spill':{x:ballX+s*Ag,y:L,curve:true},
    'Fill':{x:ballX+s*Ag,y:L},
    'Cutback':{x:ballX-s*Bg,y:L,curve:true},
    'Box/Alley':{x:ballX+s*(Cg+r*2),y:L-Math.round(3*YD_V)},
    'A rush':{x:ballX+s*Ag,y:L-Math.round(0.5*YD_V)},
    'B rush':{x:ballX+s*Bg,y:L-Math.round(0.5*YD_V)},
    'C rush':{x:ballX+s*Cg,y:L-Math.round(0.5*YD_V)},
    'Slant ←':{x:p.x-OL_T,y:L},'Slant →':{x:p.x+OL_T,y:L},
    'TEX':{x:ballX+s*Ag,y:L,curve:true},'ET':{x:ballX+s*Bg,y:L,curve:true},
    'Twist':{x:ballX-s*Bg,y:L,curve:true},
    'Loop ←':{x:p.x-OL_T*1.2,y:L,curve:true},'Loop →':{x:p.x+OL_T*1.2,y:L,curve:true}
  };
  return m[role]||{x:p.x,y:L-Math.round(3*YD_V)};
}

function drawCurvedArrow(x1,y1,x2,y2,col){
  var dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1;
  var nx=-dy/len,ny=dx/len,off=Math.min(45,len*0.45);
  var cx=(x1+x2)/2+nx*off,cy=(y1+y2)/2+ny*off;
  ctx.save();ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=2.5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(cx,cy,x2,y2);ctx.stroke();
  var ang=Math.atan2(y2-cy,x2-cx);
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-13*Math.cos(ang-0.4),y2-13*Math.sin(ang-0.4));
  ctx.lineTo(x2-13*Math.cos(ang+0.4),y2-13*Math.sin(ang+0.4));
  ctx.closePath();ctx.fill();ctx.restore();
}
function drawTag(x,y,text,col){
  ctx.save();
  ctx.font='bold '+Math.max(9,Math.round(W/95))+'px sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  var tw=ctx.measureText(text).width+8,th=Math.max(13,Math.round(W/68)),ty=y-th;
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(x-tw/2,ty-th/2,tw,th);
  ctx.fillStyle=col;ctx.fillText(text,x,ty);
  ctx.restore();
}
function drawAssign(a){
  var p=playerById(a.pid);if(!p)return;
  if(a.curve)drawCurvedArrow(p.x,p.y,a.tx,a.ty,a.col);
  else drawArrow(p.x,p.y,a.tx,a.ty,a.col);
  drawTag(a.tx,a.ty,a.role,a.col);
}
function drawZone(z){
  ctx.save();
  ctx.beginPath();ctx.ellipse(z.x,z.y,z.rx,z.ry,0,0,Math.PI*2);
  ctx.fillStyle='rgba(63,191,176,0.12)';ctx.fill();
  ctx.strokeStyle='rgba(63,191,176,0.75)';ctx.lineWidth=1.5;ctx.setLineDash([5,4]);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(190,245,238,0.92)';
  ctx.font='bold '+Math.max(9,Math.round(W/82))+'px sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(z.label,z.x,z.y);
  ctx.restore();
}

function hitAssignHead(x,y){for(var i=assigns.length-1;i>=0;i--){if(Math.hypot(x-assigns[i].tx,y-assigns[i].ty)<15)return i;}return -1;}
function hitAssign(x,y){
  for(var i=assigns.length-1;i>=0;i--){var p=playerById(assigns[i].pid);if(!p)continue;
    var dx=assigns[i].tx-p.x,dy=assigns[i].ty-p.y,len=Math.hypot(dx,dy);if(len<1)continue;
    var t=Math.max(0,Math.min(1,((x-p.x)*dx+(y-p.y)*dy)/(len*len)));
    if(Math.hypot(x-p.x-t*dx,y-p.y-t*dy)<11)return i;
  }return -1;
}
function zoneVal(z,x,y){var dx=(x-z.x)/z.rx,dy=(y-z.y)/z.ry;return dx*dx+dy*dy;}
function hitZone(x,y){for(var i=zones.length-1;i>=0;i--){if(zoneVal(zones[i],x,y)<=1.2)return i;}return -1;}

function addAssign(pi,role){
  var p=players[pi];saveH();
  var t=targetForRole(p,role);
  assigns.push({pid:p.id,kind:tool,role:role,tx:Math.round(t.x),ty:Math.round(t.y),col:tool==='runfit'?RFCOL:PRCOL,curve:!!t.curve});
  closeMenu();render();
}

var ctxMenu=document.getElementById('ctxmenu');
function openMenu(pi,pos){
  var roles=tool==='runfit'?RUNFIT:PASSRUSH;
  ctxMenu.innerHTML='';
  var t=document.createElement('div');t.className='ttl';t.textContent=players[pi].label+' · '+(tool==='runfit'?'Run fit':'Pass rush');ctxMenu.appendChild(t);
  roles.forEach(function(r){var b=document.createElement('button');b.textContent=r;b.addEventListener('click',function(ev){ev.stopPropagation();addAssign(pi,r);});ctxMenu.appendChild(b);});
  ctxMenu.style.left=Math.max(4,Math.min(lastClient.x,window.innerWidth-170))+'px';
  ctxMenu.style.top=Math.max(4,Math.min(lastClient.y,window.innerHeight-300))+'px';
  ctxMenu.classList.add('open');
}
function closeMenu(){ctxMenu.classList.remove('open');}
document.addEventListener('mousedown',function(e){if(ctxMenu.classList.contains('open')&&!ctxMenu.contains(e.target)&&e.target!==C)closeMenu();});

document.getElementById('sel-cov').addEventListener('change',function(){applyCoverage(this.value);this.value='';});
function getReceivers(){return players.filter(function(p){return p.color===O&&p.y<=LOS+R()*2.2;}).sort(function(a,b){return a.x-b.x;});}
function alignOver(d,r){if(d&&r){d.x=Math.round(r.x);d.y=Math.round(LOS-Math.round(1.5*YD_V));}}
function manAlign(extra){
  var cbs=defByLabel('CB').sort(function(a,b){return a.x-b.x;});
  var recs=getReceivers();if(!recs.length)return;
  var used=[];
  if(recs.length>=1&&cbs[0]){alignOver(cbs[0],recs[0]);used.push(0);}
  if(recs.length>=2&&cbs[1]){alignOver(cbs[1],recs[recs.length-1]);used.push(recs.length-1);}
  var rem=[],i;for(i=0;i<recs.length;i++){if(used.indexOf(i)<0)rem.push(recs[i]);}
  var ds=extra.filter(Boolean);
  rem.forEach(function(rc,j){if(ds[j])alignOver(ds[j],rc);});
}
function applyCoverage(scheme){
  if(!scheme)return;
  saveH();zones=[];
  var dy=LOS-Math.round(13*YD_V),uy=LOS-Math.round(6*YD_V),fy=LOS-Math.round(4*YD_V);
  var cbs=defByLabel('CB').sort(function(a,b){return a.x-b.x;});
  var fs=defByLabel('FS')[0],ss=defByLabel('SS')[0],mike=defByLabel('MIKE')[0],will=defByLabel('WILL')[0],nick=defByLabel('NICK')[0];
  function P(p,x,y){if(p){p.x=Math.round(x);p.y=Math.round(y);}}
  function Z(x,y,rx,ry,l){zones.push({x:Math.round(x),y:Math.round(y),rx:Math.round(rx),ry:Math.round(ry),label:l});}
  var DRy=Math.round(7*YD_V),URx=Math.round(W*0.085),URy=Math.round(4*YD_V);
  if(scheme==='3'){
    P(cbs[0],W*0.16,dy);P(fs,W*0.5,dy);P(cbs[1],W*0.84,dy);
    P(nick,W*0.25,uy);P(will,W*0.4,uy);P(mike,W*0.6,uy);P(ss,W*0.75,uy);
    var t3=Math.round(W*0.13);
    Z(W*0.17,dy,t3,DRy,'Deep ⅓');Z(W*0.5,dy,t3,DRy,'Deep ⅓');Z(W*0.83,dy,t3,DRy,'Deep ⅓');
    Z(W*0.25,uy,URx,URy,'Curl/Flat');Z(W*0.41,uy,URx,URy,'Hook');Z(W*0.59,uy,URx,URy,'Hook');Z(W*0.75,uy,URx,URy,'Curl/Flat');
  }else if(scheme==='2'){
    P(fs,W*0.28,dy);P(ss,W*0.72,dy);P(cbs[0],W*0.12,fy);P(cbs[1],W*0.88,fy);
    P(will,W*0.34,uy);P(mike,W*0.5,uy);P(nick,W*0.66,uy);
    var h2=Math.round(W*0.2);
    Z(W*0.28,dy,h2,DRy,'Deep ½');Z(W*0.72,dy,h2,DRy,'Deep ½');
    Z(W*0.12,fy,URx,URy,'Flat');Z(W*0.88,fy,URx,URy,'Flat');
    Z(W*0.34,uy,URx,URy,'Hook/Curl');Z(W*0.5,uy,URx,URy,'Hook');Z(W*0.66,uy,URx,URy,'Hook/Curl');
  }else if(scheme==='4'){
    P(cbs[0],W*0.14,dy);P(fs,W*0.38,dy);P(ss,W*0.62,dy);P(cbs[1],W*0.86,dy);
    P(will,W*0.3,uy);P(mike,W*0.5,uy);P(nick,W*0.7,uy);
    var q4=Math.round(W*0.1);
    Z(W*0.14,dy,q4,DRy,'Deep ¼');Z(W*0.38,dy,q4,DRy,'Deep ¼');Z(W*0.62,dy,q4,DRy,'Deep ¼');Z(W*0.86,dy,q4,DRy,'Deep ¼');
    Z(W*0.3,uy,URx,URy,'Curl');Z(W*0.5,uy,URx,URy,'Hook');Z(W*0.7,uy,URx,URy,'Curl');
  }else if(scheme==='1'){
    P(fs,W*0.5,dy);Z(W*0.5,dy,Math.round(W*0.22),DRy,'Post / MOF');
    manAlign([ss,nick,will,mike]);
  }else if(scheme==='0'){
    manAlign([ss,nick,will,mike,fs]);
  }
  render();
}
</script>
