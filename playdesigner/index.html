<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14804a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Coach's Play Designer</title>
<style>
:root{
  --bg:#ffffff;
  --panel:#ffffff;
  --panel-2:#f4f6f3;
  --panel-3:#eaeee8;
  --line:#e1e5de;
  --line-2:#ccd3c8;
  --ink:#14181a;
  --ink-2:#48524c;
  --ink-3:#6f7a73;
  --accent:#14804a;
  --accent-hi:#0f6b3d;
  --accent-soft:#e6f2ea;
  --danger:#b3261e;
  --danger-soft:#fbeceb;
  --radius:7px;
  --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 14px rgba(20,30,25,.06);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
body{background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px 12px 28px;gap:10px;-webkit-font-smoothing:antialiased}
h1{font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--ink-3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

#wrap{width:100%;max-width:820px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
#tb{display:flex;flex-wrap:wrap;gap:6px;padding:9px 10px;background:var(--panel);align-items:center;border-bottom:1px solid var(--line)}
#tb select,#tb button{font-size:12px;padding:6px 10px;border-radius:5px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);cursor:pointer;min-height:32px;font-weight:500;transition:background .12s,border-color .12s}
#tb select{padding-right:6px}
#tb button:hover,#tb select:hover{background:var(--panel-2);border-color:var(--ink-3)}
#tb button.act{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
#tb button.act:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
#tb button[disabled]{opacity:.38;cursor:default;pointer-events:none}
#tb .sep{width:1px;height:22px;background:var(--line);margin:0 3px;flex-shrink:0}
#tb-search{font-size:12px;padding:6px 10px;min-height:32px;border-radius:5px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);min-width:130px;font-family:inherit}
#tb-search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
@media (pointer:coarse){#tb-search{min-height:42px}}
#tb label{font-size:11px;font-weight:600;letter-spacing:.4px;color:var(--ink-3);white-space:nowrap}
#btn-clear{color:var(--danger)!important;border-color:#e6c7c4!important}
#btn-clear:hover{background:var(--danger-soft)!important;border-color:var(--danger)!important}

#play-title{display:block;width:100%;padding:11px 14px;background:var(--panel-2);color:var(--ink);border:none;border-bottom:1px solid var(--line);font-size:16px;font-weight:700;letter-spacing:.6px;text-align:center;outline:none}
#play-title::placeholder{color:var(--ink-3);font-weight:600}
#play-title:focus{background:var(--accent-soft)}
#call-strip{padding:6px 12px;background:var(--panel-2);border-bottom:1px solid var(--line);font-size:11.5px;font-weight:600;letter-spacing:.6px;color:var(--ink-3);text-align:center;text-transform:uppercase;min-height:26px}

canvas{display:block;width:100%;touch-action:pan-y;cursor:crosshair;background:#2f5a26}
canvas.grabbing{touch-action:none}
#ctrls{display:flex;gap:7px;align-items:center;padding:8px 10px;background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap}
#ctrls button,#ctrls select{font-size:12px;padding:6px 10px;border-radius:5px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);cursor:pointer;min-height:32px;font-weight:500}
#ctrls button:hover,#ctrls select:hover{background:var(--panel-2)}
#ctrls button.act{background:var(--accent);color:#fff;border-color:var(--accent)}
#ctrls label{font-size:11px;font-weight:600;letter-spacing:.4px;color:var(--ink-3)}
#ctrls .sep{width:1px;height:22px;background:var(--line);margin:0 3px}
#anim{flex:1;min-width:120px;accent-color:var(--accent);height:28px}
#assign-card{display:none;padding:11px 14px;background:var(--accent-soft);border-top:1px solid var(--line);font-size:13px;line-height:1.6;color:var(--ink)}
#assign-card b{display:block;font-size:15px;letter-spacing:.5px;margin-bottom:4px;color:var(--accent-hi)}
#assign-card button{margin-left:8px;font-size:12px;padding:5px 11px;border-radius:5px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
@media (pointer:coarse){#ctrls button,#ctrls select{min-height:42px;font-size:13px}}
#leg{display:flex;gap:12px;padding:7px 11px;font-size:10.5px;color:var(--ink-3);background:var(--panel-2);flex-wrap:wrap;border-top:1px solid var(--line);align-items:center}
.li{display:flex;align-items:center;gap:4px}

#notes-wrap{width:100%;max-width:820px;display:flex;flex-direction:column;gap:5px}
#notes-wrap label{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--ink-3)}
#notes{width:100%;min-height:76px;resize:vertical;background:var(--panel);color:var(--ink);border:1px solid var(--line-2);border-radius:var(--radius);padding:10px 12px;font-size:13px;font-family:inherit;line-height:1.5}
#notes:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#notes::placeholder{color:var(--ink-3)}

#modal{display:none;position:fixed;inset:0;background:rgba(18,26,22,.42);z-index:100;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(2px)}
#modal.open{display:flex}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:9px;width:100%;max-width:400px;max-height:78vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 40px rgba(20,30,25,.22)}
#modal .hd{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-2)}
#modal .hd button{font-size:12px;padding:6px 11px;border-radius:5px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);cursor:pointer;min-height:32px}
#modal .hd button:hover{background:var(--panel-2)}
#modal-list{overflow:auto}
#modal .pl{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
#modal .pl:last-child{border-bottom:none}
#modal .pl:hover{background:var(--panel-2)}
#modal .pl .nm{flex:1;min-width:0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#modal .pl .nm:hover{color:var(--ink)}
#modal .pl .nm .dt{font-size:10px;color:var(--ink-3);margin-left:6px}
#modal .pl button{font-size:11.5px;padding:5px 9px;border-radius:5px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);cursor:pointer;flex-shrink:0;min-height:30px}
#modal .pl button:hover{background:var(--panel-3)}
#modal .pl button.del{border-color:#e6c7c4;color:var(--danger)}
#modal .pl button.del:hover{background:var(--danger-soft)}
#modal .empty{padding:22px 14px;font-size:12.5px;color:var(--ink-3);text-align:center}
#modal .tools{position:sticky;top:0;z-index:2;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
#modal .tools input{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line-2);border-radius:5px;padding:8px 11px;font-size:13px;font-family:inherit;min-height:38px}
#modal .tools input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#modal .grp{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3);padding:12px 14px 5px;background:var(--panel-2)}
#modal .pl .meta{flex:1;min-width:0;cursor:pointer;overflow:hidden}
#modal .pl .meta .nm2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;color:var(--ink)}
#modal .pl .meta:hover .nm2{color:var(--accent)}
#modal .pl .meta .dt2{font-size:10px;color:var(--ink-3);margin-left:6px;font-weight:400}
#modal .pl .chips{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px}
#modal .chip{font-size:9.5px;background:var(--accent-soft);color:var(--accent-hi);border:1px solid #c9e2d4;border-radius:3px;padding:1px 6px;font-weight:600}
#modal .form{padding:14px;display:flex;flex-direction:column;gap:13px}
#modal .form label{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
#modal .form .hint{font-size:10.5px;color:var(--ink-3);text-transform:none;letter-spacing:0;font-weight:400}
#modal .form input{background:var(--panel);color:var(--ink);border:1px solid var(--line-2);border-radius:5px;padding:10px 11px;font-size:13.5px;font-family:inherit;min-height:40px}
#modal .form input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#modal .form .actions{display:flex;gap:9px;justify-content:flex-end;margin-top:3px}
#modal .form .actions button{font-size:13px;padding:9px 16px;border-radius:5px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);cursor:pointer;min-height:40px;font-weight:500}
#modal .form .actions button:hover{background:var(--panel-2)}
#modal .form .actions button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
#modal .form .actions button.primary:hover{background:var(--accent-hi);border-color:var(--accent-hi)}

#ctxmenu{display:none;position:fixed;z-index:200;background:var(--panel);border:1px solid var(--line-2);border-radius:7px;padding:5px;min-width:172px;max-height:300px;overflow:auto;box-shadow:0 10px 30px rgba(20,30,25,.2)}
#ctxmenu.open{display:block}
#ctxmenu .ttl{font-size:10px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink-3);padding:6px 9px 7px;border-bottom:1px solid var(--line);margin-bottom:4px}
#ctxmenu button{display:block;width:100%;text-align:left;font-size:12.5px;padding:8px 10px;border:none;background:none;color:var(--ink-2);cursor:pointer;border-radius:5px;min-height:34px}
#ctxmenu button:hover{background:var(--accent-soft);color:var(--accent-hi)}

@media (pointer:coarse){
  #tb select,#tb button{min-height:42px;padding:9px 13px;font-size:13px}
  #modal .pl button{min-height:38px;padding:8px 12px}
  #ctxmenu button{min-height:42px;font-size:13.5px}
  #ctxmenu{min-width:196px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  body{background:#fff;padding:0;display:block}
  h1,#tb,#ctrls,#leg,#notes-wrap,#modal,#ctxmenu{display:none!important}
  #wrap{max-width:none;border:none;box-shadow:none}
  #play-title{font-size:20px;border:none;background:#fff;color:#000}
  #call-strip{background:#fff;color:#000;border:none}
  #assign-card{background:#fff;border-top:1px solid #000}
  canvas{width:100%!important}
}
</style>
</head>
<body>
<h1>Coach's Play Designer</h1>
<div id="wrap">
  <div id="tb">
    <label>Formation:</label>
    <select id="sel-form">
      <option value="">-- select --</option>
      <optgroup label="Shotgun">
        <option value="gun_2x2">Gun 2x2</option>
        <option value="gun_2x2_te">Gun 2x2 TE on line</option>
        <option value="gun_2x2_yoff">Gun 2x2 Y-off / sniffer</option>
        <option value="gun_3x1">Gun 3x1</option>
        <option value="gun_3x1_te">Gun 3x1 TE on line</option>
        <option value="gun_3x1_yoff">Gun 3x1 Y-off / sniffer</option>
        <option value="gun_3x1_back">Gun Slot, Split Backs</option>
        <option value="gun_2x2_back">Gun Split Backs (2 WR, TE)</option>
        <option value="gun_empty">Gun Empty</option>
      </optgroup>
      <optgroup label="Ace / Singleback">
        <option value="ace_2x2">Ace 2x2</option>
        <option value="ace_2x2_te">Ace 2x2 TE on line</option>
        <option value="ace_trips">Ace Trips</option>
      </optgroup>
      <optgroup label="Under Center">
        <option value="i_form">I-Formation</option>
        <option value="i_form_trips">I-Form Twins</option>
        <option value="power_i">Power I</option>
        <option value="pro_form">Pro Formation</option>
        <option value="pistol_2x2">Pistol 2x2</option>
      </optgroup>
      <optgroup label="Run-first">
        <option value="wing_t">Wing-T</option>
        <option value="flexbone">Flexbone</option>
        <option value="double_wing">Double Wing</option>
        <option value="wildcat">Wildcat</option>
        <option value="unbalanced">Unbalanced (tackle over)</option>
      </optgroup>
      <optgroup label="Heavy / Goal line">
        <option value="jumbo">Jumbo (13)</option>
        <option value="goal_line">Goal Line (23)</option>
      </optgroup>
      <optgroup label="Condensed">
        <option value="gun_bunch">Gun Bunch</option>
        <option value="gun_stack">Gun Stack</option>
      </optgroup>
    </select>
    <button id="btn-flip" title="Flip formation strength to the other side">Flip</button>
    <div class="sep"></div>
    <label>Ball:</label>
    <select id="sel-hash">
      <option value="mof">MOF</option>
      <option value="lh">Left Hash</option>
      <option value="rh">Right Hash</option>
      <option value="lm">Left Mid</option>
      <option value="rm">Right Mid</option>
    </select>
    <div class="sep"></div>
    <label>Play:</label>
    <select id="sel-play">
      <option value="pass">Pass</option>
      <option value="run">Run</option>
    </select>
    <select id="sel-run" title="One-click run concept">
      <option value="">-- run play --</option>
      <optgroup label="Zone"><option value="inside_zone">Inside Zone</option><option value="wide_zone">Wide Zone</option><option value="split_zone">Split Zone</option></optgroup>
      <optgroup label="Gap"><option value="power">Power</option><option value="counter_gt">Counter GT</option><option value="iso">Iso</option><option value="trap">Trap</option><option value="buck_sweep">Buck Sweep</option></optgroup>
      <optgroup label="Perimeter"><option value="toss">Toss</option></optgroup>
      <optgroup label="QB run"><option value="zone_read">Zone Read</option><option value="power_read">Power Read</option><option value="qb_counter">QB Counter</option></optgroup>
    </select>
    <select id="sel-pass" title="One-click pass concept">
      <option value="">-- pass concept --</option>
      <optgroup label="Quick"><option value="slant_flat">Slant / Flat</option><option value="stick">Stick</option><option value="snag">Snag</option></optgroup>
      <optgroup label="Horizontal"><option value="mesh">Mesh</option><option value="drive">Drive</option><option value="curl_flat">Curl / Flat</option></optgroup>
      <optgroup label="Vertical"><option value="four_verts">Four Verts</option><option value="smash">Smash</option><option value="flood">Flood</option><option value="y_cross">Y-Cross</option></optgroup>
    </select>
    <button id="btn-rundir" title="Flip the run direction">Run &rarr;</button>
    <div class="sep"></div>
    <button id="btn-defview">Def View</button>
    <button id="btn-boxview" title="Show only DL + LB for a front diagram">Box View</button>
    <div class="sep"></div>
    <button id="t-assign" class="act">Assign</button>
    <button id="t-route">Draw</button>
    <button id="t-erase">Erase</button>
    <div class="sep"></div>
    <label>D Pers:</label>
    <select id="sel-defpers">
      <option value="nickel">Nickel 4-2-5</option>
      <option value="base43">Base 4-3</option>
      <option value="okie34">3-4 Okie</option>
      <option value="dime">Dime 4-1-6</option>
      <option value="goalline">Goal Line 6-3-2</option>
    </select>
    <label>Front:</label>
    <select id="sel-front">
      <option value="">-- front --</option>
      <option value="over">Over</option>
      <option value="under">Under</option>
      <option value="tite">Tite</option>
      <option value="mint">Mint</option>
      <option value="bear">Bear (46)</option>
      <option value="g">G</option>
      <option value="okie">3-4 Okie</option>
    </select>
    <label>Cov:</label>
    <select id="sel-cov">
      <option value="">-- preset --</option>
      <option value="0">Cover 0</option>
      <option value="1">Cover 1</option>
      <option value="2">Tampa 2</option>
      <option value="3">Cover 3</option>
      <option value="4">Cover 4</option>
      <option value="palm">Cover 4 Palms</option>
      <option value="6">Cover 6</option>
      <option value="2man">2-Man</option>
      <option value="ripliz">Rip/Liz (match 3)</option>
    </select>
    <label>Pressure:</label>
    <select id="sel-press">
      <option value="">-- pressure --</option>
      <option value="double_a">Double A</option>
      <option value="lb_fire">LB Fire</option>
      <option value="nickel_fire">Nickel Fire</option>
      <option value="fire_zone">Fire Zone (5)</option>
      <option value="cover0">Cover 0 (All-Out)</option>
    </select>
    <label>Stunt:</label>
    <select id="sel-stunt">
      <option value="">-- line game --</option>
      <option value="tex_strong">TEX (strong)</option>
      <option value="tex_weak">TEX (weak)</option>
      <option value="et_strong">ET (strong)</option>
      <option value="et_weak">ET (weak)</option>
      <option value="twist">Twist (DTs cross)</option>
    </select>
    <button id="btn-addzone">+ Zone</button>
    <div class="sep"></div>
    <button id="btn-undo" title="Undo (Ctrl/Cmd+Z)">Undo</button>
    <button id="btn-redo" title="Redo (Ctrl/Cmd+Shift+Z)">Redo</button>
    <button id="btn-snap" title="Snap players to half-yard marks while dragging">Snap</button>
    <button id="btn-clear" style="color:#c66;border-color:#633">Clear routes</button>
    <button id="btn-save">Save PNG</button>
    <select id="sel-sheet" title="Print a scout card sheet">
      <option value="">Scout cards…</option>
      <option value="4">4 per page (PDF)</option>
      <option value="6">6 per page (PDF)</option>
      <option value="8">8 per page (PDF)</option>
    </select>
    <div class="sep"></div>
    <button id="btn-saveplay">Save Play</button>
    <button id="btn-loadplay">Playbook</button>
    <input id="tb-search" type="search" placeholder="Find a play…" aria-label="Find a play">
    <button id="btn-export" title="Download the whole playbook as a file">Export</button>
    <button id="btn-import" title="Load a playbook file">Import</button>
    <input id="file-import" type="file" accept="application/json,.json" hidden>
  </div>
  <input id="play-title" placeholder="Untitled Play" autocomplete="off" spellcheck="false">
  <div id="call-strip" aria-live="polite"></div>
  <canvas id="c" tabindex="0" role="application" aria-label="Play diagram. Drag players to align them; double-click a player to assign a route, run fit, rush or coverage."></canvas>
  <div id="ctrls">
    <button id="btn-play" title="Run the snap">&#9654; Snap</button>
    <button id="btn-reset" title="Back to the pre-snap picture">Reset</button>
    <input id="anim" type="range" min="0" max="100" value="0" step="1" aria-label="Play timeline">
    <select id="sel-speed" aria-label="Tempo"><option value="0.5">0.5&times;</option><option value="1" selected>1&times;</option><option value="2">2&times;</option></select>
    <div class="sep"></div>
    <label for="sel-player">View</label>
    <select id="sel-player"><option value="">All 22</option></select>
    <button id="btn-quiz" title="Hide the assignment and quiz yourself">Quiz</button>
  </div>
  <div id="assign-card" aria-live="polite"></div>
  <div id="leg">
    <div class="li"><svg width="13" height="13"><rect x="1" y="1" width="11" height="11" fill="#185FA5" rx="1"/></svg> C locked</div>
    <div class="li"><svg width="13" height="13"><circle cx="6" cy="6" r="5" fill="#185FA5"/></svg> OL locked</div>
    <div class="li"><svg width="13" height="13"><circle cx="6" cy="6" r="5" fill="#378ADD"/></svg> Offense drag</div>
    <div class="li"><svg width="13" height="13"><circle cx="6" cy="6" r="5" fill="#1D9E75"/></svg> QB</div>
    <div class="li"><svg width="13" height="13"><circle cx="6" cy="6" r="5" fill="#A32D2D"/></svg> Defense drag</div>
    <div class="li" style="margin-left:auto;color:#333">drag players · draw routes · save PNG</div>
  </div>
</div>

<div id="notes-wrap">
  <label for="notes">Notes</label>
  <textarea id="notes" placeholder="Play notes, coaching points, reads…"></textarea>
</div>

<div id="modal"><div class="box">
  <div class="hd"><span id="modal-title">Playbook</span><button id="modal-close">Close</button></div>
  <div id="modal-list"></div>
</div></div>

<div id="ctxmenu"></div>

<script>
var C=document.getElementById('c'),ctx=C.getContext('2d');
var W,H,YD,YD_V,LOS,LH_X,RH_X,hashPos,SL_WR,SLOT_IN,QB_Y,RB_Y;
var OL_G=22,OL_T=22;
var ballX=0,play='pass',defView=false,boxView=false,curCov='',curForm='',flip=false,curFront='',curPress='';
var players=[],routes=[],hist=[],assigns=[],zones=[];
var uid=0;function nextId(){return ++uid;}
var tool='assign',drawing=false,curPts=[],dragIdx=-1,dragOff={x:0,y:0},arcStart=null,dragAssign=-1,dragMode='move',zoneDrag=null,stemDrag=-1,lastClient={x:0,y:0},lastTap=0,routeAnchorId=null;
var _ready=false,_saveT=null,DPR=1,_rafPending=false,redoStack=[],snapOn=false;
var runDir=1,curRun='';

function snapshot(){return{p:JSON.stringify(players),r:JSON.stringify(routes),a:JSON.stringify(assigns),z:JSON.stringify(zones)};}
function sameSnap(a,b){return a.p===b.p&&a.r===b.r&&a.a===b.a&&a.z===b.z;}
function pushH(s0){hist.push(s0);if(hist.length>60)hist.shift();redoStack.length=0;updateHistButtons();}
function saveH(){pushH(snapshot());}
// drags mutate during pointermove, so their snapshot has to be taken on pointerdown
var _pending=null;
function beginEdit(){_pending=snapshot();}
function commitEdit(){if(!_pending)return;var now=snapshot();if(!sameSnap(now,_pending))pushH(_pending);_pending=null;}
function applySnap(s0){players=JSON.parse(s0.p);routes=JSON.parse(s0.r);assigns=s0.a?JSON.parse(s0.a):[];zones=s0.z?JSON.parse(s0.z):[];ensureIds();normalizeAssigns();}
function updateHistButtons(){var u=document.getElementById('btn-undo'),r=document.getElementById('btn-redo');if(u)u.disabled=!hist.length;if(r)r.disabled=!redoStack.length;}

function setSize(){
  var pw=document.getElementById('wrap').clientWidth;
  W=pw; H=Math.round(pw*(540/820));
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  C.width=Math.round(W*DPR); C.height=Math.round(H*DPR);
  C.style.height=H+'px';
  YD=W/53.33;
  YD_V=H/35;
  LOS=Math.round(H*0.60);
  LH_X=Math.round(W*(53.33/160));
  RH_X=W-LH_X;
  hashPos={mof:W/2,lh:LH_X,rh:RH_X,lm:Math.round((LH_X+W/2)/2),rm:Math.round((RH_X+W/2)/2)};
  SL_WR=Math.round(3*YD);
  SLOT_IN=Math.round(6*YD);
  OL_G=Math.round(R()*2.6);OL_T=Math.round(R()*2.6);
  QB_Y=LOS+42; RB_Y=LOS+65;
  if(!ballX)ballX=W/2;
}

function drawField(){
  var yc=H*0.5; // 50-yard line at the vertical center of the view
  // alternating 5-yard turf bands (run across the field, perpendicular to the sidelines)
  for(var d=-120;d<120;d+=5){
    var ya=yc-d*YD_V, yb=yc-(d+5)*YD_V;
    var top=Math.min(ya,yb), bh=Math.abs(yb-ya);
    if(top>H||top+bh<0)continue;
    var idx=Math.round(d/5);
    ctx.fillStyle=(((idx%2)+2)%2===0)?'#3c6b30':'#36622b';
    ctx.fillRect(0,top,W,bh);
  }
  // yard lines every 5 yards
  ctx.strokeStyle='rgba(255,255,255,0.30)';ctx.lineWidth=1;
  for(var d=-120;d<=120;d+=5){
    var py=yc-d*YD_V;
    if(py<0||py>H)continue;
    ctx.beginPath();ctx.moveTo(0,py);ctx.lineTo(W,py);ctx.stroke();
  }
  // yard numbers every 10 yards, near both sidelines (…40,50,40… counting from midfield)
  ctx.fillStyle='rgba(255,255,255,0.64)';
  ctx.font='bold '+Math.max(10,Math.round(W/68))+'px sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(var d=-120;d<=120;d+=10){
    var py=yc-d*YD_V;
    if(py<16||py>H-16)continue;
    var dist=Math.abs(d)%100, n=dist<=50?50-dist:dist-50;
    if(n<=0)continue;
    fillTextU(''+n,24,py);
    fillTextU(''+n,W-24,py);
  }
  // line of scrimmage (ball spot)
  ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(0,LOS);ctx.lineTo(W,LOS);ctx.stroke();
  // hash marks
  ctx.strokeStyle='rgba(255,255,255,0.52)';ctx.lineWidth=1.5;ctx.setLineDash([3,5]);
  ctx.beginPath();ctx.moveTo(LH_X,0);ctx.lineTo(LH_X,H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(RH_X,0);ctx.lineTo(RH_X,H);ctx.stroke();
  ctx.setLineDash([]);
  // sidelines
  ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(2,0);ctx.lineTo(2,H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W-2,0);ctx.lineTo(W-2,H);ctx.stroke();
}
function drawBall(){
  var rx=Math.max(7,Math.round(W/95)),ry=Math.max(4,Math.round(W/150));
  ctx.save();
  ctx.translate(ballX,LOS);
  ctx.fillStyle='#7a4a24';ctx.strokeStyle='#321f0e';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.strokeStyle='#fff';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(-rx*0.45,0);ctx.lineTo(rx*0.45,0);ctx.stroke();
  for(var i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*rx*0.18,-ry*0.45);ctx.lineTo(i*rx*0.18,ry*0.45);ctx.stroke();}
  ctx.restore();
}

function R(){return Math.max(8,Math.round(W/70));}
function fillTextU(s,x,y){if(defView){ctx.save();ctx.translate(x,y);ctx.scale(1,-1);ctx.fillText(s,0,0);ctx.restore();}else ctx.fillText(s,x,y);}

function nearestDist(pl){if(pl.locked)return 1e9;var m=1e9;players.forEach(function(o){if(o!==pl&&!o.locked&&o.color===pl.color){var d=Math.hypot(px(o)-px(pl),py(o)-py(pl));if(d<m)m=d;}});return m;}
function drawPlayer(pl){
  var R0=R(),r=R0,nd=nearestDist(pl),PX=px(pl),PY=py(pl);
  if(nd<2*R0+2)r=Math.max(Math.round(R0*0.62),Math.floor(nd/2-1));
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.45)';ctx.shadowBlur=Math.max(2,Math.round(R0*0.22));ctx.shadowOffsetY=(defView?-1:1)*Math.max(1,Math.round(R0*0.14));
  ctx.fillStyle=pl.color;
  if(pl.shape==='sq'){ctx.fillRect(PX-r,PY-r,r*2,r*2);}
  else{ctx.beginPath();ctx.arc(PX,PY,r,0,Math.PI*2);ctx.fill();}
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  ctx.strokeStyle=pl.locked?'rgba(255,255,255,0.35)':'rgba(255,255,255,0.9)';ctx.lineWidth=pl.locked?1:1.5;
  if(pl.shape==='sq'){ctx.strokeRect(PX-r,PY-r,r*2,r*2);}
  else{ctx.beginPath();ctx.arc(PX,PY,r,0,Math.PI*2);ctx.stroke();}
  ctx.fillStyle='#fff';
  var fsz=Math.max(7,Math.round(r*0.92));ctx.font='bold '+fsz+'px sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  var maxW=r*1.7,tw=ctx.measureText(pl.label).width;
  if(tw>maxW){fsz=Math.max(6,Math.floor(fsz*maxW/tw));ctx.font='bold '+fsz+'px sans-serif';}
  fillTextU(pl.label,PX,PY);
  if(pl.dl){
    ctx.fillStyle='rgba(255,215,80,0.85)';
    ctx.font=Math.max(7,Math.round(R0*0.62))+'px sans-serif';
    ctx.textBaseline='middle';
    var off=r+Math.round(R0*0.62);
    fillTextU(pl.dl,PX,defView?(PY-off):(PY+off));
  }
  ctx.restore();
}

// resolve absolute pts for a route — handles player-tied freehand routes ({dx,dy} offsets) vs normal ({x,y})
function routePts(r){
  if(!r.tied||!r.pid){return r.pts;}
  var ap=playerById(r.pid);if(!ap)return null;
  return r.pts.map(function(p){return{x:p.dx+ap.x,y:p.dy+ap.y};});
}

// contrast halo so play art reads on the turf: dark casing under light lines, light under dark
function caseColor(col){return tagLum(col)>0.55?'rgba(0,0,0,0.55)':'rgba(255,255,255,0.9)';}
function arrowHead(x2,y2,ang,hl){ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-hl*Math.cos(ang-0.42),y2-hl*Math.sin(ang-0.42));ctx.lineTo(x2-hl*Math.cos(ang+0.42),y2-hl*Math.sin(ang+0.42));ctx.closePath();ctx.fill();}
function drawArrow(x1,y1,x2,y2,col){
  var ang=Math.atan2(y2-y1,x2-x1),cc=caseColor(col);
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle=cc;ctx.fillStyle=cc;ctx.lineWidth=6.4;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();arrowHead(x2,y2,ang,16);
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=3.3;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();arrowHead(x2,y2,ang,13);
  ctx.restore();
}
function drawArc(x1,y1,x2,y2,col){
  var mx=(x1+x2)/2,my=Math.min(y1,y2)-32,cc=caseColor(col);
  ctx.save();ctx.lineCap='round';
  ctx.strokeStyle=cc;ctx.lineWidth=6.4;ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(mx,my,x2,y2);ctx.stroke();
  ctx.strokeStyle=col;ctx.lineWidth=3.3;ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(mx,my,x2,y2);ctx.stroke();
  ctx.restore();
}

function paint(){if(_rafPending)return;_rafPending=true;requestAnimationFrame(function(){_rafPending=false;render();});}
function render(){
  _placedTags=[];
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.save();if(defView){ctx.translate(0,H);ctx.scale(1,-1);}
  drawField();
  zones.forEach(drawZone);
  routes.forEach(function(r){
    if(quizOn&&focusId&&r.pid===focusId){return;}
    ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
    if(r.pid!=null)ctx.globalAlpha=dimFor(r.pid);
    if(r.type==='route'){
      var lp=routePts(r);if(!lp||lp.length<2){ctx.restore();return;}
      ctx.strokeStyle=caseColor(r.col);ctx.lineWidth=6;ctx.beginPath();lp.forEach(function(p,i){i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);});ctx.stroke();
      ctx.strokeStyle=r.col;ctx.lineWidth=3.3;ctx.setLineDash([7,4]);ctx.beginPath();lp.forEach(function(p,i){i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);});ctx.stroke();ctx.setLineDash([]);
      var n=lp.length;var aa=Math.atan2(lp[n-1].y-lp[n-2].y,lp[n-1].x-lp[n-2].x);ctx.fillStyle=caseColor(r.col);arrowHead(lp[n-1].x,lp[n-1].y,aa,15);ctx.fillStyle=r.col;arrowHead(lp[n-1].x,lp[n-1].y,aa,12);
    }
    else if(r.type==='tree'){if(play!=='run')drawTree(r);}
    else if(r.type==='arrow'){drawArrow(r.x1,r.y1,r.x2,r.y2,r.col);}
    else{drawArc(r.x1,r.y1,r.x2,r.y2,r.col);}
    ctx.restore();
  });
  if(drawing&&tool==='route'&&curPts.length>1){
    ctx.save();ctx.strokeStyle='#5af';ctx.lineWidth=2;ctx.setLineDash([5,3]);ctx.lineCap='round';
    ctx.beginPath();curPts.forEach(function(p,i){i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);});
    ctx.stroke();ctx.setLineDash([]);ctx.restore();
  }
  var visPlayers=boxView?players.filter(isBoxPlayer):players;
  var visIds=boxView?visPlayers.reduce(function(m,p){m[p.id]=1;return m;},{}):null;
  visPlayers.forEach(function(p){
    var al=dimPlayer(p.id);
    if(al<1){ctx.save();ctx.globalAlpha=al;drawPlayer(p);ctx.restore();}else drawPlayer(p);
  });
  assigns.forEach(function(a){
    if(play==='run'&&a.phase==='pass')return;
    if(play==='pass'&&a.phase==='run')return;
    if(visIds&&!visIds[a.pid])return;
    if(quizOn&&focusId&&a.pid===focusId)return;      // quiz hides the answer
    var al=dimFor(a.pid);
    if(al<1){ctx.save();ctx.globalAlpha=al;drawAssign(a);ctx.restore();}else drawAssign(a);
  });
  if(!boxView)drawBall();
  ctx.restore();
  callStrip();fillPlayerSelect();renderCard();
  if(_ready)scheduleSave();
}

function mk(x,y,lb,sh,col,lk,dl,dt){return{id:nextId(),x:x,y:y,label:lb,shape:sh||'circle',color:col,locked:!!lk,dl:dl||null,dt:!!dt};}
// interior DT technique name from horizontal offset to the ball/center (0,1,2i,2,3,4i,4,5)
function dtTech(dx){
  var G=OL_G,T=OL_T,r=R(),ax=Math.abs(dx);
  var anchors=[{t:'0',d:0},{t:'1',d:G*0.5},{t:'2i',d:G*0.82},{t:'2',d:G},{t:'3',d:G+T*0.35},{t:'4i',d:G+T*0.68},{t:'4',d:G+T},{t:'5',d:G+T+r*1.5}];
  var best=anchors[0],bd=1e9;anchors.forEach(function(o){var dd=Math.abs(ax-o.d);if(dd<bd){bd=dd;best=o;}});
  return best.t;
}
function updateDTLabel(p){if(p&&p.dt){p.label=dtTech(p.x-ballX);p.dl=null;}}

function remapManTargets(){

function applyWRSplits(){
  // HS numbers sit ~6 yds from each sideline (W-relative), so X/Z hold their split on any
  // hash. Strength side follows the manual Flip toggle, not the hash — the offense declares
  // strength; the defense reacts to field/boundary in alignDBsToWRs()/applyCoverage().
  var nubL=Math.round(W*0.115),nubR=W-Math.round(W*0.115);
  var xNub=flip?nubR:nubL,zNub=flip?nubL:nubR;
  var rtX=ballX+OL_G+OL_T,ltX=ballX-OL_G-OL_T;
  var byLbl={};
  players.forEach(function(p){if(p.color===O)byLbl[p.label]=p;});
  var X=byLbl.X,Z=byLbl.Z,Y=byLbl.Y,Hp=byLbl.H,A=byLbl.A;
  if(X)X.x=xNub;
  if(Z)Z.x=zNub;
  var rThresh=rtX+Math.round(3*YD),lThresh=ltX-Math.round(3*YD);
  // A detached off-the-ball slot re-spaces once it clears the tackle by ~2 yds. This catches
  // the #3 trips receiver, which on a hash lands between the box thresholds and would
  // otherwise strand on the OL instead of spacing 4 yds inside the rest of the trips.
  var slotR=rtX+Math.round(2*YD),slotL=ltX-Math.round(2*YD);
  var rInners=[],lInners=[];
  [Y,Hp,A].forEach(function(p){
    if(!p||Math.abs(p.y-LOS)>R()*2.5)return;
    var slot=(p.y-LOS)>4;
    if(p.x>rThresh||(slot&&p.x>slotR))rInners.push(p);
    else if(p.x<lThresh||(slot&&p.x<slotL))lInners.push(p);
  });
  rInners.sort(function(a,b){return b.x-a.x;});
  lInners.sort(function(a,b){return a.x-b.x;});
  var rightAnchor=(Z&&Z.x>W/2)?Z.x:(X&&X.x>W/2)?X.x:nubR;
  var leftAnchor=(X&&X.x<W/2)?X.x:(Z&&Z.x<W/2)?Z.x:nubL;
  rInners.forEach(function(p,i){p.x=Math.round(rightAnchor-(i+1)*4*YD);});
  lInners.forEach(function(p,i){p.x=Math.round(leftAnchor+(i+1)*4*YD);});
}
// Flip formation strength: mirror the skill players (not the OL/QB) about the ball.
function mirrorSkill(){
  players.forEach(function(p){
    if(p.color!==O)return;
    if(p.label==='C'||p.label==='LG'||p.label==='RG'||p.label==='LT'||p.label==='RT')return;
    p.x=2*ballX-p.x;
  });
}
// After WRs settle, re-fit the secondary to where they actually landed: CBs over the
// outside WRs, nickel to the field-side slot, safeties spaced by receiver distribution.
function alignDBsToWRs(){
  var byLbl={};
  players.forEach(function(p){if(p.color===O)byLbl[p.label]=p;});
  var X=byLbl.X,Z=byLbl.Z;
  var cbs=players.filter(function(p){return p.color===D&&p.label==='CB';});
  cbs.sort(function(a,b){return a.x-b.x;});
  // Left CB mirrors leftmost WR, right CB mirrors rightmost WR
  var leftWR=(X&&X.x<W/2)?X:(Z&&Z.x<W/2)?Z:null;
  var rightWR=(Z&&Z.x>W/2)?Z:(X&&X.x>W/2)?X:null;
  var covDepth=Math.round(7*YD_V);
  if(cbs[0]&&leftWR){cbs[0].x=leftWR.x;cbs[0].y=LOS-covDepth;}
  if(cbs[1]&&rightWR){cbs[1].x=rightWR.x;cbs[1].y=LOS-covDepth;}
  var isMOF=Math.abs(ballX-W/2)<W*0.08;
  var onRightHash=ballX>W/2+W*0.08;
  var fieldLeft=onRightHash;
  // Nickel aligns to the field-side slot receiver
  var nick=players.filter(function(p){return p.color===D&&p.label==='NICK';})[0];
  if(nick){
    var slots=players.filter(function(p){
      return p.color===O&&p.label!=='QB'&&p.label!=='RB'&&p.label!=='FB'&&p.label!=='C'&&p.label!=='LG'&&p.label!=='RG'&&p.label!=='LT'&&p.label!=='RT'&&p.label!=='X'&&p.label!=='Z';
    });
    var fieldSlots=slots.filter(function(p){
      return isMOF?true:(fieldLeft?p.x<W/2:p.x>W/2);
    });
    if(fieldSlots.length){
      fieldSlots.sort(function(a,b){return Math.abs(a.x-ballX)-Math.abs(b.x-ballX);});
      var target=fieldSlots[0];
      nick.x=Math.round(target.x);
      nick.y=LOS-Math.round(4.5*YD_V);
    }
  }
  // Safeties: spaced by receiver distribution per side; field wider, boundary tighter
  var fs=players.filter(function(p){return p.color===D&&p.label==='FS';})[0];
  var ss=players.filter(function(p){return p.color===D&&p.label==='SS';})[0];
  var safetyDepth=LOS-Math.round(12*YD_V);
  var offPlayers=players.filter(function(p){
    return p.color===O&&p.label!=='QB'&&p.label!=='RB'&&p.label!=='FB'&&p.label!=='C'&&p.label!=='LG'&&p.label!=='RG'&&p.label!=='LT'&&p.label!=='RT';
  });
  var leftRecs=offPlayers.filter(function(p){return p.x<ballX;});
  var rightRecs=offPlayers.filter(function(p){return p.x>ballX;});
  var tripsLeft=leftRecs.length>=3;
  var tripsRight=rightRecs.length>=3;
  var widestLeft=leftRecs.length?leftRecs.reduce(function(a,b){return a.x<b.x?a:b;}):null;
  var widestRight=rightRecs.length?rightRecs.reduce(function(a,b){return a.x>b.x?a:b;}):null;
  var insideShade=Math.round(3*YD);
  var leftSafetyX=widestLeft?Math.round(widestLeft.x+insideShade):Math.round(ballX-W*0.18);
  var rightSafetyX=widestRight?Math.round(widestRight.x-insideShade):Math.round(ballX+W*0.18);
  if(!isMOF){
    if(fieldLeft){
      if(tripsLeft)leftSafetyX=Math.round(widestLeft.x+insideShade*0.5);
      if(tripsRight)rightSafetyX=Math.round(widestRight.x-insideShade*0.5);
      if(fs){fs.x=leftSafetyX;fs.y=safetyDepth;}
      if(ss){ss.x=rightSafetyX;ss.y=safetyDepth;}
    }else{
      if(tripsRight)rightSafetyX=Math.round(widestRight.x-insideShade*0.5);
      if(tripsLeft)leftSafetyX=Math.round(widestLeft.x+insideShade*0.5);
      if(fs){fs.x=rightSafetyX;fs.y=safetyDepth;}
      if(ss){ss.x=leftSafetyX;ss.y=safetyDepth;}
    }
  }else{
    if(tripsLeft)leftSafetyX=Math.round(widestLeft.x+insideShade*0.5);
    if(tripsRight)rightSafetyX=Math.round(widestRight.x-insideShade*0.5);
    if(fs){fs.x=leftSafetyX;fs.y=safetyDepth;}
    if(ss){ss.x=rightSafetyX;ss.y=safetyDepth;}
  }
}
function loadForm(key){

  curForm=key;
  saveH();
  var def=players.filter(function(p){return p.color===D;});

  if(!def.length||def.every(function(p){return !p.x&&!p.y;}))def=autoDef(key);
  players=F[key]().concat(def);
  if(flip)mirrorSkill();
  applyWRSplits();
  routes=[];
  ensureIds();remapManTargets();
  alignDBsToWRs();
  refitDefense();
  render();
}

function gp(e){
  var r=C.getBoundingClientRect(),s=e.touches?e.touches[0]:e;
  var x=(s.clientX-r.left)*(W/r.width),y=(s.clientY-r.top)*(H/r.height);
  return{x:x,y:defView?H-y:y};
}
function hitP(x,y){
  var r=hitRadius();
  for(var i=players.length-1;i>=0;i--){
    if(players[i].locked)continue;
    if(Math.hypot(x-players[i].x,y-players[i].y)<r)return i;
  }return -1;
}
// fingers need a bigger target than a mouse
function hitRadius(){return R()+(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches?12:2);}
// assignment lookup includes locked players (the offensive line) — they take blocking rules
function hitPAny(x,y){
  var r=hitRadius();
  for(var i=players.length-1;i>=0;i--){
    if(Math.hypot(x-players[i].x,y-players[i].y)<r)return i;
  }return -1;
}
function hitR(x,y){
  for(var i=routes.length-1;i>=0;i--){
    var r=routes[i];
    if(r.type==='route'||r.type==='tree'){
      var pts;
      if(r.type==='tree'){var pl=playerById(r.pid);if(!pl)continue;pts=routePoints(pl,r.concept,r.stem);}
      else{pts=routePts(r);if(!pts)continue;}
      for(var j=0;j<pts.length-1;j++){
        var dx=pts[j+1].x-pts[j].x,dy=pts[j+1].y-pts[j].y,len=Math.sqrt(dx*dx+dy*dy);
        if(len<1)continue;
        var t=Math.max(0,Math.min(1,((x-pts[j].x)*dx+(y-pts[j].y)*dy)/(len*len)));
        if(Math.hypot(x-pts[j].x-t*dx,y-pts[j].y-t*dy)<10)return i;
      }
    } else if(Math.hypot(x-r.x1,y-r.y1)<14||Math.hypot(x-r.x2,y-r.y2)<14)return i;
  }return -1;
}
function onDown(pos){
  if(tool==='erase'){
    saveH();
    var pe=hitP(pos.x,pos.y);if(pe>=0){var rid=players[pe].id;players.splice(pe,1);assigns=assigns.filter(function(a){return a.pid!==rid;});render();return;}
    var ae=hitAssign(pos.x,pos.y);if(ae>=0){assigns.splice(ae,1);render();return;}
    var ze=hitZone(pos.x,pos.y);if(ze>=0){zones.splice(ze,1);render();return;}
    var re=hitR(pos.x,pos.y);if(re>=0){routes.splice(re,1);render();return;}
    return;
  }
  var pi=hitP(pos.x,pos.y);
  if(pi>=0){
    // route tool on a def player: start a player-tied freehand route instead of dragging
    if(tool==='route'&&players[pi].color===D){
      routeAnchorId=players[pi].id;drawing=true;curPts=[pos];return;
    }
    beginEdit();dragIdx=pi;dragOff={x:pos.x-players[pi].x,y:pos.y-players[pi].y};return;
  }
  if(tool==='assign'){
    var hs=hitStem(pos.x,pos.y);if(hs>=0){beginEdit();stemDrag=hs;return;}
    var g=hitAssignGrab(pos.x,pos.y);if(g){beginEdit();dragAssign=g.i;dragMode=g.mode;return;}
    var zh=hitZone(pos.x,pos.y);if(zh>=0){beginEdit();zoneDrag={i:zh,mode:zoneVal(zones[zh],pos.x,pos.y)>0.6?'resize':'move',ox:pos.x-zones[zh].x,oy:pos.y-zones[zh].y};return;}
    return;
  }
  drawing=true;
  if(tool==='route')curPts=[pos];
  else if(tool==='block')arcStart=pos;
}
function onMove(pos){
  if(dragIdx>=0){var nx=pos.x-dragOff.x,ny=pos.y-dragOff.y;
    if(snapOn){var gx=YD/2,gy=YD_V/2;nx=Math.round(nx/gx)*gx;ny=LOS+Math.round((ny-LOS)/gy)*gy;}
    players[dragIdx].x=nx;players[dragIdx].y=ny;updateDTLabel(players[dragIdx]);paint();return;}
  if(dragAssign>=0){var da=assigns[dragAssign];if(da.shape==='circle'&&dragMode==='resize'){da.rx=Math.max(16,Math.abs(pos.x-da.tx));da.ry=Math.max(12,Math.abs(pos.y-da.ty));}else{da.tx=pos.x;da.ty=pos.y;}paint();return;}
  if(stemDrag>=0){var rt=routes[stemDrag],rpl=playerById(rt.pid);if(rpl)rt.stem=Math.max(Math.round(2*YD_V),rpl.y-pos.y);paint();return;}
  if(zoneDrag){var z=zones[zoneDrag.i];if(zoneDrag.mode==='move'){z.x=pos.x-zoneDrag.ox;z.y=pos.y-zoneDrag.oy;}else{z.rx=Math.max(16,Math.abs(pos.x-z.x));z.ry=Math.max(12,Math.abs(pos.y-z.y));}paint();return;}
  if(!drawing)return;
  if(tool==='route'){curPts.push(pos);paint();}
  else if(arcStart){
    render();
    ctx.save();if(defView){ctx.translate(0,H);ctx.scale(1,-1);}
    drawArc(arcStart.x,arcStart.y,pos.x,pos.y,'#5af');
    ctx.restore();
  }
}
function onUp(pos){
  if(dragIdx>=0){commitEdit();dragIdx=-1;render();return;}
  if(dragAssign>=0){commitEdit();dragAssign=-1;render();return;}
  if(stemDrag>=0){commitEdit();stemDrag=-1;render();return;}
  if(zoneDrag){commitEdit();zoneDrag=null;render();return;}
  if(!drawing)return;drawing=false;
  if(tool==='route'&&curPts.length>1){
    saveH();
    if(routeAnchorId!=null){

function submitForm(mode,orig,name,pb,tagsStr,downStr,oppStr){

  if(mode==='edit'){
    var oi=selfIdx>=0?selfIdx:-1;
    if(oi<0)for(var j=0;j<plays.length;j++){if(plays[j].name===orig.name){oi=j;break;}}
    if(oi<0){openModal();return;}
    if(idx>=0&&idx!==oi){if(!confirm('A play named "'+name+'" already exists. Overwrite it?'))return;plays.splice(idx,1);if(idx<oi)oi--;}

  }
  if(idx<0&&plays.length>=MAXPLAYS){alert('Maximum of '+MAXPLAYS+' saved plays reached. Delete one first.');return;}

function exportPNG(){

  var pad=16;
  var bodySize=Math.max(12,Math.round(C.width/58));
  var hdrSize=Math.max(10,Math.round(C.width/75));
  var titleSize=Math.max(18,Math.round(C.width/30));

  var maxW=C.width-pad*2,lines=[];
  if(notes){
    octx.font=bodySize+'px sans-serif';

      if(!para){lines.push('');return;}
      var words=para.split(' '),cur='';
      words.forEach(function(w){
        var test=cur?cur+' '+w:w;
        if(octx.measureText(test).width>maxW&&cur){lines.push(cur);cur=w;}else cur=test;
      });
      lines.push(cur);
    });
  }
  var notesH=notes?(pad+lineH+lines.length*lineH+pad):0;
  off.width=C.width;off.height=titleH+C.height+notesH;

    octx.fillText(title,off.width/2,titleH/2);
  }

    octx.fillStyle='#888';octx.font='bold '+hdrSize+'px sans-serif';

}

/* ---- Run fit / Pass rush / Coverage ---- */
var RFCOL='#e23b3b',PRCOL='#ff8c1a',CVCOL='#f5f5f5',BLKCOL='#9fd0ff',CARCOL='#ffc61a',RDCOL='#f06ae0',PROGCOL='#ffe066',HOTCOL='#ff5f5f';

  if(k==='progression')return PROGCOL;
  if(k==='hot')return HOTCOL;
  if(k==='run'||k==='runfit')return RFCOL;

}
function clearForPhase(pid,phase){assigns=assigns.filter(function(a){if(a.pid!==pid)return true;if(phase==='both')return false;if(phase==='run')return !(a.phase==='run'||a.phase==='both');return !(a.phase==='pass'||a.phase==='both');});}

var HIDE_BOX={'CB':1,'FS':1,'SS':1,'NICK':1,'X':1,'Z':1,'H':1,'Y':1,'WR':1};

function isBlitzing(p){return assigns.some(function(a){return a.pid===p.id&&(/blitz/i.test(a.role||'')||a.kind==='rush');});}

function hasDrawnPath(p){return routes.some(function(r){return r.tied&&r.pid===p.id;});}

function isBoxPlayer(p){if(!HIDE_BOX[p.label])return true;return p.color===D&&(isBlitzing(p)||hasDrawnPath(p));}
function isDeepRole(r){return /^Deep/.test(r||'');}
function isDeepDefender(p){return !!p&&(p.label==='CB'||p.label==='FS'||p.label==='SS');}

var RUNMENU=['A gap','B gap','C gap','D gap','Force','Contain','Spill','Fill','Cutback','Box/Alley','A-gap blitz','B-gap blitz','C-gap blitz','Edge blitz','Custom…'];
var RUSHMENU=['Contain','A rush','B rush','C rush','Slant ←','Slant →','Loop ←','Loop →','TEX — DT in / DE contain','ET — DE in / DT contain','Twist — DTs cross','Custom…'];
var COVERMENU=['Deep ⅓','Deep ½','Deep ¼','Deep Mid','Deep MOF','Flat','Quarter Flat','Curl/Flat','Hook/Curl','Hook','Seam/Wall','Wall 2','Match 3','Man','Spy','Robber','Hole','A-gap blitz','B-gap blitz','C-gap blitz','Edge blitz','Custom…'];
var STUNTS={'TEX — DT in / DE contain':1,'ET — DE in / DT contain':1,'Twist — DTs cross':1};
var ZONECOV={'Deep ⅓':1,'Deep ½':1,'Deep ¼':1,'Deep Mid':1,'Deep MOF':1,'Flat':1,'Quarter Flat':1,'Curl/Flat':1,'Hook/Curl':1,'Hook':1,'Seam/Wall':1,'Wall 2':1,'Match 3':1,'Hole':1};

function playerById(id){for(var i=0;i<players.length;i++){if(players[i].id===id)return players[i];}return null;}
function defByLabel(lb){return players.filter(function(p){return p.color===D&&p.label===lb;});}
function ensureIds(){var mx=0;players.forEach(function(p){if(typeof p.id!=='number')p.id=nextId();if(p.id>mx)mx=p.id;});if(mx>uid)uid=mx;}

function targetForRole(p,role){
  var s=p.x<ballX?-1:1,L=LOS,r=R(),D12=Math.round(12*YD_V);
  var Ag=OL_G*0.5,Bg=OL_G+OL_T*0.5,Cg=OL_G+OL_T+r*1.3,Dg=OL_G+OL_T+r*3.2;
  var manT=(function(){var rc=getReceivers();if(!rc.length)return{x:p.x,y:L-Math.round(5*YD_V)};var b=rc[0],bd=1e9;rc.forEach(function(q){var d=Math.abs(q.x-p.x);if(d<bd){bd=d;b=q;}});return{x:b.x,y:b.y};})();
  var m={
    'A gap':{x:ballX+s*Ag,y:L},'B gap':{x:ballX+s*Bg,y:L},
    'C gap':{x:ballX+s*Cg,y:L},'D gap':{x:ballX+s*Dg,y:L},
    'Force':{x:ballX+s*(Dg+r*2),y:L-Math.round(1.5*YD_V)},

function gamePush(p,role,t,curve,bow,loop){if(p){clearForPhase(p.id,'pass');var a={pid:p.id,phase:'pass',kind:'rush',role:role,tx:Math.round(t.x),ty:Math.round(t.y),curve:!!curve};if(bow!=null)a.bow=bow;if(loop)a.loop=true;assigns.push(a);}}
// TEX = tackle penetrates first (1st), End loops around to contain (2nd).
// ET  = End penetrates first (1st), Tackle loops around to contain (2nd).
// endLoops=true -> TEX (DT is 1st/penetrator, DE is 2nd/looper); false -> ET (DE 1st, DT 2nd)
function teGame(side,endLoops){
  var r=R(),Dg=OL_G+OL_T+r*3.2,dt=null,dtd=1e9,de=null,ded=-1;
  players.forEach(function(p){
    if(p.color!==D)return;
    if(p.dt&&(p.x-ballX)*side>=0){var d=Math.abs(p.x-ballX);if(d<dtd){dtd=d;dt=p;}}
    if(p.label==='DE'&&(p.x-ballX)*side>0){var e=Math.abs(p.x-ballX);if(e>ded){ded=e;de=p;}}
  });
  if(!dt||!de)return false;
  var crasher=endLoops?dt:de,looper=endLoops?de:dt;

  gamePush(crasher,'1st',{x:crasher.x-side*Math.round(2*YD),y:LOS+Math.round(0.6*YD_V)},false);
  // 2nd man: J-arc that sweeps laterally past the penetrator's lane then hooks into the vacated gap
  gamePush(looper,'2nd',{x:crasher.x,y:LOS+Math.round(0.9*YD_V)},false,null,true);

}
function twistDTs(){

}

  var cbL=LOS-Math.round(cbDepL*YD_V),cbR=LOS-Math.round(cbDepR*YD_V);
  var dR=Math.round(W*0.095),dRy=Math.round(5*YD_V),uR=Math.round(W*0.07),uRy=Math.round(3.2*YD_V),qR=Math.round(W*0.08),hR=Math.round(W*0.13);
  var clL=loX+Math.round(span*0.16),clR=hiX-Math.round(span*0.16),strongCl=strong>0?clR:clL,weakCl=strong>0?clL:clR;
  var bxL=ballX-Math.round(span*0.13),bxR=ballX+Math.round(span*0.13);
  if(scheme==='3'){
    P(cbs[0],loX,cbL);P(cbs[1],hiX,cbR);
    P(fs,ballX-strong*Math.round(span*0.22),deepY);
    P(ss,ballX+strong*Math.round(span*0.22),deepY);
    P(nick,strongCl,uy);P(will,bxL,uy);P(mike,bxR,uy);
    setCov(cbs[0],'Deep ⅓',dR,dRy,loX,deepY);setCov(fs,'Deep ⅓',dR,dRy,ballX,deepY);setCov(cbs[1],'Deep ⅓',dR,dRy,hiX,deepY);
    setCov(nick,'Curl/Flat',uR,uRy);setCov(ss,'Curl/Flat',uR,uRy,weakCl,uy);setCov(will,'Hook',uR,uRy);setCov(mike,'Hook',uR,uRy);
  }else if(scheme==='2'){
    P(cbs[0],loX,cbL);P(cbs[1],hiX,cbR);
    P(fs,ballX-Math.round(span*0.26),deepY);P(ss,ballX+Math.round(span*0.26),deepY);
    P(nick,strongCl,uy);P(will,weakCl,uy);P(mike,ballX,midY);
    setCov(cbs[0],'Flat',uR,uRy);setCov(cbs[1],'Flat',uR,uRy);
    setCov(fs,'Deep ½',hR,dRy);setCov(ss,'Deep ½',hR,dRy);
    setCov(nick,'Hook',uR,uRy);setCov(will,'Hook',uR,uRy);
    setCov(mike,'Deep Mid',Math.round(W*0.085),Math.round(4*YD_V));
  }else if(scheme==='4'){
    P(cbs[0],loX,cbL);P(cbs[1],hiX,cbR);
    P(fs,ballX-Math.round(span*0.2),deepY);P(ss,ballX+Math.round(span*0.2),deepY);
    P(nick,strongCl,uy);P(will,weakCl,uy);P(mike,ballX,uy);
    setCov(cbs[0],'Deep ¼',qR,dRy,loX,deepY);setCov(cbs[1],'Deep ¼',qR,dRy,hiX,deepY);
    setCov(fs,'Deep ¼',qR,dRy);setCov(ss,'Deep ¼',qR,dRy);
    setCov(nick,'Quarter Flat',uR,uRy);setCov(will,'Quarter Flat',uR,uRy);setCov(mike,'Hook',uR,uRy);
  }else if(scheme==='palm'){
    P(cbs[0],loX,cbL);P(cbs[1],hiX,cbR);
    P(fs,ballX-Math.round(span*0.2),deepY);P(ss,ballX+Math.round(span*0.2),deepY);
    P(nick,strongCl,uy);P(will,weakCl,uy);P(mike,ballX,uy);
    setCov(cbs[0],'Deep ¼',qR,dRy,loX,deepY);setCov(cbs[1],'Deep ¼',qR,dRy,hiX,deepY);
    setCov(fs,'Deep ¼',qR,dRy);setCov(ss,'Deep ¼',qR,dRy);
    setCov(nick,'Wall 2',uR,uRy);setCov(will,'Hook/Curl',uR,uRy);setCov(mike,'Match 3',uR,uRy);
  }else if(scheme==='6'){
    // Quarter-quarter-half: field plays Quarters, boundary plays Cover 2
    var fS=ballX<W/2?1:-1,fCl=fS>0?clR:clL;
    var fCB=fS>0?cbs[1]:cbs[0],bCB=fS>0?cbs[0]:cbs[1];
    var fSaf=fS>0?ss:fs,bSaf=fS>0?fs:ss,fX=fS>0?hiX:loX,bX=fS>0?loX:hiX;
    P(fCB,fX,cbR);P(fSaf,ballX+fS*Math.round(span*0.2),deepY);
    setCov(fCB,'Deep ¼',qR,dRy,fX,deepY);setCov(fSaf,'Deep ¼',qR,dRy,ballX+fS*Math.round(span*0.22),deepY);
    P(bCB,bX,LOS-Math.round(5*YD_V));P(bSaf,ballX-fS*Math.round(span*0.26),deepY);
    setCov(bCB,'Flat',uR,uRy,bX,uy);setCov(bSaf,'Deep ½',hR,dRy,ballX-fS*Math.round(span*0.26),deepY);
    P(nick,fCl,uy);P(will,bxL,uy);P(mike,bxR,uy);
    setCov(nick,'Curl/Flat',uR,uRy,fCl,uy);setCov(will,'Hook',uR,uRy);setCov(mike,'Hook',uR,uRy);
  }else if(scheme==='2man'){
    // Two deep halves with man-under trail technique
    manScheme='2man';
    P(fs,ballX-Math.round(span*0.26),deepY);P(ss,ballX+Math.round(span*0.26),deepY);
    setCov(fs,'Deep ½',hR,dRy,ballX-Math.round(span*0.26),deepY);setCov(ss,'Deep ½',hR,dRy,ballX+Math.round(span*0.26),deepY);
    var rc=getReceivers();
    if(rc.length&&cbs[0]){alignOver(cbs[0],rc[0]);manOn(cbs[0],rc[0]);}
    if(rc.length>1&&cbs[1]){alignOver(cbs[1],rc[rc.length-1]);manOn(cbs[1],rc[rc.length-1]);}
    var mids=rc.slice(1,Math.max(1,rc.length-1)),pool=[nick,will,mike].filter(Boolean),mp=0;
    mids.forEach(function(r){var d=pool[mp++];if(d){alignOver(d,r);manOn(d,r);}});
    manScheme='';
  }else if(scheme==='ripliz'){
    // Matched Cover 3 (Rip/Liz): 3 deep thirds, seam/wall apex carries #2
    P(cbs[0],loX,cbL);P(cbs[1],hiX,cbR);
    P(fs,ballX,deepY);P(ss,ballX+strong*Math.round(span*0.22),deepY);
    P(nick,strongCl,uy);P(will,bxL,uy);P(mike,bxR,uy);
    setCov(cbs[0],'Deep ⅓',dR,dRy,loX,deepY);setCov(fs,'Deep ⅓',dR,dRy,ballX,deepY);setCov(cbs[1],'Deep ⅓',dR,dRy,hiX,deepY);
    setCov(nick,'Seam/Wall',uR,uRy);setCov(ss,'Seam/Wall',uR,uRy,weakCl,uy);setCov(will,'Hook',uR,uRy);setCov(mike,'Hook',uR,uRy);
  }else if(scheme==='1'){
    manScheme='1';manCover(true);manScheme='';
    if(fs){fs.x=ballX-strong*Math.round(span*0.22);fs.y=deepY;}
    if(ss){ss.x=ballX+strong*Math.round(span*0.22);ss.y=deepY;}
    setCov(fs,'Deep MOF',hR,dRy,ballX,deepY);
  }else if(scheme==='0'){
    manScheme='0';manCover(false);manScheme='';
    if(fs){fs.x=ballX-strong*Math.round(span*0.22);fs.y=deepY;}
    if(ss){ss.x=ballX+strong*Math.round(span*0.22);ss.y=deepY;}
  }
  assigns.forEach(function(a){
    if(a.shape!=='circle')return;
    for(var i=0;i<zones.length;i++){if(zones[i].label===a.role){zones[i].x=a.tx;zones[i].y=a.ty;break;}}
  });
  render();
}

/* ================= RUN GAME =================
   Blocking rules, puller paths, ball-carrier tracks, and one-click concepts.
   Blocks live in `assigns` with kind 'block' (phase 'run'); the carrier uses
   kind 'carry'. Both may carry an explicit `path` for pulls and tracks. */
function isOL(p){return p.color===OLC;}
function olSorted(){return players.filter(isOL).sort(function(a,b){return a.x-b.x;});}
function olMap(){var m={};players.forEach(function(p){if(isOL(p))m[p.label]=p;});return m;}
function qbOf(){var q=null;players.forEach(function(p){if(p.color===Q)q=p;});return q;}
function backOf(){var b=null;players.forEach(function(p){if(p.color===O&&/^(RB|FB)$/.test(p.label)&&(!b||p.y>b.y))b=p;});return b;}
function leadOf(){ // second back / H-back available to lead or kick
  var q=qbOf(),c=backOf(),b=null;
  players.forEach(function(p){
    if(p.color!==O||p===c||!/^(FB|H|Y|TE)$/.test(p.label))return;
    if(p.y<=LOS+Math.round(0.5*YD_V))return;            // must be off the ball
    if(!b||Math.abs(p.x-ballX)<Math.abs(b.x-ballX))b=p;
  });
  return b;
}
function tightTo(dir){ // on-line TE toward dir
  var b=null,bd=1e9;
  players.forEach(function(p){
    if(p.color!==O||!/^(Y|TE|H)$/.test(p.label))return;
    if((p.x-ballX)*dir<=0)return;
    if(p.y>LOS+Math.round(1.2*YD_V))return;
    var d=Math.abs(p.x-ballX);if(d<bd){bd=d;b=p;}
  });
  return b;
}
function defLine(){return players.filter(function(p){return p.color===D&&isDL(p);}).sort(function(a,b){return a.x-b.x;});}
function backers(){return players.filter(function(p){return p.color===D&&/^(MIKE|WILL|SAM|NICK)$/.test(p.label);});}
function emlos(dir){var b=null,bd=-1e9;defLine().forEach(function(p){var d=(p.x-ballX)*dir;if(d>bd){bd=d;b=p;}});return b;}
function defInGap(x,dir,w){ // nearest DL from x out to one gap toward dir
  var b=null,bd=1e9;
  defLine().forEach(function(p){
    var rel=(p.x-x)*dir;
    if(rel<-w*0.40||rel>w*1.30)return;
    if(Math.abs(rel)<bd){bd=Math.abs(rel);b=p;}
  });
  return b;
}
function nearestBacker(x){var b=null,bd=1e9;backers().forEach(function(p){var d=Math.abs(p.x-x);if(d<bd){bd=d;b=p;}});return b;}
function claimed(){var s={};assigns.forEach(function(a){if(a.phase==='run'&&a.targetPid!=null)s[a.targetPid]=1;});return s;}
function freeBacker(x){ // nearest linebacker nobody is already working to
  var used=claimed(),b=null,bd=1e9;
  backers().forEach(function(p){if(used[p.id])return;var d=Math.abs(p.x-x);if(d<bd){bd=d;b=p;}});
  return b||nearestBacker(x);
}

function blockOn(p,role,def){if(!p||!def)return;clearForPhase(p.id,'run');assigns.push({pid:p.id,phase:'run',kind:'block',role:role,targetPid:def.id,tx:def.x,ty:def.y});}
function blockAt(p,role,x,y){if(!p)return;clearForPhase(p.id,'run');assigns.push({pid:p.id,phase:'run',kind:'block',role:role,tx:Math.round(x),ty:Math.round(y)});}
function blockPath(p,role,pts){if(!p)return;clearForPhase(p.id,'run');var q=pts.map(function(o){return{x:Math.round(o.x),y:Math.round(o.y)};});assigns.push({pid:p.id,phase:'run',kind:'block',role:role,path:q,tx:q[q.length-1].x,ty:q[q.length-1].y});}
function carryPath(p,role,pts){if(!p)return;clearForPhase(p.id,'run');var q=pts.map(function(o){return{x:Math.round(o.x),y:Math.round(o.y)};});assigns.push({pid:p.id,phase:'run',kind:'carry',role:role,path:q,tx:q[q.length-1].x,ty:q[q.length-1].y});}
function clearRun(){assigns=assigns.filter(function(a){return a.phase!=='run'||!/^(block|carry|read)$/.test(a.kind);});}

/* ---- schemes ---- */
// zone: everybody steps playside; covered linemen take the man, uncovered combo to a backer
function zoneScheme(dir,wide){
  var ol=olSorted(),g=OL_G;
  ol.forEach(function(p){
    var def=defInGap(p.x,dir,g);
    if(def)blockOn(p,wide?'Reach':'Base',def);
    else{var lb=freeBacker(p.x+dir*g*0.5);if(lb)blockOn(p,'Combo',lb);else blockAt(p,'Climb',p.x+dir*g*0.7,LOS-Math.round(3*YD_V));}
  });
  var bs=dir>0?ol[0]:ol[ol.length-1];
  if(bs){var d=defInGap(bs.x,-dir,g);if(d)blockOn(bs,'Cut off',d);else blockAt(bs,'Cut off',bs.x-dir*g*0.8,LOS-Math.round(0.7*YD_V));}
  var te=tightTo(dir);
  if(te){var td=defInGap(te.x,dir,g)||emlos(dir);if(td)blockOn(te,wide?'Reach':'Base',td);}
}
// gap: playside blocks down, a backside lineman pulls
function downBlocks(dir){
  var ol=olSorted(),g=OL_G;
  ol.forEach(function(p){
    if((p.x-ballX)*dir<0)return;                   // playside + center only
    var def=defInGap(p.x,-dir,g);
    if(def)blockOn(p,'Down',def);
    else{var lb=freeBacker(p.x-dir*g*0.4);if(lb)blockOn(p,'Down',lb);else blockAt(p,'Down',p.x-dir*g*0.8,LOS-Math.round(0.8*YD_V));}
  });
  var te=tightTo(dir);
  if(te){var td=defInGap(te.x,-dir,g);if(td)blockOn(te,'Down',td);}
}
function hingeBackside(dir){
  var m=olMap(),g=OL_G,bst=dir>0?m.LT:m.RT;
  if(!bst)return;
  var d=defInGap(bst.x,-dir,g);
  if(d)blockOn(bst,'Hinge',d);else blockAt(bst,'Hinge',bst.x-dir*g*0.7,LOS-Math.round(0.6*YD_V));
}
function pullWrap(p,dir,throughX){
  if(!p)return;
  blockPath(p,'Pull — wrap',[
    {x:p.x,y:p.y},
    {x:ballX,y:LOS+Math.round(1.5*YD_V)},
    {x:throughX,y:LOS+Math.round(0.7*YD_V)},
    {x:throughX+dir*OL_G*0.3,y:LOS-Math.round(2.2*YD_V)}
  ]);
}
function pullKick(p,dir,e){
  if(!p)return;
  var tx=e?e.x:ballX+dir*(OL_G+OL_T+Math.round(2*YD)),ty=e?e.y:LOS-Math.round(0.6*YD_V);
  blockPath(p,'Pull — kick',[
    {x:p.x,y:p.y},
    {x:ballX+dir*OL_G*0.6,y:LOS+Math.round(1.4*YD_V)},
    {x:tx-dir*OL_G*0.5,y:LOS+Math.round(0.4*YD_V)},
    {x:tx,y:ty}
  ]);
}
function kickWith(p,dir,e){
  if(!p||!e)return;
  blockPath(p,'Kick out',[{x:p.x,y:p.y},{x:e.x-dir*OL_G*0.5,y:LOS+Math.round(0.6*YD_V)},{x:e.x,y:e.y}]);
}
function arcAcross(p,dir,e){
  if(!p||!e)return;
  blockPath(p,'Arc',[{x:p.x,y:p.y},{x:ballX-dir*OL_G*0.5,y:LOS+Math.round(1.3*YD_V)},{x:e.x+dir*OL_G*0.2,y:e.y}]);
}
// ball-carrier track: aiming point measured in gaps off the ball
function track(dir,gaps,depth,label,who){
  var rb=who||backOf(),qb=qbOf();
  if(!rb)return;
  var aim=ballX+dir*gaps*OL_G,pts=[{x:rb.x,y:rb.y}];
  if(qb&&rb.y>qb.y)pts.push({x:(rb.x+qb.x)/2+dir*Math.round(0.4*YD),y:qb.y+Math.round(0.2*YD_V)});
  pts.push({x:aim,y:LOS+Math.round(0.8*YD_V)});
  pts.push({x:aim+dir*Math.round(0.6*YD),y:LOS-Math.round(depth*YD_V)});
  carryPath(rb,label||'Track',pts);
}
function qbKeep(dir,gaps,depth){
  var qb=qbOf();if(!qb)return;
  var aim=ballX+dir*gaps*OL_G;
  carryPath(qb,'Keep',[{x:qb.x,y:qb.y},{x:aim,y:LOS+Math.round(0.8*YD_V)},{x:aim+dir*Math.round(0.6*YD),y:LOS-Math.round(depth*YD_V)}]);
}
function readKey(dir){ // leave the read defender unblocked and mark him
  var e=emlos(dir);if(!e)return;
  assigns=assigns.filter(function(a){return a.targetPid!==e.id;});
  clearForPhase(e.id,'run');
  assigns.push({pid:e.id,phase:'run',kind:'read',role:'READ',tx:e.x,ty:e.y});
}

var RUNPLAY={
  inside_zone:function(d){zoneScheme(d,false);track(d,0.6,4,'Track — A');},
  wide_zone:  function(d){zoneScheme(d,true); track(d,2.6,4,'Track — outside');},
  split_zone: function(d){zoneScheme(d,false);arcAcross(leadOf(),d,emlos(-d));track(d,0.6,4,'Track — A');},
  power:      function(d){downBlocks(d);hingeBackside(d);var m=olMap();pullWrap(d>0?m.LG:m.RG,d,(d>0?m.RT:m.LT||{x:ballX}).x);kickWith(leadOf(),d,emlos(d));track(d,1.5,4,'Track — B');},
  counter_gt: function(d){downBlocks(d);hingeBackside(d);var m=olMap();pullKick(d>0?m.LG:m.RG,d,emlos(d));pullWrap(d>0?m.LT:m.RT,d,(d>0?m.RT:m.LT||{x:ballX}).x);track(d,1.5,4,'Counter — B');},
  iso:        function(d){zoneScheme(d,false);var lb=freeBacker(ballX+d*OL_G*0.5),ld=leadOf();if(ld&&lb)blockOn(ld,'Lead / Iso',lb);track(d,0.5,4,'Track — A');},
  trap:       function(d){var m=olMap(),g=OL_G;olSorted().forEach(function(p){if((p.x-ballX)*d<0)return;var def=defInGap(p.x,d,g);if(def)blockOn(p,'Base',def);else{var lb=freeBacker(p.x);if(lb)blockOn(p,'Climb',lb);}});pullKick(d>0?m.LG:m.RG,d,defInGap(ballX+d*OL_G,d,g));hingeBackside(d);track(d,0.6,4,'Track — A');},
  buck_sweep: function(d){downBlocks(d);var m=olMap();pullKick(d>0?m.RG:m.LG,d,emlos(d));pullWrap(d>0?m.LG:m.RG,d,(d>0?m.RT:m.LT||{x:ballX}).x);hingeBackside(d);track(d,2.8,4,'Sweep');},
  toss:       function(d){zoneScheme(d,true);kickWith(leadOf(),d,emlos(d));track(d,3.4,4,'Toss');},
  zone_read:  function(d){zoneScheme(d,false);readKey(-d);track(d,0.6,4,'Give — A');qbKeep(-d,2.4,3);},
  power_read: function(d){downBlocks(d);hingeBackside(d);var m=olMap();pullWrap(d>0?m.LG:m.RG,d,(d>0?m.RT:m.LT||{x:ballX}).x);readKey(d);track(-d,2.8,3,'Sweep');qbKeep(d,1.5,3);},
  qb_counter: function(d){downBlocks(d);hingeBackside(d);var m=olMap();pullKick(d>0?m.LG:m.RG,d,emlos(d));pullWrap(d>0?m.LT:m.RT,d,(d>0?m.RT:m.LT||{x:ballX}).x);qbKeep(d,1.5,4);}
};

/* ---- manual run assignments (right-click / double-tap an offensive player) ---- */
var BLOCKMENU=['Base','Down','Reach','Combo','Climb','Cut off','Hinge','Fan','Pull — kick','Pull — wrap','Kick out','Arc','Pass set','Custom…'];
var CARRYMENU=['Track — A','Track — B','Track — C','Track — outside','Sweep','Toss','Keep','Lead','Custom…'];
var PROTMENU=['Pass set','Base','Hinge','Fan','Pull — kick','Custom…'];
var PERIMMENU=['Stalk','Crack','Arc','Cut off','Custom…'];
function nearestDB(p){
  var b=null,bd=1e9;
  players.forEach(function(q){
    if(q.color!==D||!/^(CB|FS|SS|NICK)$/.test(q.label))return;
    var d=Math.hypot(q.x-p.x,q.y-p.y);if(d<bd){bd=d;b=q;}
  });
  return b;
}
function addBlockAssign(pi,role){
  var p=players[pi],d=runDir,g=OL_G;
  if(role==='Custom…'){var v=prompt('Block label:');if(v===null)return;v=v.trim();if(!v)return;saveH();blockAt(p,v,p.x+d*g,LOS-Math.round(0.8*YD_V));closeMenu();render();return;}
  saveH();
  if(/^Pull — kick/.test(role))pullKick(p,d,emlos(d));
  else if(/^Pull — wrap/.test(role)){var m=olMap();pullWrap(p,d,((d>0?m.RT:m.LT)||{x:ballX}).x);}
  else if(role==='Kick out')kickWith(p,d,emlos(d));
  else if(role==='Arc')arcAcross(p,d,emlos(-d));
  else if(role==='Stalk'){var db=nearestDB(p);if(db)blockOn(p,role,db);else blockAt(p,role,p.x,LOS-Math.round(6*YD_V));}
  else if(role==='Crack'){var ci=defInGap(p.x,-d,g*2)||nearestBacker(p.x-d*g);if(ci)blockOn(p,role,ci);else blockAt(p,role,p.x-d*g*2,LOS-Math.round(3*YD_V));}
  else if(role==='Climb'){var lb=freeBacker(p.x);if(lb)blockOn(p,role,lb);else blockAt(p,role,p.x,LOS-Math.round(3*YD_V));}
  else if(role==='Down'||role==='Cut off'||role==='Hinge'){var dn=defInGap(p.x,-d,g);if(dn)blockOn(p,role,dn);else blockAt(p,role,p.x-d*g*0.8,LOS-Math.round(0.8*YD_V));}
  else if(role==='Pass set')blockAt(p,role,p.x,LOS+Math.round(1.2*YD_V));
  else if(role==='Combo'){var lb3=freeBacker(p.x+d*g*0.5);if(lb3)blockOn(p,role,lb3);else blockAt(p,role,p.x+d*g*0.5,LOS-Math.round(2.5*YD_V));}
  else{var tgt=defInGap(p.x,d,g)||defInGap(p.x,-d,g);if(tgt)blockOn(p,role,tgt);else blockAt(p,role,p.x+d*g*0.3,LOS-Math.round(1*YD_V));}
  closeMenu();render();
}
function addCarryAssign(pi,role){
  var p=players[pi],d=runDir;
  if(role==='Custom…'){var v=prompt('Label:');if(v===null)return;v=v.trim();if(!v)return;saveH();carryPath(p,v,[{x:p.x,y:p.y},{x:ballX+d*OL_G,y:LOS-Math.round(3*YD_V)}]);closeMenu();render();return;}
  saveH();
  var gaps={'Track — A':0.6,'Track — B':1.5,'Track — C':2.4,'Track — outside':3.2,'Sweep':3.4,'Toss':3.6}[role];

/* ---- personnel grouping: backs and tight ends on the field ---- */
// attached = within a few yards of the end of the offensive line and up near it
function attachedToLine(p){
  var ol=players.filter(isOL);if(!ol.length)return false;
  var lo=1e9,hi=-1e9;
  ol.forEach(function(q){if(q.x<lo)lo=q.x;if(q.x>hi)hi=q.x;});
  var gap=Math.min(Math.abs(p.x-lo),Math.abs(p.x-hi));
  return gap<=Math.round(3.6*YD)&&p.y<=LOS+Math.round(2.4*YD_V);
}
function personnel(){
  var backs=0,te=0;
  players.forEach(function(p){
    if(p.color!==O)return;
    if(/^(RB|FB|HB|AB|WB)$/.test(p.label))backs++;
    else if(/^(Y|TE|U|W)$/.test(p.label)&&attachedToLine(p))te++;
  });
  return String(Math.min(backs,9))+String(Math.min(te,9));
}

/* ================= PASS CONCEPTS =================
   A concept assigns a route to each eligible by his position in the formation
   (#1 = outside, #2 = next in, #3 = inside) on each side of the ball, then
   numbers the quarterback's progression. */
function eligibles(){
  return players.filter(function(p){
    return p.color===O && !isOL(p) && !/^(QB)$/.test(p.label);
  });
}
// receivers ordered outside-in on one side: #1, #2, #3
function sideStack(dir){
  return eligibles().filter(function(p){
    return (p.x-ballX)*dir>0 && p.y<=LOS+Math.round(3*YD_V);
  }).sort(function(a,b){
    return Math.abs(b.x-ballX)-Math.abs(a.x-ballX);
  });
}
function backfield(){
  return eligibles().filter(function(p){return p.y>LOS+Math.round(3*YD_V);})
    .sort(function(a,b){return a.x-b.x;});
}
function setRoute(p,concept,stem){
  if(!p)return;
  routes=routes.filter(function(r){return !(r.type==='tree'&&r.pid===p.id);});
  routes.push({type:'tree',pid:p.id,concept:concept,stem:stem==null?defStem(concept):Math.round(stem*YD_V),col:'#5af'});
}
function clearPass(){
  routes=routes.filter(function(r){return r.type!=='tree';});
  assigns=assigns.filter(function(a){return a.kind!=='progression'&&a.kind!=='hot'&&!(a.kind==='block'&&a.phase==='pass');});
}
function progression(list){
  list.forEach(function(p,i){
    if(!p)return;
    assigns.push({pid:p.id,phase:'pass',kind:'progression',role:String(i+1),tx:p.x,ty:p.y});
  });
}
function hotMark(p){
  if(!p)return;
  assigns.push({pid:p.id,phase:'pass',kind:'hot',role:'HOT',tx:p.x,ty:p.y});
}
// five-man slide protection with the back checking the backside edge
function slideProtect(dir){
  olSorted().forEach(function(p){
    assigns.push({pid:p.id,phase:'pass',kind:'block',role:'Slide',tx:Math.round(p.x+dir*OL_G*0.35),ty:Math.round(LOS+0.9*YD_V)});
  });

    if(e)assigns.push({pid:bk.id,phase:'pass',kind:'block',role:'Check',targetPid:e.id,tx:e.x,ty:e.y});
    else assigns.push({pid:bk.id,phase:'pass',kind:'block',role:'Check',tx:Math.round(bk.x-dir*OL_G),ty:Math.round(LOS+0.9*YD_V)});
  }
}

/* ================= ANIMATION =================
   Every player's travel path is derived from whatever he was already assigned,
   so the snap plays back the diagram rather than a separate set of data. */
var animT=null,animPlaying=false,animSpeed=1,_animPos=null,_animLast=0;
function posAt(pts,t){
  if(!pts||!pts.length)return null;
  if(pts.length===1)return{x:pts[0].x,y:pts[0].y};
  t=Math.max(0,Math.min(1,t));
  var segs=[],total=0,i;
  for(i=0;i<pts.length-1;i++){var d=Math.hypot(pts[i+1].x-pts[i].x,pts[i+1].y-pts[i].y);segs.push(d);total+=d;}
  if(total<=0)return{x:pts[0].x,y:pts[0].y};
  var want=t*total,acc=0;
  for(i=0;i<segs.length;i++){
    if(acc+segs[i]>=want){var u=segs[i]?(want-acc)/segs[i]:0;return{x:pts[i].x+(pts[i+1].x-pts[i].x)*u,y:pts[i].y+(pts[i+1].y-pts[i].y)*u};}
    acc+=segs[i];
  }
  var n=pts.length-1;return{x:pts[n].x,y:pts[n].y};
}
function playerPath(p){
  if(!p)return null;
  var i,r;
  for(i=0;i<routes.length;i++){
    r=routes[i];
    if(r.type==='tree'&&r.pid===p.id&&play!=='run')return routePoints(p,r.concept,r.stem);
    if(r.type==='route'&&r.tied&&r.pid===p.id)return routePts(r);
  }
  var best=null;
  for(i=0;i<assigns.length;i++){
    var a=assigns[i];
    if(a.pid!==p.id)continue;
    if(play==='run'&&a.phase==='pass')continue;
    if(play==='pass'&&a.phase==='run')continue;
    if(a.kind==='progression'||a.kind==='hot'||a.kind==='read')continue;
    if(a.path&&a.path.length>1)return a.path;
    if(a.kind==='cover'&&a.targetPid!=null)continue;      // handled as man trail
    if(a.tx!=null&&a.ty!=null)best={x:a.tx,y:a.ty};
  }
  if(best)return[{x:p.x,y:p.y},best];
  return null;
}
function animPositions(t){
  var pos={},base={};
  players.forEach(function(p){pos[p.id]={x:p.x,y:p.y};base[p.id]={x:p.x,y:p.y};});
  players.forEach(function(p){
    var pts=playerPath(p);
    if(pts&&pts.length>1){var q=posAt(pts,t);if(q)pos[p.id]=q;}
  });
  // man defenders trail their receiver, holding their original leverage
  assigns.forEach(function(a){
    if(a.kind!=='cover'||a.targetPid==null)return;
    var d=playerById(a.pid),rcv=playerById(a.targetPid);
    if(!d||!rcv)return;
    var rp=posAt(playerPath(rcv)||[base[rcv.id]],Math.max(0,t-0.12))||base[rcv.id];
    pos[d.id]={x:rp.x+(base[d.id].x-base[rcv.id].x)*0.55,y:rp.y+(base[d.id].y-base[rcv.id].y)*0.75};
  });
  return pos;
}
function setAnim(t){
  animT=t;
  _animPos=(t==null)?null:animPositions(t);
  var sl=document.getElementById('anim');
  if(sl&&t!=null)sl.value=Math.round(t*100);
  render();
}
function animStep(ts){
  if(!animPlaying)return;
  if(!_animLast)_animLast=ts;
  var dt=(ts-_animLast)/1000;_animLast=ts;
  var t=(animT==null?0:animT)+dt*animSpeed/2.6;   // a snap runs about 2.6 seconds
  if(t>=1){setAnim(1);stopAnim();return;}
  setAnim(t);
  requestAnimationFrame(animStep);
}
function startAnim(){
  if(animT==null||animT>=1)animT=0;
  animPlaying=true;_animLast=0;
  document.getElementById('btn-play').textContent='❚❚ Pause';
  requestAnimationFrame(animStep);
}
function stopAnim(){
  animPlaying=false;_animLast=0;
  document.getElementById('btn-play').textContent='▶ Snap';
}
function resetAnim(){stopAnim();setAnim(null);}
function px(p){return _animPos&&_animPos[p.id]?_animPos[p.id].x:p.x;}
function py(p){return _animPos&&_animPos[p.id]?_animPos[p.id].y:p.y;}

function alignDesc(p){
  var side=p.x<ballX?'left':(p.x>ballX?'right':'over the ball');
  var wide=Math.abs(yds(p.x-ballX));
  var depth=Math.round(Math.abs(p.y-LOS)/YD_V*10)/10;
  var rel=p.y>LOS+2?(depth+' yds deep'):(p.y<LOS-2?depth+' yds off the ball':'on the ball');
  if(p.dt)return p.label+' technique · '+rel;

  routes.forEach(function(q){if(q.type==='tree'&&q.pid===p.id)r=q;});
  if(r&&play!=='run')lines.push('ROUTE — '+r.concept+' at '+Math.round(r.stem/YD_V)+' yds');
  var mine=assigns.filter(function(a){
    if(a.pid!==p.id)return false;
    if(play==='run'&&a.phase==='pass')return false;
    if(play==='pass'&&a.phase==='run')return false;
    return true;
  });
  mine.forEach(function(a){
    if(a.kind==='progression'){lines.push('READ — you are number '+a.role+' in the progression');return;}
    if(a.kind==='hot'){lines.push('HOT — sight adjust if they bring pressure');return;}
    if(a.kind==='read'){lines.push('READ KEY — the quarterback is reading you; you are unblocked');return;}
    if(a.kind==='motion'){lines.push('MOTION — '+a.role);return;}
    if(a.kind==='block'){
      var t=a.targetPid!=null?playerById(a.targetPid):null;
      lines.push('BLOCK — '+a.role+(t?' on the '+t.label:''));return;
    }
    if(a.kind==='carry'){lines.push('BALL — '+a.role);return;}
    if(a.kind==='cover'){
      var t2=a.targetPid!=null?playerById(a.targetPid):null;
      lines.push('COVER — '+a.role+(t2?' ('+t2.label+')':''));return;
    }
    if(a.kind==='rush'){lines.push('RUSH — '+a.role);return;}
    if(a.kind==='run'){lines.push('FIT — '+a.role);return;}
    lines.push(a.role);
  });
  if(p.color===D){
    if(isDL(p))lines.push('KEY — the near lineman; get off on the ball');
    else if(/MIKE|WILL|SAM|JACK|RUSH/.test(p.label))lines.push('KEY — backfield flow and the guard in front of you');
    else lines.push('KEY — the number '+(/CB/.test(p.label)?'1':'2')+' receiver to your side');
  }
  if(lines.length===1)lines.push('No assignment yet — double-click to give this player a job.');
  return lines.join('\n');
}
