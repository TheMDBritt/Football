// minimal PDF writer: one JPEG per page, DCTDecode, no dependencies
function dataURLBytes(u){
  var b=atob(u.split(',')[1]),a=new Uint8Array(b.length);
  for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);
  return a;
}
function buildPDF(pages,pw,ph){
  var chunks=[],offsets=[],pos=0;
  function put(v){
    if(typeof v==='string'){var a=new Uint8Array(v.length);for(var i=0;i<v.length;i++)a[i]=v.charCodeAt(i)&0xff;chunks.push(a);pos+=a.length;}
    else{chunks.push(v);pos+=v.length;}
  }
  function obj(n,body,stream){
    offsets[n]=pos;
    put(n+' 0 obj\n'+body+'\n');
    if(stream!=null){put('stream\n');put(stream);put('\nendstream\n');}
    put('endobj\n');
  }
  put('%PDF-1.4\n');
  var N=pages.length,kids=[],i;
  for(i=0;i<N;i++)kids.push((3+3*i)+' 0 R');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+N+' >>');
  for(i=0;i<N;i++){
    var pg=3+3*i,cn=pg+1,im=pg+2,src=pages[i];
    var content='q '+pw+' 0 0 '+ph+' 0 0 cm /Im0 Do Q';
    obj(pg,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pw+' '+ph+'] /Resources << /XObject << /Im0 '+im+' 0 R >> >> /Contents '+cn+' 0 R >>');
    obj(cn,'<< /Length '+content.length+' >>',content);
    obj(im,'<< /Type /XObject /Subtype /Image /Width '+src.w+' /Height '+src.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+src.data.length+' >>',src.data);
  }
  var xref=pos,total=2+3*N;
  var tail='xref\n0 '+(total+1)+'\n0000000000 65535 f \n';
  for(var k=1;k<=total;k++)tail+=('0000000000'+(offsets[k]||0)).slice(-10)+' 00000 n \n';
  tail+='trailer\n<< /Size '+(total+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n';
  put(tail);
  var len=0;chunks.forEach(function(c){len+=c.length;});
  var out=new Uint8Array(len),off=0;
  chunks.forEach(function(c){out.set(c,off);off+=c.length;});
  return new Blob([out],{type:'application/pdf'});
}
function saveBlob(blob,name){
  var u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove();},400);
}

// run fn with a saved play temporarily installed as the live document
function withPlay(rec,fn){
  var keep={players:players,routes:routes,assigns:assigns,zones:zones,ballX:ballX,play:play,
    defView:defView,boxView:boxView,curForm:curForm,curFront:curFront,curCov:curCov,
    curPress:curPress,curRun:curRun,curPass:curPass,focusId:focusId,animT:animT,_animPos:_animPos,ready:_ready};
  _ready=false;                                   // never let a preview overwrite the session
  try{
    players=JSON.parse(JSON.stringify(rec.players||[]));
    routes=JSON.parse(JSON.stringify(rec.routes||[]));
    assigns=JSON.parse(JSON.stringify(rec.assigns||[]));
    zones=JSON.parse(JSON.stringify(rec.zones||[]));
    if(typeof rec.ballX==='number')ballX=rec.ballX;
    play=rec.play||'pass';defView=!!rec.defView;boxView=!!rec.boxView;
    curForm=rec.form||'';curFront=rec.front||'';curCov=rec.cov||'';
    curPress=rec.press||'';curRun=rec.run||'';curPass=rec.pass||'';
    focusId=null;animT=null;_animPos=null;
    ensureIds();normalizeAssigns();
    fn();
  }finally{
    players=keep.players;routes=keep.routes;assigns=keep.assigns;zones=keep.zones;
    ballX=keep.ballX;play=keep.play;defView=keep.defView;boxView=keep.boxView;
    curForm=keep.curForm;curFront=keep.curFront;curCov=keep.curCov;curPress=keep.curPress;
    curRun=keep.curRun;curPass=keep.curPass;focusId=keep.focusId;animT=keep.animT;
    _animPos=keep._animPos;_ready=keep.ready;
  }
}
function situationOf(p){
  var bits=[];
  if(p.down)bits.push(p.down+(p.dist?' & '+p.dist:''));
  if(p.hash)bits.push({mof:'MOF',lh:'Left hash',rh:'Right hash',lm:'Left mid',rm:'Right mid'}[p.hash]||p.hash);
  if(p.opponent)bits.push('vs '+p.opponent);
  return bits.join('   ·   ');
}
var SHEETGRID={4:[2,2],6:[3,2],8:[4,2]};
function scoutSheet(perPage,asPDF){
  var list=filteredPlays();
  if(!list.length){alert('No saved plays to print. Save a play first.');return;}
  var grid=SHEETGRID[perPage]||SHEETGRID[6],cols=grid[0],rows=grid[1];
  var PW=1650,PH=1275,pad=22,band=52;                       // letter landscape at ~150dpi
  var cw=Math.floor((PW-pad*(cols+1))/cols),chh=Math.floor((PH-pad*(rows+1))/rows);
  var pages=[],pn=0;
  var off=document.createElement('canvas');off.width=PW;off.height=PH;
  var o=off.getContext('2d');
  function newPage(){
    o.fillStyle='#ffffff';o.fillRect(0,0,PW,PH);
    o.fillStyle='#14181a';o.font='bold 26px sans-serif';o.textAlign='left';o.textBaseline='middle';
    o.fillText((titleEl.value.trim()||'Scout cards'),pad,20);
    o.textAlign='right';o.fillStyle='#6f7a73';o.font='15px sans-serif';
    o.fillText('Page '+(pages.length+1),PW-pad,20);
  }
  newPage();
  list.forEach(function(rec,i){
    var slot=i%perPage;
    if(slot===0&&i>0){pages.push(off.toDataURL('image/jpeg',0.86));newPage();}
    var c=slot%cols,r=Math.floor(slot/cols);
    var x=pad+c*(cw+pad),y=36+pad+r*(chh+pad);
    o.strokeStyle='#ccd3c8';o.lineWidth=1.5;o.strokeRect(x,y,cw,chh-36);
    o.fillStyle='#14181a';o.font='bold 19px sans-serif';o.textAlign='left';o.textBaseline='top';
    o.fillText(String(i+1)+'.  '+rec.name,x+8,y+7);
    var sit=situationOf(rec);
    if(sit){o.fillStyle='#5c6360';o.font='13px sans-serif';o.fillText(sit,x+8,y+30);}
    withPlay(rec,function(){render();});
    var iw=cw-12,ih=chh-36-band+8;
    var ar=C.width/C.height,fit=Math.min(iw/C.width,ih/C.height);
    o.drawImage(C,x+6+(iw-C.width*fit)/2,y+band-4,C.width*fit,C.height*fit);
  });
  pages.push(off.toDataURL('image/jpeg',0.86));
  render();
  if(asPDF){
    var imgs=pages.map(function(d){return{data:dataURLBytes(d),w:PW,h:PH};});
    saveBlob(buildPDF(imgs,792,612),(titleEl.value.trim()||'scout-cards').replace(/[^\w-]+/g,'_')+'.pdf');
  }else{
    pages.forEach(function(d,i){
      var a=document.createElement('a');a.href=d;a.download='scout-cards-'+(i+1)+'.jpg';a.click();
    });
  }
}
function filteredPlays(){
  var q=(playFilter||'').trim().toLowerCase();
  return getPlays().filter(function(p){
    if(!q)return true;
    if(p.name.toLowerCase().indexOf(q)>=0)return true;
    if(p.playbook.toLowerCase().indexOf(q)>=0)return true;
    return p.tags.some(function(t){return t.toLowerCase().indexOf(q)>=0;});
  });
}
function exportPlaybook(){
  var data={format:'coachs-play-designer',version:2,exported:Date.now(),plays:getPlays()};
  saveBlob(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}),'playbook.json');
}
function importPlaybook(file){
  var fr=new FileReader();
  fr.onload=function(){
    var d;try{d=JSON.parse(fr.result);}catch(e){alert('That file is not a playbook export.');return;}
    var incoming=Array.isArray(d)?d:(d&&d.plays);
    if(!Array.isArray(incoming)){alert('That file is not a playbook export.');return;}
    var mine=getPlays(),byId={},byName={};
    mine.forEach(function(p){if(p.id)byId[p.id]=1;byName[p.name]=1;});
    var added=0,renamed=0;
    incoming.forEach(function(p){
      p=normPlay(p);
      if(p.id&&byId[p.id])return;                      // already have it
      if(byName[p.name]){var n=2;while(byName[p.name+' ('+n+')'])n++;p.name=p.name+' ('+n+')';renamed++;}
      if(!p.id)p.id=newId();
      byId[p.id]=1;byName[p.name]=1;mine.push(p);added++;
    });
    if(mine.length>MAXPLAYS){alert('Import would exceed '+MAXPLAYS+' plays. Delete some first.');return;}
    setPlays(mine);renderRows();
    alert('Imported '+added+' play'+(added===1?'':'s')+(renamed?' ('+renamed+' renamed to avoid a clash)':'')+'.');
  };
  fr.readAsText(file);
}
function newId(){
  if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
  return 'p-'+Date.now().toString(36)+'-'+Math.floor(Math.random()*1e9).toString(36);
}
// tags the app can work out for itself, so a coach types only what is genuinely new
function autoTags(){
  var t=[personnel()+' pers'];
  var fs=document.getElementById('sel-form');
  if(fs&&fs.selectedIndex>0)t.push(fs.options[fs.selectedIndex].text);
  if(curRun)t.push(document.querySelector('#sel-run option[value="'+curRun+'"]').text);
  if(curPass)t.push(document.querySelector('#sel-pass option[value="'+curPass+'"]').text);
  if(curFront)t.push(document.querySelector('#sel-front option[value="'+curFront+'"]').text);
  if(curCov)t.push('vs '+document.querySelector('#sel-cov option[value="'+curCov+'"]').text);
  if(curPress)t.push(document.querySelector('#sel-press option[value="'+curPress+'"]').text);
  t.push(play==='run'?'run':'pass');
  return t;
}

function applyRunPlay(key){
  if(!key||!RUNPLAY[key])return;
  saveH();clearRun();clearPass();curPass='';
  play='run';document.getElementById('sel-play').value='run';
  RUNPLAY[key](runDir);

}

/* ---- Offense route tree (placeable + adjustable stem) ---- */
var ROUTES=['Hitch','Slant','Flat','Out','In (Dig)','Curl','Comeback','Corner','Post','Go (Fly)','Seam','Wheel','Drag','Screen'];
function defStem(c){var s={'Hitch':6,'Slant':3,'Flat':1,'Out':8,'In (Dig)':10,'Curl':10,'Comeback':13,'Corner':10,'Post':10,'Go (Fly)':14,'Seam':14,'Wheel':3,'Drag':2,'Screen':0}[c];return Math.round((s==null?8:s)*YD_V);}
function routePoints(p,c,stem){
  var x=p.x,y=p.y,outDir=x<W/2?-1:1,inDir=-outDir;
  var brk=Math.round(6*YD),dz=Math.round(7*YD),by=y-stem;
  switch(c){
    case 'Go (Fly)': case 'Seam': return [{x:x,y:y},{x:x,y:y-Math.max(stem,Math.round(16*YD_V))}];
    case 'Hitch': return [{x:x,y:y},{x:x,y:by},{x:x+inDir*Math.round(1.5*YD),y:by+Math.round(1.5*YD_V)}];
    case 'Slant': return [{x:x,y:y},{x:x,y:by},{x:x+inDir*dz,y:by-dz}];
    case 'Flat': return [{x:x,y:y},{x:x+outDir*Math.round(5*YD),y:by}];
    case 'Out': return [{x:x,y:y},{x:x,y:by},{x:x+outDir*brk,y:by}];
    case 'In (Dig)': return [{x:x,y:y},{x:x,y:by},{x:x+inDir*brk,y:by}];
    case 'Curl': return [{x:x,y:y},{x:x,y:by},{x:x+inDir*Math.round(2*YD),y:by+Math.round(2*YD_V)}];
    case 'Comeback': return [{x:x,y:y},{x:x,y:by},{x:x+outDir*Math.round(3*YD),y:by+Math.round(2.5*YD_V)}];
    case 'Corner': return [{x:x,y:y},{x:x,y:by},{x:x+outDir*dz,y:by-dz}];
    case 'Post': return [{x:x,y:y},{x:x,y:by},{x:x+inDir*dz,y:by-dz}];
    case 'Wheel': return [{x:x,y:y},{x:x+outDir*Math.round(5*YD),y:y-Math.round(1*YD_V)},{x:x+outDir*Math.round(6*YD),y:by-dz}];
    case 'Drag': return [{x:x,y:y},{x:x+inDir*Math.round(10*YD),y:y-Math.round(3*YD_V)}];
    case 'Screen': return [{x:x,y:y},{x:x+outDir*Math.round(3*YD),y:y+Math.round(2*YD_V)}];
    default: return [{x:x,y:y},{x:x,y:by}];
  }
}
function drawTree(r){
  var pl=playerById(r.pid);if(!pl)return;
  var pts=routePoints(pl,r.concept,r.stem);
  var a=pts[pts.length-2],b=pts[pts.length-1],ang=Math.atan2(b.y-a.y,b.x-a.x),cc=caseColor(r.col);
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle=cc;ctx.fillStyle=cc;ctx.lineWidth=6.4;
  ctx.beginPath();pts.forEach(function(p,i){i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);});ctx.stroke();arrowHead(b.x,b.y,ang,16);
  ctx.strokeStyle=r.col;ctx.fillStyle=r.col;ctx.lineWidth=3.3;
  ctx.beginPath();pts.forEach(function(p,i){i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);});ctx.stroke();arrowHead(b.x,b.y,ang,13);
  if(tool==='assign'&&play==='pass'){var hb=pts[1]||b;ctx.fillStyle='#fff';ctx.strokeStyle=r.col;ctx.lineWidth=2;ctx.beginPath();ctx.arc(hb.x,hb.y,5,0,Math.PI*2);ctx.fill();ctx.stroke();}
}
function hitStem(x,y){
  for(var i=routes.length-1;i>=0;i--){if(routes[i].type!=='tree')continue;var pl=playerById(routes[i].pid);if(!pl)continue;var pts=routePoints(pl,routes[i].concept,routes[i].stem);var b=pts[1]||pts[pts.length-1];if(Math.hypot(x-b.x,y-b.y)<14)return i;}return -1;
}
function addRoute(pi,concept){
  var p=players[pi];saveH();
  routes=routes.filter(function(r){return !(r.type==='tree'&&r.pid===p.id);});
  routes.push({type:'tree',pid:p.id,concept:concept,stem:defStem(concept),col:'#5af'});
  closeMenu();render();
}
function openRouteMenu(pi,pos){
  ctxMenu.innerHTML='';
  var t=document.createElement('div');t.className='ttl';t.textContent=players[pi].label+' · Route';ctxMenu.appendChild(t);
  ROUTES.forEach(function(rc){var b=document.createElement('button');b.textContent=rc;b.addEventListener('click',function(ev){ev.stopPropagation();addRoute(pi,rc);});ctxMenu.appendChild(b);});
  ctxMenu.style.left=Math.max(4,Math.min(lastClient.x,window.innerWidth-180))+'px';
  ctxMenu.style.top=Math.max(4,Math.min(lastClient.y,window.innerHeight-340))+'px';
  ctxMenu.classList.add('open');
}
