<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach's Play Designer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:#0f0f0f;color:#eee;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;gap:8px}
h1{font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#555}
#wrap{width:100%;max-width:820px;border:1px solid #222;border-radius:6px;overflow:hidden}
#tb{display:flex;flex-wrap:wrap;gap:5px;padding:7px 8px;background:#181818;align-items:center;border-bottom:1px solid #222}
#tb select,#tb button{font-size:11px;padding:4px 9px;border-radius:4px;border:1px solid #333;background:#222;color:#ccc;cursor:pointer}
#tb button:hover{background:#2a2a2a}
#tb button.act{background:#185FA5;color:#fff;border-color:#185FA5}
#tb .sep{width:1px;height:20px;background:#333;margin:0 2px;flex-shrink:0}
#tb label{font-size:11px;color:#555;white-space:nowrap}
canvas{display:block;width:100%;touch-action:none;cursor:crosshair}
#leg{display:flex;gap:10px;padding:5px 10px;font-size:10px;color:#444;background:#141414;flex-wrap:wrap;border-top:1px solid #1e1e1e}
.li{display:flex;align-items:center;gap:3px}
#notes-wrap{width:100%;max-width:820px;display:flex;flex-direction:column;gap:4px}
#notes-wrap label{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#555}
#notes{width:100%;min-height:72px;resize:vertical;background:#141414;color:#ccc;border:1px solid #222;border-radius:6px;padding:8px 10px;font-size:13px;font-family:inherit;line-height:1.45}
#notes:focus{outline:none;border-color:#185FA5}
#notes::placeholder{color:#444}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;align-items:center;justify-content:center;padding:12px}
#modal.open{display:flex}
#modal .box{background:#181818;border:1px solid #222;border-radius:6px;width:100%;max-width:360px;max-height:75vh;display:flex;flex-direction:column;overflow:hidden}
#modal .hd{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:#181818;border-bottom:1px solid #222;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#888}
#modal .hd button{font-size:11px;padding:4px 9px;border-radius:4px;border:1px solid #333;background:#222;color:#ccc;cursor:pointer}
#modal .hd button:hover{background:#2a2a2a}
#modal-list{overflow:auto}
#modal .pl{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid #1e1e1e;font-size:12px;color:#ccc}
#modal .pl:last-child{border-bottom:none}
#modal .pl .nm{flex:1;min-width:0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#modal .pl .nm:hover{color:#fff}
#modal .pl .nm .dt{font-size:10px;color:#555;margin-left:6px}
#modal .pl button{font-size:11px;padding:3px 8px;border-radius:4px;border:1px solid #633;background:#222;color:#c66;cursor:pointer;flex-shrink:0}
#modal .pl button:hover{background:#2a2a2a}
#modal .empty{padding:18px 12px;font-size:12px;color:#555;text-align:center}
#modal .tools{position:sticky;top:0;z-index:2;padding:8px 10px;background:#181818;border-bottom:1px solid #1e1e1e}
#modal .tools input{width:100%;background:#141414;color:#ccc;border:1px solid #2a2a2a;border-radius:4px;padding:6px 9px;font-size:12px;font-family:inherit}
#modal .tools input:focus{outline:none;border-color:#185FA5}
#modal .grp{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#6a6a6a;padding:9px 12px 4px}
#modal .pl .meta{flex:1;min-width:0;cursor:pointer;overflow:hidden}
#modal .pl .meta .nm2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#modal .pl .meta:hover .nm2{color:#fff}
#modal .pl .meta .dt2{font-size:10px;color:#555;margin-left:6px}
#modal .pl .chips{margin-top:3px;display:flex;flex-wrap:wrap;gap:3px}
#modal .chip{font-size:9px;background:#1f2c1f;color:#9bba8a;border:1px solid #2c3c2c;border-radius:3px;padding:1px 5px}
#modal .pl .edit{border-color:#3a3a3a;color:#bbb}
#modal .form{padding:12px;display:flex;flex-direction:column;gap:11px}
#modal .form label{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#777;display:flex;flex-direction:column;gap:5px}
#modal .form .hint{font-size:10px;color:#555;text-transform:none;letter-spacing:0;font-weight:400}
#modal .form input{background:#141414;color:#ddd;border:1px solid #2a2a2a;border-radius:4px;padding:8px 9px;font-size:13px;font-family:inherit}
#modal .form input:focus{outline:none;border-color:#185FA5}
#modal .form .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:2px}
#modal .form .actions button{font-size:12px;padding:7px 14px;border-radius:4px;border:1px solid #333;background:#222;color:#ccc;cursor:pointer}
#modal .form .actions button.primary{background:#185FA5;border-color:#185FA5;color:#fff}
#modal .form .actions button:hover{filter:brightness(1.2)}
#ctxmenu{display:none;position:fixed;z-index:200;background:#181818;border:1px solid #333;border-radius:6px;padding:4px;min-width:148px;max-height:260px;overflow:auto;box-shadow:0 6px 22px rgba(0,0,0,0.55)}
#ctxmenu.open{display:block}
#ctxmenu .ttl{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#777;padding:5px 8px 6px;border-bottom:1px solid #2a2a2a;margin-bottom:3px}
#ctxmenu button{display:block;width:100%;text-align:left;font-size:12px;padding:6px 9px;border:none;background:none;color:#ccc;cursor:pointer;border-radius:4px}
#ctxmenu button:hover{background:#244}
</style>
</head>
<body>
<h1>Coach's Play Designer</h1>
<div id="wrap">
  <div id="tb">
    <label>Formation:</label>
    <select id="sel-form">
      <option value="">-- select --</option>
      <optgroup label="Shotgun">
        <option value="gun_2x2">Gun 2x2</option>
        <option value="gun_2x2_te">Gun 2x2 TE on line</option>
        <option value="gun_2x2_yoff">Gun 2x2 Y-off / sniffer</option>
        <option value="gun_3x1">Gun 3x1</option>
        <option value="gun_3x1_te">Gun 3x1 TE on line</option>
        <option value="gun_3x1_yoff">Gun 3x1 Y-off / sniffer</option>
        <option value="gun_3x1_back">Gun Slot, Split Backs</option>
        <option value="gun_2x2_back">Gun Split Backs (2 WR, TE)</option>
        <option value="gun_empty">Gun Empty</option>
      </optgroup>
      <optgroup label="Ace / Singleback">
        <option value="ace_2x2">Ace 2x2</option>
        <option value="ace_2x2_te">Ace 2x2 TE on line</option>
        <option value="ace_trips">Ace Trips</option>
      </optgroup>
      <optgroup label="Under Center">
        <option value="i_form">I-Formation</option>
        <option value="i_form_trips">I-Form Twins</option>
        <option value="pro_form">Pro Formation</option>
        <option value="pistol_2x2">Pistol 2x2</option>
      </optgroup>
    </select>
    <button id="btn-flip" title="Flip formation strength to the other side">Flip</button>
    <div class="sep"></div>
    <label>Ball:</label>
    <select id="sel-hash">
      <option value="mof">MOF</option>
      <option value="lh">Left Hash</option>
      <option value="rh">Right Hash</option>
      <option value="lm">Left Mid</option>
      <option value="rm">Right Mid</option>
    </select>
    <div class="sep"></div>
    <label>Play:</label>
    <select id="sel-play">
      <option value="pass">Pass</option>
      <option value="run">Run</option>
    </select>
    <button id="btn-defview">Def View</button>
    <div class="sep"></div>
    <button id="t-assign" class="act">Assign</button>
    <button id="t-route">Draw</button>
    <button id="t-erase">Erase</button>
    <div class="sep"></div>
    <label>Front:</label>
    <select id="sel-front">
      <option value="">-- front --</option>
      <option value="over">Over</option>
      <option value="under">Under</option>
      <option value="tite">Tite</option>
      <option value="mint">Mint</option>
      <option value="bear">Bear (46)</option>
      <option value="g">G</option>
      <option value="okie">3-4 Okie</option>
    </select>
    <label>Cov:</label>
    <select id="sel-cov">
      <option value="">-- preset --</option>
      <option value="0">Cover 0</option>
      <option value="1">Cover 1</option>
      <option value="2">Tampa 2</option>
      <option value="3">Cover 3</option>
      <option value="4">Cover 4</option>
      <option value="palm">Cover 4 Palms</option>
      <option value="6">Cover 6</option>
      <option value="2man">2-Man</option>
      <option value="ripliz">Rip/Liz (match 3)</option>
    </select>
    <label>Pressure:</label>
    <select id="sel-press">
      <option value="">-- pressure --</option>
      <option value="double_a">Double A</option>
      <option value="lb_fire">LB Fire</option>
      <option value="nickel_fire">Nickel Fire</option>
      <option value="fire_zone">Fire Zone (5)</option>
      <option value="cover0">Cover 0 (All-Out)</option>
    </select>
    <label>Stunt:</label>
    <select id="sel-stunt">
      <option value="">-- line game --</option>
      <option value="tex_strong">TEX (strong)</option>
      <option value="tex_weak">TEX (weak)</option>
      <option value="et_strong">ET (strong)</option>
      <option value="et_weak">ET (weak)</option>
      <option value="twist">Twist (DTs cross)</option>
      <option value="pirate">Pirate (double TEX)</option>
      <option value="lightning">Lightning (double ET)</option>
    </select>
    <button id="btn-addzone">+ Zone</button>
    <div class="sep"></div>
    <button id="btn-undo">Undo</button>
    <button id="btn-clear" style="color:#c66;border-color:#633">Clear routes</button>
    <button id="btn-save">Save PNG</button>
    <div class="sep"></div>
    <button id="btn-saveplay">Save Play</button>
    <button id="btn-loadplay">Playbook</button>
  </div>
  <canvas id="c"></canvas>
  <div id="leg">
    <div class="li"><svg width="13" height="13"><rect x="1" y="1" width="11" height="11" fill="#185FA5" rx="1"/></svg> C locked</div>
    <div class="li"><svg width="13" height="13"><circle cx="6" cy="6" r="5" fill="#185FA5"/></svg> OL locked</div>
    <div class="li"><svg width="13" height="13"><circle cx="6" cy="6" r="5" fill="#378ADD"/></svg> Offense drag</div>
    <div class="li"><svg width="13" height="13"><circle cx="6" cy="6" r="5" fill="#1D9E75"/></svg> QB</div>
    <div class="li"><svg width="13" height="13"><circle cx="6" cy="6" r="5" fill="#A32D2D"/></svg> Defense drag</div>
    <div class="li" style="margin-left:auto;color:#333">drag players · draw routes · save PNG</div>
  </div>
</div>

<div id="notes-wrap">
  <label for="notes">Notes</label>
  <textarea id="notes" placeholder="Play notes, coaching points, reads…"></textarea>
</div>

<div id="modal"><div class="box">
  <div class="hd"><span id="modal-title">Playbook</span><button id="modal-close">Close</button></div>
  <div id="modal-list"></div>
</div></div>

<div id="ctxmenu"></div>

<script>
var C=document.getElementById('c'),ctx=C.getContext('2d');
var W,H,YD,YD_V,LOS,LH_X,RH_X,hashPos,SL_WR,SLOT_IN,QB_Y,RB_Y;
var OL_G=22,OL_T=22;
var ballX=0,play='pass',defView=false,curCov='',curForm='',flip=false,curFront='',curPress='';
var players=[],routes=[],hist=[],assigns=[],zones=[];
var uid=0;function nextId(){return ++uid;}
var tool='assign',drawing=false,curPts=[],dragIdx=-1,dragOff={x:0,y:0},arcStart=null,dragAssign=-1,dragMode='move',zoneDrag=null,stemDrag=-1,lastClient={x:0,y:0},lastTap=0;

function saveH(){hist.push({p:JSON.stringify(players),r:JSON.stringify(routes),a:JSON.stringify(assigns),z:JSON.stringify(zones)});if(hist.length>50)hist.shift();}

function setSize(){
  var pw=document.getElementById('wrap').clientWidth;
  C.width=pw; C.height=Math.round(pw*(540/820));
  W=C.width; H=C.height;
  YD=W/53.33;
  YD_V=H/35;
  LOS=Math.round(H*0.60);
  LH_X=Math.round(W*(53.33/160));
  RH_X=W-LH_X;
  hashPos={mof:W/2,lh:LH_X,rh:RH_X,lm:Math.round((LH_X+W/2)/2),rm:Math.round((RH_X+W/2)/2)};
  SL_WR=Math.round(3*YD);
  SLOT_IN=Math.round(6*YD);
  OL_G=Math.round(R()*2.6);OL_T=Math.round(R()*2.6);
  QB_Y=LOS+42; RB_Y=LOS+65;
  if(!ballX)ballX=W/2;
}

function drawField(){
  var yc=H*0.5; // 50-yard line at the vertical center of the view
  // alternating 5-yard turf bands (run across the field, perpendicular to the sidelines)
  for(var d=-120;d<120;d+=5){
    var ya=yc-d*YD_V, yb=yc-(d+5)*YD_V;
    var top=Math.min(ya,yb), bh=Math.abs(yb-ya);
    if(top>H||top+bh<0)continue;
    var idx=Math.round(d/5);
    ctx.fillStyle=(((idx%2)+2)%2===0)?'#2d4a1d':'#273f1a';
    ctx.fillRect(0,top,W,bh);
  }
  // yard lines every 5 yards
  ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=1;
  for(var d=-120;d<=120;d+=5){
    var py=yc-d*YD_V;
    if(py<0||py>H)continue;
    ctx.beginPath();ctx.moveTo(0,py);ctx.lineTo(W,py);ctx.stroke();
  }
  // yard numbers every 10 yards, near both sidelines (…40,50,40… counting from midfield)
  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.font='bold '+Math.max(10,Math.round(W/68))+'px sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(var d=-120;d<=120;d+=10){
    var py=yc-d*YD_V;
    if(py<16||py>H-16)continue;
    var dist=Math.abs(d)%100, n=dist<=50?50-dist:dist-50;
    if(n<=0)continue;
    fillTextU(''+n,24,py);
    fillTextU(''+n,W-24,py);
  }
  // line of scrimmage (ball spot)
  ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(0,LOS);ctx.lineTo(W,LOS);ctx.stroke();
  // hash marks
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1.5;ctx.setLineDash([3,5]);
  ctx.beginPath();ctx.moveTo(LH_X,0);ctx.lineTo(LH_X,H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(RH_X,0);ctx.lineTo(RH_X,H);ctx.stroke();
  ctx.setLineDash([]);
  // sidelines
  ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(2,0);ctx.lineTo(2,H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W-2,0);ctx.lineTo(W-2,H);ctx.stroke();
}
function drawBall(){
  var rx=Math.max(7,Math.round(W/95)),ry=Math.max(4,Math.round(W/150));
  ctx.save();
  ctx.translate(ballX,LOS);
  ctx.fillStyle='#7a4a24';ctx.strokeStyle='#321f0e';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.strokeStyle='#fff';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(-rx*0.45,0);ctx.lineTo(rx*0.45,0);ctx.stroke();
  for(var i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*rx*0.18,-ry*0.45);ctx.lineTo(i*rx*0.18,ry*0.45);ctx.stroke();}
  ctx.restore();
}

function R(){return Math.max(8,Math.round(W/70));}
function fillTextU(s,x,y){if(defView){ctx.save();ctx.translate(x,y);ctx.scale(1,-1);ctx.fillText(s,0,0);ctx.restore();}else ctx.fillText(s,x,y);}

function nearestDist(pl){if(pl.locked)return 1e9;var m=1e9;players.forEach(function(o){if(o!==pl&&!o.locked&&o.color===pl.color){var d=Math.hypot(o.x-pl.x,o.y-pl.y);if(d<m)m=d;}});return m;}
function drawPlayer(pl){
  var R0=R(),r=R0,nd=nearestDist(pl);
  if(nd<2*R0+2)r=Math.max(Math.round(R0*0.62),Math.floor(nd/2-1));
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.45)';ctx.shadowBlur=Math.max(2,Math.round(R0*0.22));ctx.shadowOffsetY=(defView?-1:1)*Math.max(1,Math.round(R0*0.14));
  ctx.fillStyle=pl.color;
  if(pl.shape==='sq'){ctx.fillRect(pl.x-r,pl.y-r,r*2,r*2);}
  else{ctx.beginPath();ctx.arc(pl.x,pl.y,r,0,Math.PI*2);ctx.fill();}
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  ctx.strokeStyle=pl.locked?'rgba(255,255,255,0.35)':'rgba(255,255,255,0.9)';ctx.lineWidth=pl.locked?1:1.5;
  if(pl.shape==='sq'){ctx.strokeRect(pl.x-r,pl.y-r,r*2,r*2);}
  else{ctx.beginPath();ctx.arc(pl.x,pl.y,r,0,Math.PI*2);ctx.stroke();}
  ctx.fillStyle='#fff';
  var fsz=Math.max(7,Math.round(r*0.92));ctx.font='bold '+fsz+'px sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  var maxW=r*1.7,tw=ctx.measureText(pl.label).width;
  if(tw>maxW){fsz=Math.max(6,Math.floor(fsz*maxW/tw));ctx.font='bold '+fsz+'px sans-serif';}
  fillTextU(pl.label,pl.x,pl.y);
  if(pl.dl){
    ctx.fillStyle='rgba(255,215,80,0.85)';
    ctx.font=Math.max(7,Math.round(R0*0.62))+'px sans-serif';
    ctx.textBaseline='middle';
    var off=r+Math.round(R0*0.62);
    fillTextU(pl.dl,pl.x,defView?(pl.y-off):(pl.y+off));
  }
  ctx.restore();
}

function drawArrow(x1,y1,x2,y2,col){
  var dx=x2-x1,dy=y2-y1,ang=Math.atan2(dy,dx);
  ctx.save();ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=2.5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-12*Math.cos(ang-0.4),y2-12*Math.sin(ang-0.4));
  ctx.lineTo(x2-12*Math.cos(ang+0.4),y2-12*Math.sin(ang+0.4));
  ctx.closePath();ctx.fill();ctx.restore();
}
function drawArc(x1,y1,x2,y2,col){
  var mx=(x1+x2)/2,my=Math.min(y1,y2)-30;
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(mx,my,x2,y2);ctx.stroke();ctx.restore();
}

function render(){
  ctx.save();if(defView){ctx.translate(0,H);ctx.scale(1,-1);}
  drawField();
  zones.forEach(drawZone);
  routes.forEach(function(r){
    ctx.save();ctx.strokeStyle=r.col;ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';
    if(r.type==='route'){ctx.setLineDash([6,3]);ctx.beginPath();r.pts.forEach(function(p,i){i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);});ctx.stroke();ctx.setLineDash([]);}
    else if(r.type==='tree'){if(play!=='run')drawTree(r);}
    else if(r.type==='arrow'){drawArrow(r.x1,r.y1,r.x2,r.y2,r.col);}
    else{drawArc(r.x1,r.y1,r.x2,r.y2,r.col);}
    ctx.restore();
  });
  if(drawing&&tool==='route'&&curPts.length>1){
    ctx.save();ctx.strokeStyle='#5af';ctx.lineWidth=2;ctx.setLineDash([5,3]);ctx.lineCap='round';
    ctx.beginPath();curPts.forEach(function(p,i){i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);});
    ctx.stroke();ctx.setLineDash([]);ctx.restore();
  }
  assigns.forEach(function(a){if(play==='run'&&a.phase==='pass')return;if(play==='pass'&&a.phase==='run')return;drawAssign(a);});
  players.forEach(drawPlayer);
  drawBall();
  ctx.restore();
}

function mk(x,y,lb,sh,col,lk,dl){return{id:nextId(),x:x,y:y,label:lb,shape:sh||'circle',color:col,locked:!!lk,dl:dl||null};}

function OL(){
  return[
    mk(ballX,LOS,'C','sq','#185FA5',true),
    mk(ballX-OL_G,LOS,'LG','circle','#185FA5',true),
    mk(ballX+OL_G,LOS,'RG','circle','#185FA5',true),
    mk(ballX-OL_G-OL_T,LOS,'LT','circle','#185FA5',true),
    mk(ballX+OL_G+OL_T,LOS,'RT','circle','#185FA5',true),
  ];
}

var O='#378ADD',Q='#1D9E75',D='#A32D2D';
var SLOT=function(){return Math.round(6*YD);};

var F={
  gun_2x2:function(){return OL().concat([
    mk(SL_WR,LOS,'X','circle',O),mk(W-SL_WR,LOS,'Z','circle',O),
    mk(ballX-OL_G-OL_T-SLOT(),LOS+8,'H','circle',O),
    mk(ballX+OL_G+OL_T+SLOT(),LOS+8,'Y','circle',O),
    mk(ballX,QB_Y,'QB','circle',Q),mk(ballX-18,RB_Y,'RB','circle',O),
  ]);},
  gun_2x2_te:function(){return OL().concat([
    mk(SL_WR,LOS,'X','circle',O),mk(W-SL_WR,LOS,'Z','circle',O),

function autoDef(key){
  var trips=(key.indexOf('3x1')>=0||key.indexOf('trips')>=0||key.indexOf('empty')>=0);
  var DLY=LOS-Math.round(1.2*YD_V);
  var MIKEY=LOS-Math.round(4.5*YD_V);
  var WILLY=LOS-Math.round(5*YD_V);
  var NICKY=LOS-Math.round(4.5*YD_V);
  var CBY=LOS-Math.round(1.2*YD_V);
  var SY=LOS-Math.round(12*YD_V);
  var nickX=trips?W-SL_WR-Math.round(2*YD):ballX+Math.round(4*YD);
  var willX=ballX-Math.round(3.5*YD);
  var mikeX=ballX+Math.round(1.5*YD);
  return[
    mk(ballX-Math.round(2*YD),DLY,'3T','circle',D),
    mk(ballX+Math.round(2*YD),DLY,'1T','circle',D),
    mk(ballX-Math.round(4.5*YD),DLY,'DE','circle',D),
    mk(ballX+Math.round(4.5*YD),DLY,'DE','circle',D),
    mk(willX,WILLY,'WILL','circle',D,false,'5 yds'),
    mk(mikeX,MIKEY,'MIKE','circle',D,false,'4-5 yds'),
    mk(nickX,NICKY,'NICK','circle',D),
    mk(SL_WR+Math.round(YD),CBY,'CB','circle',D),
    mk(W-SL_WR-Math.round(YD),CBY,'CB','circle',D),
    mk(ballX-Math.round(3*YD),SY,'FS','circle',D),
    mk(ballX+Math.round(3*YD),SY,'SS','circle',D),
  ];
}

function remapManTargets(){
  assigns.forEach(function(a){
    if(a.targetPid!=null&&a.role&&a.role.indexOf('Man ')===0){
      var lbl=a.role.slice(4),np=null;
      for(var i=0;i<players.length;i++){if(players[i].color===O&&players[i].label===lbl){np=players[i];break;}}
      if(np)a.targetPid=np.id;
    }
  });
}
function applyWRSplits(){
  // HS numbers sit ~6 yds from each sideline (W-relative), so X/Z hold their split on any
  // hash. Strength side follows the manual Flip toggle, not the hash — the offense declares
  // strength; the defense reacts to field/boundary in alignDBsToWRs()/applyCoverage().
  var nubL=Math.round(W*0.115),nubR=W-Math.round(W*0.115);
  var xNub=flip?nubR:nubL,zNub=flip?nubL:nubR;
  var rtX=ballX+OL_G+OL_T,ltX=ballX-OL_G-OL_T;
  var byLbl={};
  players.forEach(function(p){if(p.color===O)byLbl[p.label]=p;});
  var X=byLbl.X,Z=byLbl.Z,Y=byLbl.Y,Hp=byLbl.H,A=byLbl.A;
  if(X)X.x=xNub;
  if(Z)Z.x=zNub;
  var rThresh=rtX+Math.round(3*YD),lThresh=ltX-Math.round(3*YD);
  // A detached off-the-ball slot re-spaces once it clears the tackle by ~2 yds. This catches
  // the #3 trips receiver, which on a hash lands between the box thresholds and would
  // otherwise strand on the OL instead of spacing 4 yds inside the rest of the trips.
  var slotR=rtX+Math.round(2*YD),slotL=ltX-Math.round(2*YD);
  var rInners=[],lInners=[];
  [Y,Hp,A].forEach(function(p){
    if(!p||Math.abs(p.y-LOS)>R()*2.5)return;
    var slot=(p.y-LOS)>4;
    if(p.x>rThresh||(slot&&p.x>slotR))rInners.push(p);
    else if(p.x<lThresh||(slot&&p.x<slotL))lInners.push(p);
  });
  rInners.sort(function(a,b){return b.x-a.x;});
  lInners.sort(function(a,b){return a.x-b.x;});
  var rightAnchor=(Z&&Z.x>W/2)?Z.x:(X&&X.x>W/2)?X.x:nubR;
  var leftAnchor=(X&&X.x<W/2)?X.x:(Z&&Z.x<W/2)?Z.x:nubL;
  rInners.forEach(function(p,i){p.x=Math.round(rightAnchor-(i+1)*4*YD);});
  lInners.forEach(function(p,i){p.x=Math.round(leftAnchor+(i+1)*4*YD);});
}
// Flip formation strength: mirror the skill players (not the OL/QB) about the ball.
function mirrorSkill(){
  players.forEach(function(p){
    if(p.color!==O)return;
    if(p.label==='C'||p.label==='LG'||p.label==='RG'||p.label==='LT'||p.label==='RT')return;
    p.x=2*ballX-p.x;
  });
}
// After WRs settle, re-fit the secondary to where they actually landed: CBs over the
// outside WRs, nickel to the field-side slot, safeties spaced by receiver distribution.
function alignDBsToWRs(){
  var byLbl={};
  players.forEach(function(p){if(p.color===O)byLbl[p.label]=p;});
  var X=byLbl.X,Z=byLbl.Z;
  var cbs=players.filter(function(p){return p.color===D&&p.label==='CB';});
  cbs.sort(function(a,b){return a.x-b.x;});
  // Left CB mirrors leftmost WR, right CB mirrors rightmost WR
  var leftWR=(X&&X.x<W/2)?X:(Z&&Z.x<W/2)?Z:null;
  var rightWR=(Z&&Z.x>W/2)?Z:(X&&X.x>W/2)?X:null;
  var covDepth=Math.round(7*YD_V);
  if(cbs[0]&&leftWR){cbs[0].x=leftWR.x;cbs[0].y=LOS-covDepth;}
  if(cbs[1]&&rightWR){cbs[1].x=rightWR.x;cbs[1].y=LOS-covDepth;}
  var isMOF=Math.abs(ballX-W/2)<W*0.08;
  var onRightHash=ballX>W/2+W*0.08;
  var fieldLeft=onRightHash;
  // Nickel aligns to the field-side slot receiver
  var nick=players.filter(function(p){return p.color===D&&p.label==='NICK';})[0];
  if(nick){
    var slots=players.filter(function(p){
      return p.color===O&&p.label!=='QB'&&p.label!=='RB'&&p.label!=='FB'&&p.label!=='C'&&p.label!=='LG'&&p.label!=='RG'&&p.label!=='LT'&&p.label!=='RT'&&p.label!=='X'&&p.label!=='Z';
    });
    var fieldSlots=slots.filter(function(p){
      return isMOF?true:(fieldLeft?p.x<W/2:p.x>W/2);
    });
    if(fieldSlots.length){
      fieldSlots.sort(function(a,b){return Math.abs(a.x-ballX)-Math.abs(b.x-ballX);});
      var target=fieldSlots[0];
      nick.x=Math.round(target.x);
      nick.y=LOS-Math.round(4.5*YD_V);
    }
  }
  // Safeties: spaced by receiver distribution per side; field wider, boundary tighter
  var fs=players.filter(function(p){return p.color===D&&p.label==='FS';})[0];
  var ss=players.filter(function(p){return p.color===D&&p.label==='SS';})[0];
  var safetyDepth=LOS-Math.round(12*YD_V);
  var offPlayers=players.filter(function(p){
    return p.color===O&&p.label!=='QB'&&p.label!=='RB'&&p.label!=='FB'&&p.label!=='C'&&p.label!=='LG'&&p.label!=='RG'&&p.label!=='LT'&&p.label!=='RT';
  });
  var leftRecs=offPlayers.filter(function(p){return p.x<ballX;});
  var rightRecs=offPlayers.filter(function(p){return p.x>ballX;});
  var tripsLeft=leftRecs.length>=3;
  var tripsRight=rightRecs.length>=3;
  var widestLeft=leftRecs.length?leftRecs.reduce(function(a,b){return a.x<b.x?a:b;}):null;
  var widestRight=rightRecs.length?rightRecs.reduce(function(a,b){return a.x>b.x?a:b;}):null;
  var insideShade=Math.round(3*YD);
  var leftSafetyX=widestLeft?Math.round(widestLeft.x+insideShade):Math.round(ballX-W*0.18);
  var rightSafetyX=widestRight?Math.round(widestRight.x-insideShade):Math.round(ballX+W*0.18);
  if(!isMOF){
    if(fieldLeft){
      if(tripsLeft)leftSafetyX=Math.round(widestLeft.x+insideShade*0.5);
      if(tripsRight)rightSafetyX=Math.round(widestRight.x-insideShade*0.5);
      if(fs){fs.x=leftSafetyX;fs.y=safetyDepth;}
      if(ss){ss.x=rightSafetyX;ss.y=safetyDepth;}
    }else{
      if(tripsRight)rightSafetyX=Math.round(widestRight.x-insideShade*0.5);
      if(tripsLeft)leftSafetyX=Math.round(widestLeft.x+insideShade*0.5);
      if(fs){fs.x=rightSafetyX;fs.y=safetyDepth;}
      if(ss){ss.x=leftSafetyX;ss.y=safetyDepth;}
    }
  }else{
    if(tripsLeft)leftSafetyX=Math.round(widestLeft.x+insideShade*0.5);
    if(tripsRight)rightSafetyX=Math.round(widestRight.x-insideShade*0.5);
    if(fs){fs.x=leftSafetyX;fs.y=safetyDepth;}
    if(ss){ss.x=rightSafetyX;ss.y=safetyDepth;}
  }
}
function loadForm(key){
  if(!key||!F[key])return;
  curForm=key;
  saveH();
  var def=players.filter(function(p){return p.color===D;});
  if(!def.length)def=autoDef(key);
  players=F[key]().concat(def);
  if(flip)mirrorSkill();
  applyWRSplits();
  routes=[];
  ensureIds();remapManTargets();
  alignDBsToWRs();
  refitDefense();
  render();
}

document.getElementById('btn-flip').addEventListener('click',function(){
  if(!curForm||!F[curForm])return;
  saveH();
  flip=!flip;
  this.classList.toggle('act',flip);
  var def=players.filter(function(p){return p.color===D;});
  players=F[curForm]().concat(def);
  if(flip)mirrorSkill();

  alignDBsToWRs();
  refitDefense();
  render();
});

document.getElementById('sel-hash').addEventListener('change',function(){
  var nx=hashPos[this.value]||W/2;
  if(nx===ballX)return;
  saveH();
  var dx=nx-ballX,lo=R(),hi=W-R();
  var def=players.filter(function(p){return p.color===D;});
  def.forEach(function(p){p.x=Math.max(lo,Math.min(hi,p.x+dx));});
  zones.forEach(function(z){z.x=Math.max(lo,Math.min(hi,z.x+dx));});
  ballX=nx;
  if(curForm&&F[curForm]){players=F[curForm]().concat(def);if(flip)mirrorSkill();applyWRSplits();ensureIds();remapManTargets();}
  alignDBsToWRs();
  refitDefense();
  render();
});

function gp(e){
  var r=C.getBoundingClientRect(),s=e.touches?e.touches[0]:e;
  var x=(s.clientX-r.left)*(C.width/r.width),y=(s.clientY-r.top)*(C.height/r.height);
  return{x:x,y:defView?H-y:y};
}
function hitP(x,y){
  var r=R()+2;
  for(var i=players.length-1;i>=0;i--){
    if(players[i].locked)continue;
    if(Math.hypot(x-players[i].x,y-players[i].y)<r)return i;
  }return -1;
}
function hitR(x,y){
  for(var i=routes.length-1;i>=0;i--){
    var r=routes[i];
    if(r.type==='route'||r.type==='tree'){
      var pts=r.pts;
      if(r.type==='tree'){var pl=playerById(r.pid);if(!pl)continue;pts=routePoints(pl,r.concept,r.stem);}
      for(var j=0;j<pts.length-1;j++){
        var dx=pts[j+1].x-pts[j].x,dy=pts[j+1].y-pts[j].y,len=Math.sqrt(dx*dx+dy*dy);
        if(len<1)continue;
        var t=Math.max(0,Math.min(1,((x-pts[j].x)*dx+(y-pts[j].y)*dy)/(len*len)));
        if(Math.hypot(x-pts[j].x-t*dx,y-pts[j].y-t*dy)<10)return i;
      }
    } else if(Math.hypot(x-r.x1,y-r.y1)<14||Math.hypot(x-r.x2,y-r.y2)<14)return i;
  }return -1;
}
function onDown(pos){
  if(tool==='erase'){
    saveH();
    var pe=hitP(pos.x,pos.y);if(pe>=0){var rid=players[pe].id;players.splice(pe,1);assigns=assigns.filter(function(a){return a.pid!==rid;});render();return;}
    var ae=hitAssign(pos.x,pos.y);if(ae>=0){assigns.splice(ae,1);render();return;}
    var ze=hitZone(pos.x,pos.y);if(ze>=0){zones.splice(ze,1);render();return;}
    var re=hitR(pos.x,pos.y);if(re>=0){routes.splice(re,1);render();return;}
    return;
  }
  var pi=hitP(pos.x,pos.y);
  if(pi>=0){dragIdx=pi;dragOff={x:pos.x-players[pi].x,y:pos.y-players[pi].y};return;}
  if(tool==='assign'){
    var hs=hitStem(pos.x,pos.y);if(hs>=0){stemDrag=hs;return;}
    var g=hitAssignGrab(pos.x,pos.y);if(g){dragAssign=g.i;dragMode=g.mode;return;}
    var zh=hitZone(pos.x,pos.y);if(zh>=0){zoneDrag={i:zh,mode:zoneVal(zones[zh],pos.x,pos.y)>0.6?'resize':'move',ox:pos.x-zones[zh].x,oy:pos.y-zones[zh].y};return;}
    return;
  }
  drawing=true;
  if(tool==='route')curPts=[pos];
  else if(tool==='block')arcStart=pos;
}
function onMove(pos){
  if(dragIdx>=0){players[dragIdx].x=pos.x-dragOff.x;players[dragIdx].y=pos.y-dragOff.y;render();return;}
  if(dragAssign>=0){var da=assigns[dragAssign];if(da.shape==='circle'&&dragMode==='resize'){da.rx=Math.max(16,Math.abs(pos.x-da.tx));da.ry=Math.max(12,Math.abs(pos.y-da.ty));}else{da.tx=pos.x;da.ty=pos.y;}render();return;}
  if(stemDrag>=0){var rt=routes[stemDrag],rpl=playerById(rt.pid);if(rpl)rt.stem=Math.max(Math.round(2*YD_V),rpl.y-pos.y);render();return;}
  if(zoneDrag){var z=zones[zoneDrag.i];if(zoneDrag.mode==='move'){z.x=pos.x-zoneDrag.ox;z.y=pos.y-zoneDrag.oy;}else{z.rx=Math.max(16,Math.abs(pos.x-z.x));z.ry=Math.max(12,Math.abs(pos.y-z.y));}render();return;}
  if(!drawing)return;
  if(tool==='route'){curPts.push(pos);render();}
  else if(arcStart){
    render();
    ctx.save();if(defView){ctx.translate(0,H);ctx.scale(1,-1);}
    drawArc(arcStart.x,arcStart.y,pos.x,pos.y,'#5af');
    ctx.restore();
  }
}
function onUp(pos){
  if(dragIdx>=0){saveH();dragIdx=-1;render();return;}
  if(dragAssign>=0){saveH();dragAssign=-1;render();return;}
  if(stemDrag>=0){saveH();stemDrag=-1;render();return;}
  if(zoneDrag){saveH();zoneDrag=null;render();return;}
  if(!drawing)return;drawing=false;
  if(tool==='route'&&curPts.length>1){saveH();routes.push({type:'route',pts:curPts.slice(),col:'#5af'});curPts=[];}
  else if(arcStart){saveH();routes.push({type:tool,x1:arcStart.x,y1:arcStart.y,x2:pos.x,y2:pos.y,col:'#5af'});arcStart=null;}
  render();
}

C.addEventListener('mousedown',function(e){lastClient={x:e.clientX,y:e.clientY};onDown(gp(e));});

/* ---- Save / Load plays (localStorage) ---- */
var PKEY='cpd_plays',MAXPLAYS=50,playFilter='';
function normPlay(p){if(!p.playbook||typeof p.playbook!=='string')p.playbook='Unfiled';if(!Array.isArray(p.tags))p.tags=[];return p;}
function getPlays(){try{var v=JSON.parse(localStorage.getItem(PKEY));return Array.isArray(v)?v.map(normPlay):[];}catch(e){return [];}}
function setPlays(a){try{localStorage.setItem(PKEY,JSON.stringify(a));return true;}catch(e){alert('Could not save — browser storage is full or unavailable.');return false;}}
function getPlaybooks(){var s={'Unfiled':1};getPlays().forEach(function(p){s[p.playbook]=1;});return Object.keys(s).sort();}
function parseTags(str){var seen={},out=[];(str||'').split(',').forEach(function(t){t=t.trim();var k=t.toLowerCase();if(t&&!seen[k]){seen[k]=1;out.push(t);}});return out;}

function openSave(){document.getElementById('modal').classList.add('open');showForm('new',null);}
function showForm(mode,play){
  document.getElementById('modal-title').textContent=mode==='edit'?'Edit Play':'Save Play';
  var box=document.getElementById('modal-list');box.innerHTML='';
  var form=document.createElement('div');form.className='form';
  var dl=document.createElement('datalist');dl.id='pb-list';
  getPlaybooks().forEach(function(b){var o=document.createElement('option');o.value=b;dl.appendChild(o);});
  function field(labelText,hint){
    var l=document.createElement('label');l.appendChild(document.createTextNode(labelText));
    if(hint){var h=document.createElement('span');h.className='hint';h.textContent=hint;l.appendChild(h);}
    var inp=document.createElement('input');l.appendChild(inp);form.appendChild(l);return inp;
  }
  var nameI=field('Play name','');nameI.value=play?play.name:'';
  var pbI=field('Playbook','folder to group under');pbI.setAttribute('list','pb-list');pbI.value=play?play.playbook:'Unfiled';
  var tagI=field('Tags','comma-separated — e.g. red zone, vs cover 3');tagI.value=play?play.tags.join(', '):'';
  form.appendChild(dl);
  if(mode==='edit'){var note=document.createElement('div');note.className='hint';note.textContent='Editing labels only — the saved diagram is unchanged.';form.appendChild(note);}
  var act=document.createElement('div');act.className='actions';
  var cancel=document.createElement('button');cancel.textContent='Cancel';cancel.addEventListener('click',openModal);
  var ok=document.createElement('button');ok.className='primary';ok.textContent=mode==='edit'?'Update':'Save';
  ok.addEventListener('click',function(){submitForm(mode,play,nameI.value,pbI.value,tagI.value);});
  act.appendChild(cancel);act.appendChild(ok);form.appendChild(act);
  box.appendChild(form);nameI.focus();
  nameI.addEventListener('keydown',function(e){if(e.key==='Enter')ok.click();});
}
function submitForm(mode,orig,name,pb,tagsStr){
  name=(name||'').trim();
  if(!name){alert('Please enter a name for the play.');return;}
  pb=(pb||'').trim()||'Unfiled';
  var tags=parseTags(tagsStr),plays=getPlays();
  var idx=-1;for(var i=0;i<plays.length;i++){if(plays[i].name===name){idx=i;break;}}
  if(mode==='edit'){
    var oi=-1;for(var j=0;j<plays.length;j++){if(plays[j].name===orig.name){oi=j;break;}}
    if(oi<0){openModal();return;}
    if(idx>=0&&idx!==oi){if(!confirm('A play named "'+name+'" already exists. Overwrite it?'))return;plays.splice(idx,1);if(idx<oi)oi--;}
    plays[oi].name=name;plays[oi].playbook=pb;plays[oi].tags=tags;
    setPlays(plays);openModal();return;
  }
  if(idx<0&&plays.length>=MAXPLAYS){alert('Maximum of '+MAXPLAYS+' saved plays reached. Delete one first.');return;}
  if(idx>=0&&!confirm('A play named "'+name+'" already exists. Overwrite it?'))return;
  var rec={name:name,ts:Date.now(),ballX:ballX,players:players,routes:routes,notes:notesEl.value,assigns:assigns,zones:zones,defView:defView,flip:flip,front:curFront,press:curPress,playbook:pb,tags:tags};
  if(idx>=0)plays[idx]=rec;else plays.push(rec);
  setPlays(plays);openModal();
}

function loadPlay(p){
  saveH();
  if(typeof p.ballX==='number')ballX=p.ballX;
  players=JSON.parse(JSON.stringify(p.players||[]));
  routes=JSON.parse(JSON.stringify(p.routes||[]));
  assigns=JSON.parse(JSON.stringify(p.assigns||[]));
  zones=JSON.parse(JSON.stringify(p.zones||[]));
  ensureIds();normalizeAssigns();
  defView=!!p.defView;document.getElementById('btn-defview').classList.toggle('act',defView);
  flip=!!p.flip;var fb=document.getElementById('btn-flip');if(fb)fb.classList.toggle('act',flip);
  curFront=p.front||'';curPress=p.press||'';
  notesEl.value=p.notes||'';
  try{localStorage.setItem(NKEY,notesEl.value);}catch(e){}
  render();
  closeModal();
}

function deletePlay(name){
  if(!confirm('Delete "'+name+'"?'))return;
  setPlays(getPlays().filter(function(p){return p.name!==name;}));
  renderRows();
}

function fmtDate(ts){try{return new Date(ts).toLocaleDateString();}catch(e){return '';}}

function renderList(){
  document.getElementById('modal-title').textContent='Playbook';
  var box=document.getElementById('modal-list');box.innerHTML='';
  var tools=document.createElement('div');tools.className='tools';
  var search=document.createElement('input');search.type='text';search.placeholder='Search name, playbook, or tag…';search.value=playFilter;
  search.addEventListener('input',function(){playFilter=this.value;renderRows();});
  tools.appendChild(search);box.appendChild(tools);
  var rows=document.createElement('div');rows.id='pb-rows';box.appendChild(rows);
  renderRows();
}
function renderRows(){
  var wrap=document.getElementById('pb-rows');if(!wrap)return;wrap.innerHTML='';
  var q=playFilter.trim().toLowerCase();
  var plays=getPlays().filter(function(p){
    if(!q)return true;
    if(p.name.toLowerCase().indexOf(q)>=0)return true;
    if(p.playbook.toLowerCase().indexOf(q)>=0)return true;
    return p.tags.some(function(t){return t.toLowerCase().indexOf(q)>=0;});
  });
  if(!plays.length){var e=document.createElement('div');e.className='empty';e.textContent=q?'No plays match “'+playFilter.trim()+'”.':'No saved plays yet.';wrap.appendChild(e);return;}
  var groups={};plays.forEach(function(p){(groups[p.playbook]=groups[p.playbook]||[]).push(p);});
  Object.keys(groups).sort().forEach(function(pb){
    var h=document.createElement('div');h.className='grp';h.textContent=pb+' ('+groups[pb].length+')';wrap.appendChild(h);
    groups[pb].sort(function(a,b){return b.ts-a.ts;}).forEach(function(p){wrap.appendChild(rowFor(p));});
  });
}
function rowFor(p){
  var row=document.createElement('div');row.className='pl';
  var meta=document.createElement('div');meta.className='meta';meta.title='Load this play';
  var nm=document.createElement('div');nm.className='nm2';nm.appendChild(document.createTextNode(p.name));
  var dt=document.createElement('span');dt.className='dt2';dt.textContent=fmtDate(p.ts);nm.appendChild(dt);
  meta.appendChild(nm);
  if(p.tags.length){var chips=document.createElement('div');chips.className='chips';p.tags.forEach(function(t){var c=document.createElement('span');c.className='chip';c.textContent=t;chips.appendChild(c);});meta.appendChild(chips);}
  meta.addEventListener('click',function(){loadPlay(p);});
  var edit=document.createElement('button');edit.className='edit';edit.textContent='Edit';edit.addEventListener('click',function(){showForm('edit',p);});
  var del=document.createElement('button');del.textContent='Delete';del.addEventListener('click',function(){deletePlay(p.name);});
  row.appendChild(meta);row.appendChild(edit);row.appendChild(del);
  return row;
}

function exportPNG(){
  var notes=notesEl.value.replace(/\s+$/,'');
  var pad=16;
  var bodySize=Math.max(12,Math.round(C.width/58));
  var hdrSize=Math.max(10,Math.round(C.width/75));
  var lineH=Math.round(bodySize*1.45);
  var off=document.createElement('canvas'),octx=off.getContext('2d');
  var maxW=C.width-pad*2,lines=[];
  if(notes){
    octx.font=bodySize+'px sans-serif';
    notes.split('\n').forEach(function(para){
      if(!para){lines.push('');return;}
      var words=para.split(' '),cur='';
      words.forEach(function(w){
        var test=cur?cur+' '+w:w;
        if(octx.measureText(test).width>maxW&&cur){lines.push(cur);cur=w;}else cur=test;
      });
      lines.push(cur);
    });
  }
  var notesH=notes?(pad+lineH+lines.length*lineH+pad):0;
  off.width=C.width;off.height=C.height+notesH;
  octx.fillStyle='#0f0f0f';octx.fillRect(0,0,off.width,off.height);
  octx.drawImage(C,0,0);
  if(notes){
    var y=C.height+pad;
    octx.textAlign='left';octx.textBaseline='top';
    octx.fillStyle='#888';octx.font='bold '+hdrSize+'px sans-serif';
    octx.fillText('NOTES',pad,y);y+=lineH;
    octx.fillStyle='#eee';octx.font=bodySize+'px sans-serif';
    lines.forEach(function(ln){octx.fillText(ln,pad,y);y+=lineH;});
  }
  var a=document.createElement('a');a.download='play.png';a.href=off.toDataURL();a.click();
}

/* ---- Run fit / Pass rush / Coverage ---- */
var RFCOL='#e23b3b',PRCOL='#101010',CVCOL='#f5f5f5';
function kindCol(k){return (k==='run'||k==='runfit')?RFCOL:(k==='rush'||k==='passrush')?PRCOL:CVCOL;}
function clearForPhase(pid,phase){assigns=assigns.filter(function(a){if(a.pid!==pid)return true;if(phase==='both')return false;if(phase==='run')return !(a.phase==='run'||a.phase==='both');return !(a.phase==='pass'||a.phase==='both');});}
function isDL(p){return p.label==='3T'||p.label==='1T'||p.label==='DE'||p.label==='NT';}
function isDeepRole(r){return /^Deep/.test(r||'');}
function isDeepDefender(p){return !!p&&(p.label==='CB'||p.label==='FS'||p.label==='SS');}
function normalizeAssigns(){assigns.forEach(function(a){if(a.kind==='runfit')a.kind='run';else if(a.kind==='passrush')a.kind='rush';else if(a.kind==='coverage')a.kind='cover';if(!a.phase)a.phase=(a.kind==='run')?'run':'pass';});}
var RUNMENU=['A gap','B gap','C gap','D gap','Force','Contain','Spill','Fill','Cutback','Box/Alley','A-gap blitz','B-gap blitz','C-gap blitz','Edge blitz','Custom…'];
var RUSHMENU=['Contain','A rush','B rush','C rush','Slant ←','Slant →','Loop ←','Loop →','TEX — DE in / DT contain','ET — DT in / DE contain','Twist — DTs cross','Custom…'];
var COVERMENU=['Deep ⅓','Deep ½','Deep ¼','Deep Mid','Deep MOF','Flat','Quarter Flat','Curl/Flat','Hook/Curl','Hook','Seam/Wall','Wall 2','Match 3','Man','Spy','Robber','Hole','A-gap blitz','B-gap blitz','C-gap blitz','Edge blitz','Custom…'];
var STUNTS={'TEX — DE in / DT contain':1,'ET — DT in / DE contain':1,'Twist — DTs cross':1};
var ZONECOV={'Deep ⅓':1,'Deep ½':1,'Deep ¼':1,'Deep Mid':1,'Deep MOF':1,'Flat':1,'Quarter Flat':1,'Curl/Flat':1,'Hook/Curl':1,'Hook':1,'Seam/Wall':1,'Wall 2':1,'Match 3':1,'Hole':1};

function playerById(id){for(var i=0;i<players.length;i++){if(players[i].id===id)return players[i];}return null;}
function defByLabel(lb){return players.filter(function(p){return p.color===D&&p.label===lb;});}
function ensureIds(){var mx=0;players.forEach(function(p){if(typeof p.id!=='number')p.id=nextId();if(p.id>mx)mx=p.id;});if(mx>uid)uid=mx;}

function targetForRole(p,role){
  var s=p.x<ballX?-1:1,L=LOS,r=R(),D12=Math.round(12*YD_V);
  var Ag=OL_G*0.5,Bg=OL_G+OL_T*0.5,Cg=OL_G+OL_T+r*1.3,Dg=OL_G+OL_T+r*3.2;
  var manT=(function(){var rc=getReceivers();if(!rc.length)return{x:p.x,y:L-Math.round(5*YD_V)};var b=rc[0],bd=1e9;rc.forEach(function(q){var d=Math.abs(q.x-p.x);if(d<bd){bd=d;b=q;}});return{x:b.x,y:b.y};})();
  var m={
    'A gap':{x:ballX+s*Ag,y:L},'B gap':{x:ballX+s*Bg,y:L},
    'C gap':{x:ballX+s*Cg,y:L},'D gap':{x:ballX+s*Dg,y:L},
    'Force':{x:ballX+s*(Dg+r*2),y:L-Math.round(1.5*YD_V)},
    'Contain':{x:ballX+s*(Dg+r*2.5),y:L-Math.round(2*YD_V)},
    'Spill':{x:ballX+s*Ag,y:L,curve:true},
    'Fill':{x:ballX+s*Ag,y:L},
    'Cutback':{x:ballX-s*Bg,y:L,curve:true},
    'Box/Alley':{x:ballX+s*(Cg+r*2),y:L-Math.round(3*YD_V)},
    'A rush':{x:ballX+s*Ag,y:L-Math.round(0.5*YD_V)},
    'B rush':{x:ballX+s*Bg,y:L-Math.round(0.5*YD_V)},
    'C rush':{x:ballX+s*Cg,y:L-Math.round(0.5*YD_V)},
    'Slant ←':{x:p.x-OL_T,y:L},'Slant →':{x:p.x+OL_T,y:L},
    'Loop ←':{x:p.x-OL_T*1.2,y:L,curve:true},'Loop →':{x:p.x+OL_T*1.2,y:L,curve:true},
    'Deep ⅓':{x:p.x,y:L-D12},'Deep ½':{x:p.x,y:L-D12},'Deep ¼':{x:p.x,y:L-D12},'Deep MOF':{x:W/2,y:L-D12},
    'Flat':{x:p.x+s*Math.round(6*YD),y:L-Math.round(3*YD_V)},
    'Curl/Flat':{x:p.x+s*Math.round(3*YD),y:L-Math.round(7*YD_V)},
    'Hook/Curl':{x:p.x,y:L-Math.round(7*YD_V)},
    'Hook':{x:p.x,y:L-Math.round(6*YD_V)},
    'Seam/Wall':{x:p.x,y:L-Math.round(9*YD_V)},
    'Man':manT,'Spy':{x:p.x,y:L-Math.round(4*YD_V)},
    'Robber':{x:ballX,y:L-Math.round(6*YD_V)},
    'Blitz':{x:ballX+s*Ag,y:L},
    'Wall 2':{x:p.x+s*Math.round(2*YD),y:L-Math.round(5*YD_V)},
    'Match 3':{x:ballX,y:L-Math.round(5*YD_V)},
    'Hole':{x:ballX,y:L-Math.round(5*YD_V)},
    'Quarter Flat':{x:p.x+s*Math.round(3*YD),y:L-Math.round(6*YD_V)},
    'Deep Mid':{x:W/2,y:L-Math.round(12*YD_V)},
    'A-gap blitz':{x:ballX+s*Ag,y:L},'B-gap blitz':{x:ballX+s*Bg,y:L},
    'C-gap blitz':{x:ballX+s*Cg,y:L},'Edge blitz':{x:ballX+s*(Dg+r*1.5),y:L-Math.round(1*YD_V)}
  };
  return m[role]||{x:p.x,y:L-Math.round(5*YD_V)};
}

function drawCurvedArrow(x1,y1,x2,y2,col){
  var dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1;
  var nx=-dy/len,ny=dx/len,off=Math.min(45,len*0.45);
  var cx=(x1+x2)/2+nx*off,cy=(y1+y2)/2+ny*off;
  ctx.save();ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=2.5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(cx,cy,x2,y2);ctx.stroke();
  var ang=Math.atan2(y2-cy,x2-cx);
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-13*Math.cos(ang-0.4),y2-13*Math.sin(ang-0.4));
  ctx.lineTo(x2-13*Math.cos(ang+0.4),y2-13*Math.sin(ang+0.4));
  ctx.closePath();ctx.fill();ctx.restore();
}
function tagLum(col){var h=col.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];var r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);return (0.299*r+0.587*g+0.114*b)/255;}
function drawTag(x,y,text,col){
  ctx.save();
  var fsz=Math.max(10,Math.round(W/76));
  ctx.font='bold '+fsz+'px sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  var tw=ctx.measureText(text).width+10,th=fsz+7;
  var lift=R()+Math.round(th*0.65),ty=defView?(y+lift):(y-lift);
  var bx=x-tw/2,by=ty-th/2;
  ctx.fillStyle=tagLum(col)>0.6?'rgba(12,12,12,0.92)':'rgba(248,248,248,0.96)';
  ctx.beginPath();if(ctx.roundRect){ctx.roundRect(bx,by,tw,th,4);}else{ctx.rect(bx,by,tw,th);}ctx.fill();
  ctx.lineWidth=1.5;ctx.strokeStyle=col;ctx.stroke();
  ctx.fillStyle=col;fillTextU(text,x,ty);
  ctx.restore();
}
function drawAssign(a){
  var p=playerById(a.pid);if(!p)return;
  var col=kindCol(a.kind);
  if(a.targetPid!=null){var rec=playerById(a.targetPid);if(rec){a.tx=rec.x;a.ty=rec.y;drawArrow(p.x,p.y,rec.x,rec.y,col);drawTag(rec.x,rec.y,a.role,col);}return;}
  if(a.shape==='circle'){
    ctx.save();
    ctx.strokeStyle=col;ctx.globalAlpha=0.45;ctx.lineWidth=1.5;ctx.setLineDash([2,3]);
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(a.tx,a.ty);ctx.stroke();
    ctx.globalAlpha=0.8;ctx.setLineDash([5,4]);
    ctx.beginPath();ctx.ellipse(a.tx,a.ty,a.rx||Math.round(W*0.08),a.ry||Math.round(4.5*YD_V),0,0,Math.PI*2);
    ctx.lineWidth=1.5;ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
    ctx.fillStyle=col;ctx.font='bold '+Math.max(9,Math.round(W/90))+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    fillTextU(a.role,a.tx,a.ty);
    ctx.restore();
    return;
  }
  if(a.curve)drawCurvedArrow(p.x,p.y,a.tx,a.ty,col);
  else drawArrow(p.x,p.y,a.tx,a.ty,col);
  drawTag(a.tx,a.ty,a.role,col);
}
function drawZone(z){
  ctx.save();
  ctx.beginPath();ctx.ellipse(z.x,z.y,z.rx,z.ry,0,0,Math.PI*2);
  ctx.fillStyle='rgba(200,205,210,0.12)';ctx.fill();
  ctx.strokeStyle='rgba(210,215,220,0.8)';ctx.lineWidth=1.5;ctx.setLineDash([5,4]);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(245,248,250,0.95)';
  ctx.font='bold '+Math.max(9,Math.round(W/82))+'px sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  fillTextU(z.label,z.x,z.y);
  ctx.restore();
}

function hitAssignHead(x,y){for(var i=assigns.length-1;i>=0;i--){if(Math.hypot(x-assigns[i].tx,y-assigns[i].ty)<15)return i;}return -1;}
function hitAssign(x,y){
  for(var i=assigns.length-1;i>=0;i--){var a=assigns[i],p=playerById(a.pid);if(!p)continue;
    if(a.shape==='circle'){var ex=(x-a.tx)/(a.rx||30),ey=(y-a.ty)/(a.ry||20);if(ex*ex+ey*ey<=1.15)return i;continue;}
    var dx=a.tx-p.x,dy=a.ty-p.y,len=Math.hypot(dx,dy);if(len<1)continue;
    var t=Math.max(0,Math.min(1,((x-p.x)*dx+(y-p.y)*dy)/(len*len)));
    if(Math.hypot(x-p.x-t*dx,y-p.y-t*dy)<11)return i;
  }return -1;
}
function zoneVal(z,x,y){var dx=(x-z.x)/z.rx,dy=(y-z.y)/z.ry;return dx*dx+dy*dy;}
function hitZone(x,y){for(var i=zones.length-1;i>=0;i--){if(zoneVal(zones[i],x,y)<=1.2)return i;}return -1;}

function addAssign(pi,role,menuKind){
  var p=players[pi],blitz=/blitz/i.test(role);
  var phase=blitz?'both':(menuKind==='run'?'run':'pass');
  if(!blitz&&menuKind==='cover'&&isDeepRole(role))phase='both';
  var kind=blitz?'run':menuKind;
  saveH();clearForPhase(p.id,phase);
  var t=targetForRole(p,role);
  var a={pid:p.id,phase:phase,kind:kind,role:role,tx:Math.round(t.x),ty:Math.round(t.y),curve:!!t.curve};
  if(menuKind==='cover'&&ZONECOV[role]){a.shape='circle';a.rx=Math.round(W*0.08);a.ry=Math.round(4.5*YD_V);}
  assigns.push(a);

  var deepY=LOS-Math.round(14*YD_V),offY=LOS-Math.round(7*YD_V),uy=LOS-Math.round(5*YD_V),midY=LOS-Math.round(10*YD_V);
  var cbBase={'2':7,'3':10,'4':8,'palm':8,'6':8,'2man':5,'ripliz':10}[scheme]||7;
  var sg=cbBase>=7?1.5:(cbBase>=3?1:0.5);
  var bD=Math.max(1,cbBase-sg),fD=cbBase+sg;
  var cbDepL=hash<0?bD:hash>0?fD:cbBase,cbDepR=hash>0?bD:hash<0?fD:cbBase;
  var cbL=LOS-Math.round(cbDepL*YD_V),cbR=LOS-Math.round(cbDepR*YD_V);
  var dR=Math.round(W*0.095),dRy=Math.round(5*YD_V),uR=Math.round(W*0.07),uRy=Math.round(3.2*YD_V),qR=Math.round(W*0.08),hR=Math.round(W*0.13);
  var clL=loX+Math.round(span*0.16),clR=hiX-Math.round(span*0.16),strongCl=strong>0?clR:clL,weakCl=strong>0?clL:clR;
  var bxL=ballX-Math.round(span*0.13),bxR=ballX+Math.round(span*0.13);
  if(scheme==='3'){
    P(cbs[0],loX,cbL);P(cbs[1],hiX,cbR);
    P(fs,ballX-strong*Math.round(span*0.22),deepY);
    P(ss,ballX+strong*Math.round(span*0.22),deepY);
    P(nick,strongCl,uy);P(will,bxL,uy);P(mike,bxR,uy);
    setCov(cbs[0],'Deep ⅓',dR,dRy,loX,deepY);setCov(fs,'Deep ⅓',dR,dRy,ballX,deepY);setCov(cbs[1],'Deep ⅓',dR,dRy,hiX,deepY);
    setCov(nick,'Curl/Flat',uR,uRy);setCov(ss,'Curl/Flat',uR,uRy,weakCl,uy);setCov(will,'Hook',uR,uRy);setCov(mike,'Hook',uR,uRy);
  }else if(scheme==='2'){
    P(cbs[0],loX,cbL);P(cbs[1],hiX,cbR);
    P(fs,ballX-Math.round(span*0.26),deepY);P(ss,ballX+Math.round(span*0.26),deepY);
    P(nick,strongCl,uy);P(will,weakCl,uy);P(mike,ballX,midY);
    setCov(cbs[0],'Flat',uR,uRy);setCov(cbs[1],'Flat',uR,uRy);
    setCov(fs,'Deep ½',hR,dRy);setCov(ss,'Deep ½',hR,dRy);
    setCov(nick,'Hook',uR,uRy);setCov(will,'Hook',uR,uRy);
    setCov(mike,'Deep Mid',Math.round(W*0.085),Math.round(4*YD_V));
  }else if(scheme==='4'){
    P(cbs[0],loX,cbL);P(cbs[1],hiX,cbR);
    P(fs,ballX-Math.round(span*0.2),deepY);P(ss,ballX+Math.round(span*0.2),deepY);
    P(nick,strongCl,uy);P(will,weakCl,uy);P(mike,ballX,uy);
    setCov(cbs[0],'Deep ¼',qR,dRy,loX,deepY);setCov(cbs[1],'Deep ¼',qR,dRy,hiX,deepY);
    setCov(fs,'Deep ¼',qR,dRy);setCov(ss,'Deep ¼',qR,dRy);
    setCov(nick,'Quarter Flat',uR,uRy);setCov(will,'Quarter Flat',uR,uRy);setCov(mike,'Hook',uR,uRy);
  }else if(scheme==='palm'){
    P(cbs[0],loX,cbL);P(cbs[1],hiX,cbR);
    P(fs,ballX-Math.round(span*0.2),deepY);P(ss,ballX+Math.round(span*0.2),deepY);
    P(nick,strongCl,uy);P(will,weakCl,uy);P(mike,ballX,uy);
    setCov(cbs[0],'Deep ¼',qR,dRy,loX,deepY);setCov(cbs[1],'Deep ¼',qR,dRy,hiX,deepY);
    setCov(fs,'Deep ¼',qR,dRy);setCov(ss,'Deep ¼',qR,dRy);
    setCov(nick,'Wall 2',uR,uRy);setCov(will,'Hook/Curl',uR,uRy);setCov(mike,'Match 3',uR,uRy);
  }else if(scheme==='6'){
    // Quarter-quarter-half: field plays Quarters, boundary plays Cover 2
    var fS=ballX<W/2?1:-1,fCl=fS>0?clR:clL;
    var fCB=fS>0?cbs[1]:cbs[0],bCB=fS>0?cbs[0]:cbs[1];
    var fSaf=fS>0?ss:fs,bSaf=fS>0?fs:ss,fX=fS>0?hiX:loX,bX=fS>0?loX:hiX;
    P(fCB,fX,cbR);P(fSaf,ballX+fS*Math.round(span*0.2),deepY);
    setCov(fCB,'Deep ¼',qR,dRy,fX,deepY);setCov(fSaf,'Deep ¼',qR,dRy,ballX+fS*Math.round(span*0.22),deepY);
    P(bCB,bX,LOS-Math.round(5*YD_V));P(bSaf,ballX-fS*Math.round(span*0.26),deepY);
    setCov(bCB,'Flat',uR,uRy,bX,uy);setCov(bSaf,'Deep ½',hR,dRy,ballX-fS*Math.round(span*0.26),deepY);
    P(nick,fCl,uy);P(will,bxL,uy);P(mike,bxR,uy);
    setCov(nick,'Curl/Flat',uR,uRy,fCl,uy);setCov(will,'Hook',uR,uRy);setCov(mike,'Hook',uR,uRy);
  }else if(scheme==='2man'){
    // Two deep halves with man-under trail technique
    manScheme='2man';
    P(fs,ballX-Math.round(span*0.26),deepY);P(ss,ballX+Math.round(span*0.26),deepY);
    setCov(fs,'Deep ½',hR,dRy,ballX-Math.round(span*0.26),deepY);setCov(ss,'Deep ½',hR,dRy,ballX+Math.round(span*0.26),deepY);
    var rc=getReceivers();
    if(rc.length&&cbs[0]){alignOver(cbs[0],rc[0]);manOn(cbs[0],rc[0]);}
    if(rc.length>1&&cbs[1]){alignOver(cbs[1],rc[rc.length-1]);manOn(cbs[1],rc[rc.length-1]);}
    var mids=rc.slice(1,Math.max(1,rc.length-1)),pool=[nick,will,mike].filter(Boolean),mp=0;
    mids.forEach(function(r){var d=pool[mp++];if(d){alignOver(d,r);manOn(d,r);}});
    manScheme='';
  }else if(scheme==='ripliz'){
    // Matched Cover 3 (Rip/Liz): 3 deep thirds, seam/wall apex carries #2
    P(cbs[0],loX,cbL);P(cbs[1],hiX,cbR);
    P(fs,ballX,deepY);P(ss,ballX+strong*Math.round(span*0.22),deepY);
    P(nick,strongCl,uy);P(will,bxL,uy);P(mike,bxR,uy);
    setCov(cbs[0],'Deep ⅓',dR,dRy,loX,deepY);setCov(fs,'Deep ⅓',dR,dRy,ballX,deepY);setCov(cbs[1],'Deep ⅓',dR,dRy,hiX,deepY);
    setCov(nick,'Seam/Wall',uR,uRy);setCov(ss,'Seam/Wall',uR,uRy,weakCl,uy);setCov(will,'Hook',uR,uRy);setCov(mike,'Hook',uR,uRy);
  }else if(scheme==='1'){
    manScheme='1';manCover(true);manScheme='';
    if(fs){fs.x=ballX-strong*Math.round(span*0.22);fs.y=deepY;}
    if(ss){ss.x=ballX+strong*Math.round(span*0.22);ss.y=deepY;}
    setCov(fs,'Deep MOF',hR,dRy,ballX,deepY);
  }else if(scheme==='0'){
    manScheme='0';manCover(false);manScheme='';
    if(fs){fs.x=ballX-strong*Math.round(span*0.22);fs.y=deepY;}
    if(ss){ss.x=ballX+strong*Math.round(span*0.22);ss.y=deepY;}
  }
  assigns.forEach(function(a){
    if(a.shape!=='circle')return;
    for(var i=0;i<zones.length;i++){if(zones[i].label===a.role){zones[i].x=a.tx;zones[i].y=a.ty;break;}}
  });
  render();
}

/* ---- Offense route tree (placeable + adjustable stem) ---- */
var ROUTES=['Hitch','Slant','Flat','Out','In (Dig)','Curl','Comeback','Corner','Post','Go (Fly)','Seam','Wheel','Drag','Screen'];
function defStem(c){var s={'Hitch':6,'Slant':3,'Flat':1,'Out':8,'In (Dig)':10,'Curl':10,'Comeback':13,'Corner':10,'Post':10,'Go (Fly)':14,'Seam':14,'Wheel':3,'Drag':2,'Screen':0}[c];return Math.round((s==null?8:s)*YD_V);}
function routePoints(p,c,stem){
  var x=p.x,y=p.y,outDir=x<W/2?-1:1,inDir=-outDir;
  var brk=Math.round(6*YD),dz=Math.round(7*YD),by=y-stem;
  switch(c){
    case 'Go (Fly)': case 'Seam': return [{x:x,y:y},{x:x,y:y-Math.max(stem,Math.round(16*YD_V))}];
    case 'Hitch': return [{x:x,y:y},{x:x,y:by},{x:x+inDir*Math.round(1.5*YD),y:by+Math.round(1.5*YD_V)}];
    case 'Slant': return [{x:x,y:y},{x:x,y:by},{x:x+inDir*dz,y:by-dz}];
    case 'Flat': return [{x:x,y:y},{x:x+outDir*Math.round(5*YD),y:by}];
    case 'Out': return [{x:x,y:y},{x:x,y:by},{x:x+outDir*brk,y:by}];
    case 'In (Dig)': return [{x:x,y:y},{x:x,y:by},{x:x+inDir*brk,y:by}];
    case 'Curl': return [{x:x,y:y},{x:x,y:by},{x:x+inDir*Math.round(2*YD),y:by+Math.round(2*YD_V)}];
    case 'Comeback': return [{x:x,y:y},{x:x,y:by},{x:x+outDir*Math.round(3*YD),y:by+Math.round(2.5*YD_V)}];
    case 'Corner': return [{x:x,y:y},{x:x,y:by},{x:x+outDir*dz,y:by-dz}];
    case 'Post': return [{x:x,y:y},{x:x,y:by},{x:x+inDir*dz,y:by-dz}];
    case 'Wheel': return [{x:x,y:y},{x:x+outDir*Math.round(5*YD),y:y-Math.round(1*YD_V)},{x:x+outDir*Math.round(6*YD),y:by-dz}];
    case 'Drag': return [{x:x,y:y},{x:x+inDir*Math.round(10*YD),y:y-Math.round(3*YD_V)}];
    case 'Screen': return [{x:x,y:y},{x:x+outDir*Math.round(3*YD),y:y+Math.round(2*YD_V)}];
    default: return [{x:x,y:y},{x:x,y:by}];
  }
}
function drawTree(r){
  var pl=playerById(r.pid);if(!pl)return;
  var pts=routePoints(pl,r.concept,r.stem);
  ctx.strokeStyle=r.col;ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();pts.forEach(function(p,i){i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);});ctx.stroke();
  var a=pts[pts.length-2],b=pts[pts.length-1],ang=Math.atan2(b.y-a.y,b.x-a.x);
  ctx.fillStyle=r.col;ctx.beginPath();ctx.moveTo(b.x,b.y);
  ctx.lineTo(b.x-11*Math.cos(ang-0.4),b.y-11*Math.sin(ang-0.4));
  ctx.lineTo(b.x-11*Math.cos(ang+0.4),b.y-11*Math.sin(ang+0.4));
  ctx.closePath();ctx.fill();
  if(tool==='assign'&&play==='pass'){var hb=pts[1]||b;ctx.fillStyle='#fff';ctx.strokeStyle=r.col;ctx.lineWidth=2;ctx.beginPath();ctx.arc(hb.x,hb.y,5,0,Math.PI*2);ctx.fill();ctx.stroke();}
}
function hitStem(x,y){
  for(var i=routes.length-1;i>=0;i--){if(routes[i].type!=='tree')continue;var pl=playerById(routes[i].pid);if(!pl)continue;var pts=routePoints(pl,routes[i].concept,routes[i].stem);var b=pts[1]||pts[pts.length-1];if(Math.hypot(x-b.x,y-b.y)<14)return i;}return -1;
}
function addRoute(pi,concept){
  var p=players[pi];saveH();
  routes=routes.filter(function(r){return !(r.type==='tree'&&r.pid===p.id);});
  routes.push({type:'tree',pid:p.id,concept:concept,stem:defStem(concept),col:'#5af'});
  closeMenu();render();
}
function openRouteMenu(pi,pos){
  ctxMenu.innerHTML='';
  var t=document.createElement('div');t.className='ttl';t.textContent=players[pi].label+' · Route';ctxMenu.appendChild(t);
  ROUTES.forEach(function(rc){var b=document.createElement('button');b.textContent=rc;b.addEventListener('click',function(ev){ev.stopPropagation();addRoute(pi,rc);});ctxMenu.appendChild(b);});
  ctxMenu.style.left=Math.max(4,Math.min(lastClient.x,window.innerWidth-180))+'px';
  ctxMenu.style.top=Math.max(4,Math.min(lastClient.y,window.innerHeight-340))+'px';
  ctxMenu.classList.add('open');
}
</script>
